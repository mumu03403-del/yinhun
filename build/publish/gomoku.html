<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<title>银魂 · 五子棋</title>
<style>
  :root {
    --bg:#0b0e14; --panel:#141b28; --line:#2a3550; --gold:#e8c15a; --gold2:#ffd23a;
    --red:#d84a3b; --blue:#3aa7d8; --paper:#f2ead8; --dim:#8a93ad; --wood:#6b4a2b;
    --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","STSong","SimSun",serif;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;            /* black letterbox behind the 812x375 stage */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #cv { display: block; position: absolute; top: 0; left: 0; background: #000; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="assets/js/social.js" defer></script>
<script src="assets/js/audio.js" defer></script>
<script>
(function () {
  "use strict";

  /* ===================== 基础常量 ===================== */
  var W = 812, H = 375;
  var C = {
    bg: '#0b0e14', panel: '#141b28', line: '#2a3550', gold: '#e8c15a', gold2: '#ffd23a',
    red: '#d84a3b', blue: '#3aa7d8', paper: '#f2ead8', dim: '#8a93ad', wood: '#6b4a2b'
  };
  var SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","STSong","SimSun",serif';

  var cv = document.getElementById('cv');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  /* ===================== 五子棋几何 ===================== */
  var GOMOKU_N = 13, GS = 22, GOMOKU_PAD = 16;
  var BOARD_SPAN = (GOMOKU_N - 1) * GS;            // 264
  var FRAME_X = 28, FRAME_Y = 56;
  var OX = FRAME_X + GOMOKU_PAD, OY = FRAME_Y + GOMOKU_PAD;   // 首个交叉点
  var FRAME_W = BOARD_SPAN + GOMOKU_PAD * 2;        // 296
  var FRAME_H = FRAME_W;
  var STARS = [3, 6, 9];

  /* ===================== 角色 ===================== */
  var CHARS = [
    { name: '坂田银时', file: '01_坂田银时.png' },
    { name: '志村新八', file: '02_志村新八.png' },
    { name: '神乐',     file: '03_神乐.png' },
    { name: '近藤勋',   file: '05_近藤勋.png' },
    { name: '土方十四郎', file: '06_土方十四郎.png' },
    { name: '冲田总悟',  file: '07_冲田总悟.png' }
  ];
  var charImgs = {};
  CHARS.forEach(function (c) {
    var im = new Image();
    im.onload = function () {};
    im.onerror = function () {};
    im.src = 'assets/codex/' + c.file;
    charImgs[c.name] = im;
  });
  function indexOfChar(n) { for (var i = 0; i < CHARS.length; i++) if (CHARS[i].name === n) return i; return 0; }

  /* ===================== 状态 ===================== */
  var screen = 'mode';                  // 'mode' -> 'char' -> 'play'
  var gomokuMode = 'pve';               // 'pve' | 'pvp' | 'practice'
  var chosenChar = '坂田银时';
  var selChar = 0, hoverChar = -1;
  var gomokuBoard = [], gomokuTurn = 1, gomokuOver = false, gomokuResult = '';
  var pressBtn = null, toast = null, aiTimer = null;

  /* ===================== 战绩持久化 ===================== */
  var GOMOKU_REC_KEY = 'gomoku_records_v1';
  var gomokuRecords = {
    pve: { win: 0, loss: 0, draw: 0 },
    pvp: { win: 0, loss: 0, draw: 0 },
    practice: { win: 0, loss: 0, draw: 0 }
  };
  function loadGomokuRecords() {
    try {
      var r = JSON.parse(localStorage.getItem(GOMOKU_REC_KEY));
      if (r && r.pve && r.pvp && r.practice &&
          typeof r.pve.win === 'number') {
        gomokuRecords = {
          pve: r.pve || gomokuRecords.pve,
          pvp: r.pvp || gomokuRecords.pvp,
          practice: r.practice || gomokuRecords.practice
        };
      }
    } catch (e) {}
  }
  function saveGomokuRecords() {
    try { localStorage.setItem(GOMOKU_REC_KEY, JSON.stringify(gomokuRecords)); } catch (e) {}
  }

  /* ===================== 音频守卫（GinAudio 可能缺失/禁用） ===================== */
  function gaVoice(n) { if (window.GinAudio && GinAudio.playVoice) { try { GinAudio.playVoice(n); } catch (e) {} } }
  function gaSfx(n)   { if (window.GinAudio && GinAudio.playSfx)   { try { GinAudio.playSfx(n);   } catch (e) {} } }
  function gaBlip()   { if (window.GinAudio && GinAudio.blip)      { try { GinAudio.blip();        } catch (e) {} } }

  /* ===================== 五子棋核心逻辑 ===================== */
  function resetGomoku() {
    gomokuBoard = [];
    for (var r = 0; r < GOMOKU_N; r++) {
      var row = [];
      for (var c = 0; c < GOMOKU_N; c++) row.push(0);
      gomokuBoard.push(row);
    }
    gomokuTurn = 1; gomokuOver = false; gomokuResult = '';
    if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
  }

  function gomokuWin(b, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < GOMOKU_N; r++) {
      for (var c = 0; c < GOMOKU_N; c++) {
        if (b[r][c] !== who) continue;
        for (var di = 0; di < dirs.length; di++) {
          var dr = dirs[di][0], dc = dirs[di][1];
          var pr = r - dr, pc = c - dc;
          if (pr >= 0 && pr < GOMOKU_N && pc >= 0 && pc < GOMOKU_N && b[pr][pc] === who) continue;
          var cnt = 0, rr = r, cc = c;
          while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && b[rr][cc] === who) { cnt++; rr += dr; cc += dc; }
          if (cnt >= 5) return true;
        }
      }
    }
    return false;
  }

  function gomokuRun(r, c, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    var max = 1;
    for (var di = 0; di < dirs.length; di++) {
      var dr = dirs[di][0], dc = dirs[di][1], cnt = 1;
      var rr = r + dr, cc = c + dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) { cnt++; rr += dr; cc += dc; }
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) { cnt++; rr -= dr; cc -= dc; }
      if (cnt > max) max = cnt;
    }
    return max;
  }

  function gomokuEval(r, c, who) { return Math.pow(10, Math.max(0, gomokuRun(r, c, who) - 1)); }

  function gomokuBoardFull() {
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] === 0) return false;
    return true;
  }

  function recKey() { return gomokuMode === 'pvp' ? 'pvp' : (gomokuMode === 'practice' ? 'practice' : 'pve'); }

  function gomokuRecordResult(who) {
    var k = recKey();
    if (who === 0) gomokuRecords[k].draw++;
    else if (who === 1) gomokuRecords[k].win++;
    else gomokuRecords[k].loss++;
    saveGomokuRecords();
  }

  function gomokuAfterMove(who) {
    if (gomokuWin(gomokuBoard, who)) {
      gomokuOver = true;
      if (gomokuMode === 'pvp') gomokuResult = who === 1 ? '玩家1胜' : '玩家2胜';
      else if (gomokuMode === 'practice') gomokuResult = who === 1 ? '金方胜' : '红方胜';
      else gomokuResult = who === 1 ? '玩家胜' : '敌方胜';
      gomokuRecordResult(who);
      return;
    }
    if (gomokuBoardFull()) { gomokuOver = true; gomokuResult = '平局'; gomokuRecordResult(0); }
  }

  function aiGomokuMove() {
    if (gomokuOver || gomokuTurn !== 2) return;
    var cands = [], anyStone = false;
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] !== 0) anyStone = true;
    for (var r2 = 0; r2 < GOMOKU_N; r2++) {
      for (var c2 = 0; c2 < GOMOKU_N; c2++) {
        if (gomokuBoard[r2][c2] !== 0) continue;
        if (!anyStone) { cands.push([r2, c2]); continue; }
        var near = false;
        for (var dr = -2; dr <= 2; dr++)
          for (var dc = -2; dc <= 2; dc++) {
            var rr = r2 + dr, cc = c2 + dc;
            if (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] !== 0) near = true;
          }
        if (near) cands.push([r2, c2]);
      }
    }
    if (cands.length === 0) return;
    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0], c = cands[i][1];
      gomokuBoard[r][c] = 2;
      if (gomokuWin(gomokuBoard, 2)) { gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[r][c] = 0;
    }
    for (var j = 0; j < cands.length; j++) {
      var rr2 = cands[j][0], cc2 = cands[j][1];
      gomokuBoard[rr2][cc2] = 1;
      if (gomokuWin(gomokuBoard, 1)) { gomokuBoard[rr2][cc2] = 2; gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[rr2][cc2] = 0;
    }
    var best = null, bestScore = -1;
    for (var k = 0; k < cands.length; k++) {
      var r3 = cands[k][0], c3 = cands[k][1];
      var score = gomokuEval(r3, c3, 2) + gomokuEval(r3, c3, 1) * 0.95;
      score -= (Math.abs(r3 - GOMOKU_N / 2) + Math.abs(c3 - GOMOKU_N / 2)) * 0.01;
      if (score > bestScore) { bestScore = score; best = [r3, c3]; }
    }
    if (best) { gomokuBoard[best[0]][best[1]] = 2; gomokuAfterMove(2); }
    if (!gomokuOver) gomokuTurn = 1;
  }

  function gomokuCellAt(p) {
    var c = Math.round((p.x - OX) / GS), r = Math.round((p.y - OY) / GS);
    if (r < 0 || r >= GOMOKU_N || c < 0 || c >= GOMOKU_N) return null;
    var px = OX + c * GS, py = OY + r * GS;
    if (Math.abs(p.x - px) > GS * 0.5 || Math.abs(p.y - py) > GS * 0.5) return null;
    return { r: r, c: c };
  }

  function placeStone(r, c) {
    if (gomokuOver) return;
    if (gomokuBoard[r][c] !== 0) return;
    var who = gomokuTurn;
    gomokuBoard[r][c] = who;
    gaSfx('sfx_merge');
    gomokuAfterMove(who);
    if (gomokuOver) { onGameEnd(); return; }
    gomokuTurn = who === 1 ? 2 : 1;
    if (gomokuMode === 'pve' && gomokuTurn === 2) {
      aiTimer = setTimeout(function () {
        if (!gomokuOver) { aiGomokuMove(); if (gomokuOver) onGameEnd(); }
      }, 380);
    }
  }

  function onGameEnd() {
    gaSfx('sfx_settle');
    if (gomokuResult.indexOf('胜') >= 0) {
      var win = gomokuResult.indexOf('玩家胜') >= 0 || gomokuResult.indexOf('玩家1胜') >= 0 ||
                gomokuResult.indexOf('金方胜') >= 0 || gomokuResult.indexOf('你方胜') >= 0;
      if (win) gaVoice(chosenChar);
      setToast(gomokuResult + (gomokuMode === 'pve' && win ? ' · 段位 +1' : ''), 2.6);
    } else setToast('平局', 2.2);
  }

  function setToast(t, dur) { toast = { text: t, t: dur || 2.2 }; }

  /* ===================== 绘制工具 ===================== */
  function rr(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return false;
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    return true;
  }
  function fillRR(x, y, w, h, r, color) { if (!rr(x, y, w, h, r)) return; ctx.fillStyle = color; ctx.fill(); }
  function strokeRR(x, y, w, h, r, color, lw) { if (!rr(x, y, w, h, r)) return; ctx.strokeStyle = color; ctx.lineWidth = lw || 2; ctx.stroke(); }
  function text(str, x, y, size, color, align, weight, font) {
    ctx.font = (weight || '600') + ' ' + size + 'px ' + (font || '-apple-system,"PingFang SC","Microsoft YaHei",sans-serif');
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function shade(hex, k) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    if (k >= 0) { r = Math.round(r + (255 - r) * k); g = Math.round(g + (255 - g) * k); b = Math.round(b + (255 - b) * k); }
    else { r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k)); }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function drawButton(b, label, color, primary) {
    var pressed = pressBtn === b;
    var oy = pressed ? 2 : 0;
    var r = 12;
    fillRR(b.x, b.y + oy, b.w, b.h, r, pressed ? shade(color, -0.22) : shade(color, -0.12));
    var g = ctx.createLinearGradient(0, b.y + oy, 0, b.y + b.h - 3 + oy);
    g.addColorStop(0, 'rgba(255,255,255,0.20)');
    g.addColorStop(1, color);
    if (rr(b.x, b.y + oy, b.w, b.h - 3, r)) { ctx.fillStyle = g; ctx.fill(); }
    strokeRR(b.x, b.y + oy, b.w, b.h, r, 'rgba(11,14,20,0.85)', 2);
    if (primary) strokeRR(b.x + 1.5, b.y + oy + 1.5, b.w - 3, b.h - 3, r - 1, 'rgba(232,193,90,0.9)', 2);
    text(label, b.x + b.w / 2, b.y + b.h / 2 - 1 + oy, 16, '#ffffff', 'center', '700');
  }

  // 青海波纹（seigaiha）：低透明度金色同心弧
  function drawSeigaiha() {
    var R = 26;
    var cols = Math.ceil(W / R) + 2;
    var rows = Math.ceil(H / R) + 2;
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = C.gold;
    ctx.lineWidth = 1.4;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cx = c * R * 2 - R, cy = r * R * 2 - R + (c % 2 ? R : 0);
        for (var k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.arc(cx, cy, R * k * 0.5, Math.PI, 0);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawStone(px, py, side) {
    var rad = GS * 0.42;
    var col = side === 1 ? C.gold : (gomokuMode === 'pvp' ? C.blue : C.red);
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    var g = ctx.createRadialGradient(px - rad * 0.3, py - rad * 0.3, rad * 0.2, px, py, rad);
    g.addColorStop(0, side === 1 ? '#fff0bf' : (gomokuMode === 'pvp' ? '#bfe6ff' : '#ff9a8c'));
    g.addColorStop(1, col);
    ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(11,14,20,0.85)';
    ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = side === 1 ? C.gold2 : (gomokuMode === 'pvp' ? '#bfe6ff' : '#ff9a8c');
    ctx.beginPath(); ctx.arc(px, py, rad * 0.62, 0, Math.PI * 2); ctx.stroke();
  }

  /* ===================== 顶部导航（所有界面） ===================== */
  var NAV_BACK = { x: 12, y: 10, w: 104, h: 30 };
  var NAV_FRIEND = { x: W - 116, y: 10, w: 104, h: 30 };
  function drawTopBar() {
    drawButton(NAV_BACK, '返回首页', C.panel, false);
    drawButton(NAV_FRIEND, '好友', C.panel, false);
  }

  /* ===================== 界面 1：模式选择 ===================== */
  var MODE_BTNS = [
    { mode: 'pve', label: '人机对战', x: 30, y: 150, w: 240, h: 74 },
    { mode: 'pvp', label: '双人对战', x: 286, y: 150, w: 240, h: 74 },
    { mode: 'practice', label: '练习模式', x: 542, y: 150, w: 240, h: 74 }
  ];
  function drawModeSelect() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    drawSeigaiha();
    text('银魂 · 五子棋', W / 2, 54, 30, '#ffffff', 'center', '800', SERIF);
    text('选择对战模式', W / 2, 92, 14, C.dim, 'center', '500');
    for (var i = 0; i < MODE_BTNS.length; i++) {
      var b = MODE_BTNS[i];
      var active = gomokuMode === b.mode;
      drawButton(b, b.label, C.gold, active);
      if (active) text('▶', b.x + b.w - 18, b.y + b.h / 2, 16, C.bg, 'center', '800');
    }
    var hint = gomokuMode === 'pve' ? '你执金子，AI 执赤子' :
               (gomokuMode === 'pvp' ? '双人同屏，轮流落子' : '自由练习，无对手，练手感');
    text(hint, W / 2, 252, 13, C.gold2, 'center', '600');
    var rec = gomokuRecords;
    text('战绩  人机 ' + rec.pve.win + '胜' + rec.pve.loss + '负' + rec.pve.draw + '平   ·   双人 ' +
         rec.pvp.win + '胜' + rec.pvp.loss + '负' + rec.pvp.draw + '平   ·   练习 ' +
         rec.practice.win + '胜' + rec.practice.loss + '负' + rec.practice.draw + '平',
         W / 2, 300, 12, '#9fe0ff', 'center', '600');
    drawTopBar();
  }

  /* ===================== 界面 2：角色选择 ===================== */
  var CH_W = 236, CH_H = 108, CH_GAPX = 16, CH_GAPY = 16, CH_X0 = 40, CH_Y0 = 86;
  function charCardRect(i) {
    var col = i % 3, row = Math.floor(i / 3);
    return { x: CH_X0 + col * (CH_W + CH_GAPX), y: CH_Y0 + row * (CH_H + CH_GAPY), w: CH_W, h: CH_H };
  }
  var CHAR_BACK = { x: 40, y: 330, w: 200, h: 36 };
  var CHAR_START = { x: 572, y: 330, w: 200, h: 36 };
  function drawCharSelect() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    drawSeigaiha();
    text('选择你的角色', W / 2, 46, 26, '#ffffff', 'center', '800', SERIF);
    text('点击卡片试听角色语音 · 选定后开始对战', W / 2, 70, 12, C.dim, 'center', '500');
    for (var i = 0; i < CHARS.length; i++) {
      var b = charCardRect(i), ch = CHARS[i];
      var sel = (CHARS[selChar].name === ch.name);
      var hov = (hoverChar === i);
      fillRR(b.x, b.y, b.w, b.h, 12, sel ? shade(C.gold, -0.55) : C.panel);
      strokeRR(b.x, b.y, b.w, b.h, 12, sel ? C.gold2 : (hov ? 'rgba(232,193,90,0.6)' : C.line), sel ? 2.5 : 1.5);
      var im = charImgs[ch.name];
      var px = b.x + 10, py = b.y + 10, pw = 88, ph = b.h - 20;
      if (im && im.complete && im.naturalWidth) {
        ctx.save(); rr(px, py, pw, ph, 8); ctx.clip(); ctx.drawImage(im, px, py, pw, ph); ctx.restore();
        strokeRR(px, py, pw, ph, 8, C.line, 1);
      } else {
        fillRR(px, py, pw, ph, 8, C.wood);
        text(ch.name.charAt(0), px + pw / 2, py + ph / 2, 40, '#fff', 'center', '800', SERIF);
      }
      text(ch.name, b.x + 10 + pw + 14, b.y + b.h / 2, 20, sel ? C.gold2 : '#fff', 'left', '800', SERIF);
      if (sel) text('已选', b.x + b.w - 38, b.y + b.h / 2, 14, C.gold2, 'center', '700');
    }
    drawButton(CHAR_BACK, '返回模式', C.panel, false);
    drawButton(CHAR_START, '开始对战', C.gold, true);
    drawTopBar();
  }

  /* ===================== 界面 3：对局 ===================== */
  var PB_BACK = { x: 596, y: 248, w: 188, h: 42 };
  var PB_RESTART = { x: 596, y: 300, w: 188, h: 42 };

  function drawBanner() {
    var bw = 300, bh = 40, bx = (W - bw) / 2, by = 14;
    fillRR(bx, by, bw, bh, 10, 'rgba(20,27,40,0.9)');
    strokeRR(bx, by, bw, bh, 10, C.gold, 1.5);
    var im = charImgs[chosenChar];
    var ipx = bx + 6, ipy = by + 5, ips = 30;
    if (im && im.complete && im.naturalWidth) {
      ctx.save(); rr(ipx, ipy, ips, ips, 6); ctx.clip(); ctx.drawImage(im, ipx, ipy, ips, ips); ctx.restore();
    } else {
      fillRR(ipx, ipy, ips, ips, 6, C.wood);
      text(chosenChar.charAt(0), ipx + ips / 2, ipy + ips / 2, 18, '#fff', 'center', '800', SERIF);
    }
    text('你的角色：' + chosenChar, bx + ips + 14, by + bh / 2, 16, C.gold2, 'left', '800', SERIF);
  }

  function drawPanel() {
    var px = 344, py = 56, pw = W - px - 16, ph = H - py - 16;
    fillRR(px, py, pw, ph, 12, C.panel);
    strokeRR(px, py, pw, ph, 12, C.line, 1.5);
    var modeName = gomokuMode === 'pve' ? '人机对战' : (gomokuMode === 'pvp' ? '双人对战' : '练习模式');
    text('五子棋', px + 16, py + 24, 20, '#fff', 'left', '800', SERIF);
    text(modeName, px + 92, py + 24, 14, C.gold2, 'left', '600');
    var curName = (gomokuTurn === 1) ? chosenChar : (gomokuMode === 'pvp' ? '玩家2' : (gomokuMode === 'practice' ? '红方' : '敌方'));
    var prompt = gomokuOver ? ('结果：' + gomokuResult)
              : (gomokuMode === 'pve' && gomokuTurn === 2 ? '敌方思考中…' : '轮到 ' + curName + ' 落子');
    text(prompt, px + 16, py + 70, 15,
         gomokuOver ? (gomokuResult.indexOf('胜') >= 0 ? C.gold2 : C.red) : '#f0e2a8', 'left', '700');
    var k = recKey(), rec = gomokuRecords[k];
    text('本模式战绩  ' + rec.win + '胜 ' + rec.loss + '负 ' + rec.draw + '平', px + 16, py + 110, 13, '#9fe0ff', 'left', '600');
    text('你：金子   对手：' + (gomokuMode === 'pvp' ? '蓝子' : '赤子'), px + 16, py + 140, 12, C.dim, 'left', '500');
    text('点击棋盘交叉点落子', px + 16, py + ph - 16, 11, C.dim, 'left', '500');
    drawButton(PB_BACK, '返回选单', C.panel, false);
    drawButton(PB_RESTART, '重新开始', C.gold, true);
  }

  function drawPlay() {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    drawSeigaiha();
    drawBanner();
    fillRR(FRAME_X, FRAME_Y, FRAME_W, FRAME_H, 14, 'rgba(20,27,40,0.94)');
    strokeRR(FRAME_X, FRAME_Y, FRAME_W, FRAME_H, 14, C.gold, 2);
    ctx.strokeStyle = C.gold; ctx.globalAlpha = 0.85; ctx.lineWidth = 1; ctx.beginPath();
    for (var i = 0; i < GOMOKU_N; i++) {
      var x = OX + i * GS; ctx.moveTo(x, OY); ctx.lineTo(x, OY + BOARD_SPAN);
      var y = OY + i * GS; ctx.moveTo(OX, y); ctx.lineTo(OX + BOARD_SPAN, y);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = C.gold2;
    for (var a = 0; a < STARS.length; a++)
      for (var b = 0; b < STARS.length; b++) {
        ctx.beginPath(); ctx.arc(OX + STARS[a] * GS, OY + STARS[b] * GS, 3, 0, Math.PI * 2); ctx.fill();
      }
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++) {
        var v = gomokuBoard[r][c];
        if (v === 0) continue;
        drawStone(OX + c * GS, OY + r * GS, v);
      }
    drawPanel();
    drawTopBar();
  }

  function drawToast() {
    if (!toast) return;
    ctx.font = '700 16px ' + SERIF;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var w = ctx.measureText(toast.text).width + 32;
    var x = W / 2 - w / 2, y = H - 44;
    fillRR(x, y, w, 30, 15, 'rgba(11,14,20,0.9)');
    strokeRR(x, y, w, 30, 15, C.gold, 1.5);
    text(toast.text, W / 2, y + 15, 16, C.paper, 'center', '700', SERIF);
  }

  /* ===================== 输入 ===================== */
  function toLogic(ev) {
    var r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left - view.ox) / view.scale, y: (ev.clientY - r.top - view.oy) / view.scale };
  }
  function hitBtn(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

  function screenButtonAt(p) {
    if (hitBtn(p, NAV_BACK)) return NAV_BACK;
    if (hitBtn(p, NAV_FRIEND)) return NAV_FRIEND;
    if (screen === 'mode') {
      for (var i = 0; i < MODE_BTNS.length; i++) if (hitBtn(p, MODE_BTNS[i])) return MODE_BTNS[i];
    } else if (screen === 'char') {
      if (hitBtn(p, CHAR_BACK)) return CHAR_BACK;
      if (hitBtn(p, CHAR_START)) return CHAR_START;
    } else if (screen === 'play') {
      if (hitBtn(p, PB_BACK)) return PB_BACK;
      if (hitBtn(p, PB_RESTART)) return PB_RESTART;
    }
    return null;
  }

  function updateHover(p) {
    if (screen !== 'char') { hoverChar = -1; return; }
    var idx = -1;
    for (var i = 0; i < CHARS.length; i++) if (hitBtn(p, charCardRect(i))) { idx = i; break; }
    if (idx !== hoverChar) {
      hoverChar = idx;
      if (idx >= 0) gaVoice(CHARS[idx].name);
    }
  }

  function handleTap(p) {
    if (hitBtn(p, NAV_BACK)) { gaBlip(); location.href = 'home.html'; return; }
    if (hitBtn(p, NAV_FRIEND)) { gaBlip(); if (window.GinSocial && GinSocial.open) { try { GinSocial.open('rank'); } catch (e) {} } return; }
    if (screen === 'mode') {
      for (var i = 0; i < MODE_BTNS.length; i++) {
        if (hitBtn(p, MODE_BTNS[i])) {
          gomokuMode = MODE_BTNS[i].mode;
          selChar = indexOfChar(chosenChar);
          gaBlip(); screen = 'char'; return;
        }
      }
    } else if (screen === 'char') {
      if (hitBtn(p, CHAR_BACK)) { gaBlip(); screen = 'mode'; return; }
      if (hitBtn(p, CHAR_START)) { gaBlip(); chosenChar = CHARS[selChar].name; screen = 'play'; resetGomoku(); return; }
      for (var j = 0; j < CHARS.length; j++) {
        if (hitBtn(p, charCardRect(j))) { selChar = j; gaVoice(CHARS[j].name); return; }
      }
    } else if (screen === 'play') {
      if (hitBtn(p, PB_BACK)) { gaBlip(); screen = 'mode'; return; }
      if (hitBtn(p, PB_RESTART)) { gaBlip(); resetGomoku(); return; }
      var cell = gomokuCellAt(p);
      if (cell) placeStone(cell.r, cell.c);
    }
  }

  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
    pressBtn = screenButtonAt(toLogic(ev));
  });
  cv.addEventListener('pointermove', function (ev) { updateHover(toLogic(ev)); });
  cv.addEventListener('pointerup', function (ev) {
    ev.preventDefault();
    handleTap(toLogic(ev));
    pressBtn = null;
  });
  cv.addEventListener('pointercancel', function () { pressBtn = null; });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ===================== 主循环 / 缩放 ===================== */
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var availW = window.innerWidth, availH = window.innerHeight;
    var scale = Math.min(availW / W, availH / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var ox = (availW - W * scale) / 2;
    var oy = (availH - H * scale) / 2;
    cv.width = Math.round(availW * dpr);
    cv.height = Math.round(availH * dpr);
    cv.style.width = availW + 'px';
    cv.style.height = availH + 'px';
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, ox * dpr, oy * dpr);
    view.scale = scale; view.ox = ox; view.oy = oy; view.dpr = dpr;
  }
  window.addEventListener('resize', resize);

  var lastFrame = 0;
  function update(dt) { if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; } }
  function render() {
    ctx.clearRect(0, 0, W, H);
    if (screen === 'mode') drawModeSelect();
    else if (screen === 'char') drawCharSelect();
    else drawPlay();
    drawToast();
  }
  function loop(ts) {
    var now = ts / 1000;
    var dt = lastFrame ? Math.min(0.1, now - lastFrame) : 0;
    lastFrame = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function boot() {
    resize();
    loadGomokuRecords();
    resetGomoku();
    requestAnimationFrame(loop);
  }
  boot();
})();
</script>
</body>
