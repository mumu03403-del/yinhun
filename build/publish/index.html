    position: absolute; left: 50%; top: 50%;

  ];

  var COIN_RATE = [1, 3, 9, 27, 81, 243, 729, 2187, 6561, 19683, 59049, 177147, 531441, 1594323, 4782969, 14348907, 43046721, 129140163, 387420489, 1162261467, 3486784401, 10460353203, 31381059609, 94143178827];

  var CHARACTER_NAMES = [

    { board: 'tier3.png',  codex: '03_神乐.png',       audio: 'voice_神乐.mp3' },

    { board: 'tier5.png',  codex: '05_近藤勋.png',     audio: 'voice_近藤勋.mp3' },
    { board: 'tier6.png',  codex: '06_土方十四郎.png', audio: 'voice_土方十四郎.mp3' },
    { board: 'tier7.png',  codex: '07_冲田总悟.png',   audio: 'voice_冲田总悟.mp3' },
    { board: 'tier8.png',  codex: '08_桂小太郎.png',   audio: 'voice_桂小太郎.mp3' },
    { board: 'tier9.png',  codex: '09_伊丽莎白.png',   audio: 'voice_伊丽莎白.mp3' },
    { board: 'tier10.png', codex: '10_高杉晋助.png',   audio: 'voice_高杉晋助.mp3' },
    { board: 'tier11.png', codex: '11_神威.png',       audio: 'voice_神威.mp3' },
    { board: 'tier12.png', codex: '12_虚_吉田松阳.png', audio: 'voice_虚吉田松阳.mp3' },
    { board: null, codex: '13_山崎退.png',   audio: null },
    { board: null, codex: '14_柳生九兵衛.png', audio: null },
    { board: null, codex: '15_月詠.png',      audio: null },
    { board: null, codex: '16_お登勢.png',    audio: null },
    { board: null, codex: '17_キャサリン.png', audio: null },
    { board: null, codex: '18_長谷川泰三.png', audio: null },

    { board: null, codex: '20_岡田似蔵.png',  audio: null },

    { board: null, codex: '23_幾松.png',      audio: null },
    { board: null, codex: '24_坂本辰馬.png',  audio: null }
  ];
  var INITIAL_UNITS = 6;

  // 离线收益：8 小时封顶，50% 效率
  var OFFLINE_CAP_SEC = 8 * 3600;
  var OFFLINE_EFFICIENCY = 0.5;
  var SAVE_KEY = 'merge_samurai_save_v1';

  // 12 档解锁门槛（通用映射，仅动作门槛，合并永远免费）：
  // 门槛必须严格递增：改前 13/16/19/22/24 的值 (5/8/12/18/25) 低于 12 档的 40，
  // 导致 settles 一旦达到 40，13/16/19/22/24 全部被顺带放行（5 条门槛变死代码）。
  var GATE = {
    7: { settle: 3 }, 8: { settle: 10, codex: 6 }, 11: { settle: 20 }, 12: { settle: 40, codex: 10 },
    13: { settle: 45 }, 16: { settle: 60 }, 19: { settle: 80 }, 22: { settle: 105 }, 24: { settle: 140 }
  };
  var GATE_TIERS = { 7: true, 8: true, 11: true, 12: true, 13: true, 16: true, 19: true, 22: true, 24: true };
  function tierGateOk(t) {
    if (state.adUnlockedTiers && state.adUnlockedTiers[t]) return true;   // 已看广告解锁 → 直接放行
    var g = GATE[t];
    if (!g) return true;
    if (g.settle && state.settles < g.settle) return false;
    if (g.codex && state.highestTier < g.codex) return false;
    return true;
  }

  // 满级结算：长按满级单位 ≥ LONG_PRESS_MS 毫秒 → 兑换为金币并释放该格
  var LONG_PRESS_MS = 500;
  var SETTLE_SECONDS = 30;
  var TEXT_DARK = '#141414';
  var TEXT_LIGHT = '#ffffff';
  // 美术资源相对路径基准；微信小游戏可改为打包内路径（如 'game_assets/'）
  var ASSET_BASE = '';

  // ---------- 2. 逻辑分辨率与布局（横屏 812x375） ----------
  var W = 812;
  var H = 375;

  var HUD_H = 64;                  // 右侧面板顶栏高度（仅绘制参考）
  var GAP = 6;                     // 棋盘格间距
  var CELL_MAX = 86;               // 单格最大尺寸（受行数 / 宽度自适应缩放）

  // 左侧棋盘区（约 58%）
  var BOARD_X0 = 12;
  var BOARD_X1 = 466;
  var REGION_W = BOARD_X1 - BOARD_X0;            // 454
  var REGION_TOP = 46;                           // 顶部给「返回首页」按钮留白
  var REGION_BOTTOM = 366;
  var REGION_H = REGION_BOTTOM - REGION_TOP;     // 320

  // 右侧控制面板（约 42%）
  var PANEL_X = 478;
  var PANEL_W = W - PANEL_X;                      // 334
  var PX0 = PANEL_X + 12;                         // 面板内容左 = 490
  var PX1 = W - 12;                               // 面板内容右 = 800
  var PW = PX1 - PX0;                             // 310

  // 以下几何量由 recomputeLayout() 依据当前已解锁行数（GRID_ROWS）计算
  var CELL = 62;
  var GRID_W = 0, GRID_H = 0, GRID_X = BOARD_X0, GRID_Y = REGION_TOP;
  var LOCK_GAP = 8;               // 棋盘与锁定迷你格之间的间隙
  var LOCK_CELL = 16;             // 锁定迷你格边长（recomputeLayout 计算）
  var LOCK_GX = 0, LOCK_GY = 0;   // 锁定迷你格左上角坐标

  function cellCenterX(c) { return GRID_X + c * (CELL + GAP) + CELL / 2; }
  function cellCenterY(r) { return GRID_Y + r * (CELL + GAP) + CELL / 2; }
  // 当前可交互的格子数（仅已解锁行参与放置/合并/结算）
  function activeCells() { return GRID_COLS * GRID_ROWS; }

  // CELL 自适应：行数越多格子越小；同时受「棋盘区宽度」约束，保证 5 列居中且恒落在
  // [REGION_TOP, REGION_BOTTOM] 内，其右侧控制面板位置固定，保证 812×375 全程无重叠。
  function recomputeLayout() {
    // 按当前已解锁行数（GRID_ROWS）计算格子尺寸 —— 恢复大格子，棋盘清晰可读。
    // 棋盘宽度（列数 / 单格宽度）保持不变；若仍有锁定行，则在棋盘正下方预留锁定条空间，
    // 使棋盘在 812×375 舞台内恒不溢出，且普通解锁时棋盘尺寸/位置保持稳定（不跳动）。
    var rows = GRID_ROWS;
    var hasLocked = GRID_ROWS < MAX_ROWS;
    var lockedRows = MAX_ROWS - GRID_ROWS;
    // 锁定区域高度：按待解锁行数动态，最多容纳全部锁定行的紧凑迷你格
    var LOCK_ZONE_H = hasLocked ? Math.min(108, 22 + lockedRows * 20) : 0;
    var regionAvailH = REGION_H - (hasLocked ? (LOCK_ZONE_H + LOCK_GAP) : 0);
    var cellH = Math.floor((regionAvailH - (rows - 1) * GAP) / rows);
    var cellW = Math.floor((REGION_W - (GRID_COLS - 1) * GAP) / GRID_COLS);
    CELL = Math.min(CELL_MAX, cellH, cellW);
    GRID_W = GRID_COLS * CELL + (GRID_COLS - 1) * GAP;
    GRID_H = rows * CELL + (rows - 1) * GAP;
    GRID_X = BOARD_X0 + (REGION_W - GRID_W) / 2;
    // 棋盘居中于「棋盘区减去锁定迷你格」的可用高度内
    GRID_Y = REGION_TOP + (regionAvailH - GRID_H) / 2;
    // 锁定迷你格几何：在棋盘正下方、REGION_BOTTOM 之上，紧凑灰格 + 小锁
    if (hasLocked) {
      var zoneTop = REGION_TOP + regionAvailH + LOCK_GAP;
      var zoneBottom = REGION_BOTTOM;
      var gapL = 3;
      var availH = zoneBottom - zoneTop;
      var cellByH = Math.floor((availH - (lockedRows - 1) * gapL) / lockedRows);
      var cellByW = Math.floor((GRID_W - (GRID_COLS - 1) * gapL) / GRID_COLS);
      LOCK_CELL = Math.max(10, Math.min(30, cellByH, cellByW));
      var gridW = GRID_COLS * LOCK_CELL + (GRID_COLS - 1) * gapL;
      var gridH = lockedRows * LOCK_CELL + (lockedRows - 1) * gapL;
      LOCK_GX = GRID_X + (GRID_W - gridW) / 2;
      LOCK_GY = zoneTop + (availH - gridH) / 2;
    }
  }
  recomputeLayout();

  // ---------- 右侧面板按钮（固定位置） ----------
  var HOME_BTN = { x: 12, y: 8, w: 92, h: 30 };                 // 返回首页（棋盘区左上角）

  var FRIEND_BTN = { x: PX0,      y: 224, w: 152, h: 44 };      // 好友
  var RESTORE_BTN = { x: PX1 - 152, y: 224, w: 152, h: 44 };    // 恢复方块
  var RESET_BTN  = { x: PX0,      y: 280, w: 152, h: 44 };      // 重置存档
  var TIP_Y = 84;                                              // 免费放置提示行
  var STATS_Y = 202;                                           // 首页统计行
  var STATS_BOX = { x: PX0, y: 190, w: PW, h: 26 };

  var LEGEND_CLOSE_BTN = { x: W / 2 - 80, y: 300, w: 160, h: 44 };
  var FRIEND_CLOSE_BTN = { x: W / 2 - 80, y: 290, w: 160, h: 44 };
  var DETAIL_VOICE_BTN = { x: W / 2 - 70, y: H - 132, w: 140, h: 46 };

  var GOMOKU_N = 13;                         // 13×13 交叉点
  var GS = 23;                               // 交叉点间距（格 ≈23px）
  var GOMOKU_PAD = 16;                       // 棋盘外框留白
  var BOARD_SPAN = (GOMOKU_N - 1) * GS;      // = 276
  var GOMOKU_FRAME_W = BOARD_SPAN + GOMOKU_PAD * 2;   // = 308
  var GOMOKU_FRAME_X = 40;                   // 横屏：棋盘置于左侧
  var GOMOKU_FRAME_Y = 28;
  var GOMOKU_ORIGIN_X = GOMOKU_FRAME_X + GOMOKU_PAD;  // 首个交叉点 x
  var GOMOKU_ORIGIN_Y = GOMOKU_FRAME_Y + GOMOKU_PAD;  // 首个交叉点 y

  // 五子棋流程：'menu'（选模式/角色/背景） → 'play'（对局）
  var gomokuScreen = 'menu';
  var gomokuMode = 'pve';                    // 'pve' 人机对战 / 'pvp' 双人面对面
  var gomokuPName = CHARACTER_NAMES[0];      // 玩家 1（你）外观名（cosmetic）
  var gomokuPName2 = '鬼';                   // 玩家 2（双人）/ AI（人机）外观名
  var gomokuBG = 0;                          // 棋盘背景主题索引
  var GOMOKU_BGS = [
    { name: '传统木纹', frame: 'rgba(122,82,42,0.96)', line: 'rgba(255,238,205,0.55)', star: 'rgba(255,238,205,0.85)', bg: 'rgba(58,38,20,1)' },
    { name: '夜樱',     frame: 'rgba(44,30,64,0.96)',  line: 'rgba(255,200,230,0.5)',  star: 'rgba(255,200,230,0.85)', bg: 'rgba(20,14,34,1)' },
    { name: '金砂',     frame: 'rgba(64,52,22,0.96)',  line: 'rgba(247,215,116,0.55)', star: 'rgba(247,215,116,0.85)', bg: 'rgba(28,22,10,1)' }

  var GOMOKU_MENU_MODE_PVP = { x: 218, y: 64, w: 170, h: 44 };

  ];

  var gomokuOpen = false;

  var gomokuTurn = 1;          // 1=玩家先手

    gomokuTurn = 1;

  }
  resetGomoku();

  // ---------- 横板平A小游戏（side-scroll beat-em-up） ----------
  var BRAWLER_BACK_BTN = { x: 620, y: 250, w: 170, h: 46 };
  var BRAWLER_RESTART_BTN = { x: 620, y: 304, w: 170, h: 46 };
  var BRAWLER_GY = 284;            // 地面线 y
  var BRAWLER_R = 26;             // 角色半径
  var BRAWLER_SPAWN_INT = 0.85;   // 敌人生成间隔（秒）
  var BRAWLER_WAVE_DELAY = 1.2;   // 波次间隔（秒）
  var BRAWLER_WAVE_TOTAL = 3;     // 共 3 波
  var BRAWLER_ATK_WIN = 0.2;      // 平A 攻击窗口（秒）
  var BRAWLER_ATK_DPS = 300;      // 攻击窗口内每秒伤害（敌 hp=30 → 一击可清）
  var BRAWLER_REACH = 56;         // 玩家前方 hitbox 长度
  var BRAWLER_PLAYER_SPD = 22;    // 玩家自动右移速度（px/s）

  var brawlerOpen = false;
  var bw = { x: 60, y: BRAWLER_GY - BRAWLER_R, hp: 100, maxhp: 100, atkT: 0 };
  var enemies = [];
  var brawlerWave = 0;
  var brawlerScore = 0;
  var brawlerOver = false;
  var brawlerResult = '';
  var brawlerSpawnT = 0;
  var brawlerSpawnLeft = 0;
  var brawlerWaveDelay = 0;

  function brawlerWaveCount(w) {
    return (w === 0) ? 4 : (w === 1 ? 5 : 5);
  }

  function resetBrawler() {
    brawlerWave = 0;
    brawlerScore = 0;
    brawlerOver = false;
    brawlerResult = '';
    brawlerSpawnT = 0;
    brawlerWaveDelay = 0;
    brawlerSpawnLeft = brawlerWaveCount(0);
    enemies = [];
    bw = { x: 60, y: BRAWLER_GY - BRAWLER_R, hp: 100, maxhp: 100, atkT: 0 };
  }

  function spawnBrawlerEnemy() {
    enemies.push({
      x: W + 30,
      y: BRAWLER_GY - BRAWLER_R,
      hp: 30, maxhp: 30,
      spd: 55 + Math.random() * 25,
      dps: 8 + Math.random() * 4,
      dead: false
    });
  }

  function brawlerAttack() { bw.atkT = BRAWLER_ATK_WIN; }

  function updateBrawler(dt) {
    if (!brawlerOpen) return;
    if (brawlerOver) return;

    bw.x += BRAWLER_PLAYER_SPD * dt;
    if (bw.x > W - 90) bw.x = W - 90;

    if (bw.atkT > 0) bw.atkT = Math.max(0, bw.atkT - dt);

    if (brawlerWaveDelay > 0) {
      brawlerWaveDelay -= dt;
    } else if (brawlerSpawnLeft > 0) {
      brawlerSpawnT += dt;
      if (brawlerSpawnT >= BRAWLER_SPAWN_INT) {
        brawlerSpawnT = 0;
        spawnBrawlerEnemy();
        brawlerSpawnLeft--;
      }
    } else if (enemies.length === 0) {
      if (brawlerWave < BRAWLER_WAVE_TOTAL - 1) {
        brawlerWave++;
        brawlerSpawnLeft = brawlerWaveCount(brawlerWave);
        brawlerWaveDelay = BRAWLER_WAVE_DELAY;
        toast = { text: '第 ' + (brawlerWave + 1) + ' 波来袭！', t: 1.6 };
      } else {
        brawlerOver = true;
        brawlerResult = '通关！';
        if (typeof state.coins === 'number') {
          state.coins += 2000;
          toast = { text: '通关！金币 +2000', t: 2.6 };
          save();
        }
      }
    }

    var frontX = bw.x + BRAWLER_R;
    var stopX = bw.x + (BRAWLER_R * 2 - 6);
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      if (e.x > stopX) {
        e.x -= e.spd * dt;
        if (e.x < stopX) e.x = stopX;
      }
      if (Math.abs(e.x - bw.x) < (BRAWLER_R * 2 - 4)) {
        bw.hp -= e.dps * dt;
      }
      if (bw.atkT > 0 &&
          e.x >= bw.x - BRAWLER_R && e.x <= frontX + BRAWLER_REACH &&
          Math.abs(e.y - bw.y) < BRAWLER_R * 2) {
        e.hp -= BRAWLER_ATK_DPS * dt;
      }
      if (e.hp <= 0) {
        enemies.splice(i, 1);
        brawlerScore++;
        if (typeof state.coins === 'number') {
          state.coins += 50;
          floats.push({ x: e.x, y: e.y - BRAWLER_R, t: 0, dur: 1.0, text: '+50' });
        }
      }
    }

    if (bw.hp <= 0) {
      bw.hp = 0;
      brawlerOver = true;
      brawlerResult = '失败';
    }
  }

  function drawBar(x, y, w, h, ratio, color) {
    ratio = Math.max(0, Math.min(1, ratio));
    fillRR(x, y, w, h, h / 2, 'rgba(255,255,255,0.15)');
    fillRR(x, y, w * ratio, h, h / 2, color);
  }

  function drawBrawler() {
    ctx.fillStyle = 'rgba(6,6,12,1)';
    ctx.fillRect(0, 0, W, H);

    text('横板平A · 清小怪', W / 2, 30, 22, '#ffffff', 'center', '800', SERIF);
    text('波次 ' + (brawlerWave + 1) + '/' + BRAWLER_WAVE_TOTAL + '    分数 ' + brawlerScore,
         W / 2, 56, 15, '#f0e2a8', 'center', '700');

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, BRAWLER_GY); ctx.lineTo(W, BRAWLER_GY); ctx.stroke();

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      ctx.beginPath();
      ctx.arc(e.x, e.y, BRAWLER_R, 0, Math.PI * 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fill();
      text('敌', e.x, e.y, 16, '#ffffff', 'center', '800');
      drawBar(e.x - BRAWLER_R, e.y - BRAWLER_R - 10, BRAWLER_R * 2, 5, e.hp / e.maxhp, '#e74c3c');
    }

    ctx.beginPath();
    ctx.arc(bw.x, bw.y, BRAWLER_R, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    text('银', bw.x, bw.y, 16, '#141414', 'center', '800');
    ctx.strokeStyle = '#caa472';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(bw.x + BRAWLER_R, bw.y);
    ctx.lineTo(bw.x + BRAWLER_R + 26, bw.y - 8);
    ctx.stroke();
    if (bw.atkT > 0) {
      ctx.fillStyle = 'rgba(247,215,116,0.18)';
      ctx.fillRect(bw.x, bw.y - BRAWLER_R, BRAWLER_REACH + BRAWLER_R, BRAWLER_R * 2);
    }
    drawBar(bw.x - BRAWLER_R, bw.y - BRAWLER_R - 10, BRAWLER_R * 2, 6, bw.hp / bw.maxhp, '#2ecc71');

    text('点击屏幕发动平A清怪', W / 2, BRAWLER_GY + 22, 12, '#6d6d83', 'center', '500');

    drawButton(BRAWLER_BACK_BTN, '返回', '#3498db');
    drawButton(BRAWLER_RESTART_BTN, '重新开始', '#e67e22');

    if (brawlerOver) {
      text(brawlerResult, W / 2, 200, 40,
           brawlerResult === '通关！' ? '#5fe08f' : '#e74c3c', 'center', '800');
      text(brawlerResult === '通关！' ? '奖励 +2000 金币（每击杀 +50）' : '再接再厉！',
           W / 2, 240, 15, '#ffe58a', 'center', '700');
    }
  }

  // ---------- 3. 状态 ----------
  var state = {
    cells: new Array(GRID_COLS * MAX_ROWS).fill(0),
    coins: 0,
    highestTier: 1,
    merges: 0,
    spawns: 0,
    settles: 0,
    adUnlockedTiers: {}          // 看激励视频广告解锁的档位（key = 档位数字字符串）
  };

  var fragments = new Array(MAX_TIER + 1).fill(0);
  var codexDone = new Array(MAX_TIER + 1).fill(false);
  var recruitCounts = new Array(MAX_TIER + 1).fill(0);   // 各档「高级招募」次数（同档重复涨价依据）
  var celebration = null;
  var selected = -1;
  var anim = [];
  for (var ai = 0; ai < GRID_COLS * MAX_ROWS; ai++) anim.push({ t: 1, dur: 1, kind: null });

  var drag = null;
  var floats = [];
  var toast = null;
  var modal = null;
  var collectionOpen = false;
  var recruitOpen = false;          // 高级招募弹层
  var recruitRects = [];
  var recruitScrollY = 0;
  var recruitMaxScroll = 0;
  var legendOpen = false;
  var detailOpen = false;
  var detailTier = 0;
  var friendOpen = false;          // 好友弹窗（canvas 绘制，正确高宽比）
  var unlockFx = null;             // 开锁动效 { t, dur, row }
  var unlockBtnShake = 0;          // 金币不足时「解锁」按钮抖动计时
  var collectionScrollY = 0;
  var collectionMaxScroll = 0;
  var autoSpawnTimer = 0;
  var AUTO_SPAWN_INTERVAL = 15;
  var pressedBtn = null;
  var lastFrame = 0;
  var saveTimer = 0;
  var bgPulse = 0;
  var clock = 0;
  var particles = [];
  var screenShake = 0;
  var muted = false;
  var boardImg = new Array(MAX_TIER + 1).fill(null);
  var codexImg = new Array(MAX_TIER + 1).fill(null);
  var voiceAud = new Array(MAX_TIER + 1).fill(null);
  var loadedBoard = 0, loadedCodex = 0, loadedAudio = 0;
  var codexRects = [];
  var press = { i: -1, t: 0, timer: null };

  // ---------- 4. 存档 ----------
  var suppressSave = false;

  function save() {
    if (suppressSave) return false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        cells: state.cells,
        coins: state.coins,
        highestTier: state.highestTier,
        merges: state.merges,
        spawns: state.spawns,
        settles: state.settles,
        unlockedRows: GRID_ROWS,
        fragments: fragments.slice(),
        codexDone: codexDone.slice(),
        recruitCounts: recruitCounts.slice(),
        adUnlockedTiers: state.adUnlockedTiers,
        time: Date.now()
      }));
      return true;
    } catch (e) { return false; }
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
    if (!raw) return;
    var d = null;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !Array.isArray(d.cells)) return;

    var n = Math.min(d.cells.length, state.cells.length);
    for (var i = 0; i < n; i++) {
      var t = Number(d.cells[i]) || 0;
      state.cells[i] = Math.max(0, Math.min(MAX_TIER, Math.floor(t)));
    }

    if (typeof d.unlockedRows === 'number') {
      GRID_ROWS = Math.max(5, Math.min(MAX_ROWS, Math.floor(d.unlockedRows)));
    }
    recomputeLayout();

    state.coins = Number(d.coins) || 0;
    state.highestTier = Math.max(1, Number(d.highestTier) || 1);
    state.merges = Number(d.merges) || 0;
    state.spawns = Number(d.spawns) || 0;
    state.settles = Number(d.settles) || 0;

    if (Array.isArray(d.fragments)) {
      for (var fi = 1; fi <= MAX_TIER; fi++) {
        fragments[fi] = Math.max(0, Math.min(10, Number(d.fragments[fi]) || 0));
      }
    }
    if (Array.isArray(d.codexDone)) {
      for (var ci2 = 1; ci2 <= MAX_TIER; ci2++) codexDone[ci2] = !!d.codexDone[ci2];
    }
    if (Array.isArray(d.recruitCounts)) {
      for (var ri = 1; ri <= MAX_TIER; ri++) recruitCounts[ri] = Math.max(0, Number(d.recruitCounts[ri]) || 0);
    }

    // 广告解锁档位：只吸收合法键，杜绝脏数据污染门槛判定
    state.adUnlockedTiers = {};
    if (d.adUnlockedTiers && typeof d.adUnlockedTiers === 'object') {
      for (var adk in d.adUnlockedTiers) {
        if (!d.adUnlockedTiers.hasOwnProperty(adk)) continue;
        var adt = Math.floor(Number(adk));
        if (adt >= 1 && adt <= MAX_TIER && d.adUnlockedTiers[adk]) state.adUnlockedTiers[adt] = true;
      }
    }

    var elapsed = Math.max(0, (Date.now() - (Number(d.time) || Date.now())) / 1000);
    if (elapsed > 60) {
      var rate = coinsPerSecond();
      var eff = Math.min(elapsed, OFFLINE_CAP_SEC);
      var gain = Math.floor(rate * eff * OFFLINE_EFFICIENCY);
      if (gain > 0) {
        state.coins += gain;
        modal = { title: '离线收益已到账', amount: gain, seconds: eff, rate: rate };
      }
    }
  }

  function resetAll() {
    suppressSave = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  // ---------- 5. 玩法逻辑 ----------
  function idx(r, c) { return r * GRID_COLS + c; }
  function tierAt(i) { return state.cells[i]; }

  function coinsPerSecond() {
    var sum = 0;
    for (var i = 0; i < activeCells(); i++) {
      var t = state.cells[i];
      if (t > 0) sum += COIN_RATE[t - 1];
    }
    return sum;
  }

  function spawnTier1() {
    var empties = [];
    for (var i = 0; i < activeCells(); i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) {
      toast = {
        text: hasSettleableUnit()
          ? '格子已满：长按最高档单位变现可腾出空位'
          : '格子已满，先合并腾出空位',
        t: 2.0
      };
      return false;
    }
    var pick = empties[Math.floor(Math.random() * empties.length)];
    state.cells[pick] = 1;
    state.spawns++;
    anim[pick] = { t: 0, dur: 0.32, kind: 'spawn' };
    return true;
  }

  // 高级招募定价：一级 1000，每差一级 ×5 系数；同档重复招募每次翻倍，封顶 5 倍。
  function recruitCost(tier) {
    var base;
    if (tier >= 24) base = 11920928955078125000;        // = 1000 * 5^23 的字面量：Math.pow 在 tier24 有双精度误差
    else if (tier >= 23) base = 2384185791015625000;    // = 1000 * 5^22 的字面量
    else base = 1000 * Math.pow(5, tier - 1);           // 一级1000，每差一级5倍
    var mult = Math.min(Math.pow(2, recruitCounts[tier]), 5); // 同档每次翻倍，封顶5倍
    return Math.round(base * mult);
  }

  // 高级招募：花金币招募「已解锁档位」的单位到空位（替代原固定 20 金的 spawnHighTier）
  function recruitTier(tier) {
    if (tier < 1 || tier > MAX_TIER) return false;
    if (state.highestTier < tier) {
      toast = { text: '需先合出 ' + tier + ' 档才能招募', t: 2.0 };
      return false;
    }
    var cost = recruitCost(tier);
    if (state.coins < cost) {
      if (window.GinAudio) GinAudio.locked();
      toast = { text: '金币不足，招募 ' + tier + ' 档需 ' + fmt(cost) + ' 金币', t: 2.0 };
      return false;
    }
    var empties = [];
    for (var i = 0; i < activeCells(); i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) {
      if (window.GinAudio) GinAudio.locked();
      toast = { text: '格子已满，先合并腾出空位', t: 2.0 };
      return false;
    }
    var pick = empties[Math.floor(Math.random() * empties.length)];
    state.coins -= cost;
    recruitCounts[tier]++;
    if (window.GinAudio) GinAudio.click();
    state.cells[pick] = tier;
    state.spawns++;
    anim[pick] = { t: 0, dur: 0.32, kind: 'spawn' };
    var pc = pick % GRID_COLS, pr = Math.floor(pick / GRID_COLS);
    floats.push({ x: cellCenterX(pc), y: cellCenterY(pr), t: 0, dur: 1.0, text: '招募 +' + tier + '档' });
    save();
    return true;
  }

  // 恢复方块：把已解锁区域内的空格填回 1 档单位（不消耗金币、不清除进度），保证棋盘可玩
  function restoreBlocks() {
    var filled = 0;
    for (var i = 0; i < activeCells(); i++) {
      if (state.cells[i] === 0) {
        state.cells[i] = 1;
        anim[i] = { t: 0, dur: 0.32, kind: 'spawn' };
        filled++;
      }
    }
    if (filled > 0) {
      state.spawns += filled;
      save();
      toast = { text: '已恢复 ' + filled + ' 个方块', t: 1.8 };
    } else {
      toast = { text: '没有空位需要恢复', t: 1.6 };
    }
  }

  function autoSpawn() {
    var empties = [];
    for (var i = 0; i < activeCells(); i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) return;
    var cap = Math.max(1, state.highestTier - 3);
    var weights = [], total = 0;
    for (var t = 1; t <= cap; t++) { var w = Math.pow(t, 1.3); weights.push(w); total += w; }
    var roll = Math.random() * total, chosen = 1;
    for (var k = 0; k < weights.length; k++) { roll -= weights[k]; if (roll <= 0) { chosen = k + 1; break; } }
    var cellIdx = empties[Math.floor(Math.random() * empties.length)];
    state.cells[cellIdx] = chosen;
    state.spawns++;
    anim[cellIdx] = { t: 0, dur: 0.32, kind: 'spawn' };
    var cc = cellIdx % GRID_COLS, cr = Math.floor(cellIdx / GRID_COLS);
    floats.push({ x: cellCenterX(cc), y: cellCenterY(cr), t: 0, dur: 1.0, text: '自动放置 +' + chosen + '档' });
  }

  function doMerge(from, to) {
    if (from === to) return false;
    var tf = state.cells[from];
    var tt = state.cells[to];
    if (tf <= 0 || tt <= 0) return false;
    if (tf !== tt) return false;
    if (tt >= MAX_TIER) {
      toast = { text: '已是最高档（' + MAX_TIER + ' 档）：长按可变现金币', t: 2.0 };
      return false;
    }
    var targetTier = tt + 1;
    if (!tierGateOk(targetTier)) {
      // 门槛未达 → 弹「看视频立即解锁」确认框（原 toast 会被全屏层盖死，玩家看不到）
      openAdModal('tier', targetTier, 0);
      return false;
    }
    state.cells[to] = tt + 1;
    state.cells[from] = 0;
    state.merges++;
    anim[to] = { t: 0, dur: 0.42, kind: 'merge' };
    anim[from] = { t: 0, dur: 0.2, kind: 'clear' };
    if (state.cells[to] > state.highestTier) state.highestTier = state.cells[to];

    var newTier = state.cells[to];
    fragments[newTier] = Math.min(10, (fragments[newTier] || 0) + 1);
    if (fragments[newTier] >= 10 && !codexDone[newTier]) {
      codexDone[newTier] = true;
      triggerCodexCelebration(newTier);
    }

    var cx = cellCenterX(to % GRID_COLS), cy = cellCenterY(Math.floor(to / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.0, text: '合体 → ' + newTier + '档' });
    bgPulse = 0.35;
    spawnParticles(cx, cy);
    screenShake = Math.min(1, screenShake + 0.6);
    playVoice(newTier);
    playSfx('sfx_merge');
    return true;
  }

  function triggerCodexCelebration(tier) {
    celebration = { tier: tier, t: 0, dur: 3.4 };
    playSfx('sfx_unlock');
    playVoice(tier);
    var cxp = W / 2, cyp = H * 0.42;
    for (var k = 0; k < 18; k++) {
      var ang = (Math.PI * 2 * k) / 18 + Math.random() * 0.3;
      var spd = 60 + Math.random() * 120;
      particles.push({
        x: cxp, y: cyp,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
        life: 0, dur: 1.4 + Math.random() * 0.8, color: '#f7d774'
      });
    }
  }

  function settleValue(tier) { return SETTLE_SECONDS * COIN_RATE[tier - 1]; }

  // 逐级变现：长按「当前最高档位」即可变现（而非只有 MAX_TIER），
  // 使 settles 在 1 档开局就能正常累积 → 门槛自然可达，闭环死锁消失。
  function doSettle(i) {
    var tier = state.cells[i];
    if (tier <= 0 || tier !== state.highestTier) return false;
    var gain = settleValue(tier);

    state.cells[i] = 0;
    state.coins += gain;
    state.settles++;
    selected = -1;
    anim[i] = { t: 0, dur: 0.25, kind: 'clear' };

    var cx = cellCenterX(i % GRID_COLS), cy = cellCenterY(Math.floor(i / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.2, text: '+' + fmt(gain) + ' 变现' });
    toast = { text: tier + ' 档变现 +' + fmt(gain) + ' 金币（' + SETTLE_SECONDS + ' 秒产出）', t: 2.2 };
    bgPulse = 0.3;
    playVoice(tier);
    playSfx('sfx_settle');
    return true;
  }

  function canSettle(i) { return i >= 0 && state.cells[i] > 0 && state.cells[i] === state.highestTier; }

  // ---------- 五子棋小游戏逻辑 ----------
  function gomokuWin(b, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < GOMOKU_N; r++) {
      for (var c = 0; c < GOMOKU_N; c++) {
        if (b[r][c] !== who) continue;
        for (var di = 0; di < dirs.length; di++) {
          var dr = dirs[di][0], dc = dirs[di][1];
          var pr = r - dr, pc = c - dc;
          if (pr >= 0 && pr < GOMOKU_N && pc >= 0 && pc < GOMOKU_N && b[pr][pc] === who) continue;
          var cnt = 0, rr = r, cc = c;
          while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && b[rr][cc] === who) {
            cnt++; rr += dr; cc += dc;
          }
          if (cnt >= 5) return true;
        }
      }
    }
    return false;
  }

  function gomokuRun(r, c, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    var max = 1;
    for (var di = 0; di < dirs.length; di++) {
      var dr = dirs[di][0], dc = dirs[di][1], cnt = 1;
      var rr = r + dr, cc = c + dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) {
        cnt++; rr += dr; cc += dc;
      }
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) {
        cnt++; rr -= dr; cc -= dc;
      }
      if (cnt > max) max = cnt;
    }
    return max;
  }

  function gomokuEval(r, c, who) {
    return Math.pow(10, Math.max(0, gomokuRun(r, c, who) - 1));
  }

  function gomokuBoardFull() {
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] === 0) return false;
    return true;
  }

  function gomokuRecordResult(who) {
    var key = (gomokuMode === 'pvp') ? 'pvp' : 'pve';

    else gomokuRecords[key].loss++;

  function gomokuAfterMove(who) {
    if (gomokuWin(gomokuBoard, who)) {
      gomokuOver = true;
      if (gomokuMode === 'pvp') {
        gomokuResult = (who === 1) ? '玩家1胜' : '玩家2胜';
      } else {
        gomokuResult = (who === 1) ? '玩家胜' : '敌方胜';
      }
      gomokuRecordResult(who);
      if (who === 1 && gomokuMode === 'pve') rewardGomokuWin();
      return;
    }
    if (gomokuBoardFull()) {
      gomokuOver = true;
      gomokuResult = '平局';
      gomokuRecordResult(0);

  }

    var names = CHARACTER_NAMES;
    var cur = (side === 1) ? gomokuPName : gomokuPName2;
    var idx = names.indexOf(cur);
    if (idx < 0) idx = 0;
    idx = (idx + dir + names.length) % names.length;
    if (side === 1) gomokuPName = names[idx]; else gomokuPName2 = names[idx];
  }

  function aiGomokuMove() {
    if (!gomokuOpen || gomokuOver || gomokuTurn !== 2) return;

    var cands = [];
    var anyStone = false;
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] !== 0) anyStone = true;
    for (var r2 = 0; r2 < GOMOKU_N; r2++) {
      for (var c2 = 0; c2 < GOMOKU_N; c2++) {
        if (gomokuBoard[r2][c2] !== 0) continue;
        if (!anyStone) { cands.push([r2, c2]); continue; }
        var near = false;
        for (var dr = -2; dr <= 2; dr++)
          for (var dc = -2; dc <= 2; dc++) {
            var rr = r2 + dr, cc = c2 + dc;
            if (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] !== 0) near = true;
          }
        if (near) cands.push([r2, c2]);
      }
    }
    if (cands.length === 0) return;

    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0], c = cands[i][1];
      gomokuBoard[r][c] = 2;
      if (gomokuWin(gomokuBoard, 2)) { gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[r][c] = 0;
    }
    for (var j = 0; j < cands.length; j++) {
      var rr2 = cands[j][0], cc2 = cands[j][1];
      gomokuBoard[rr2][cc2] = 1;
      if (gomokuWin(gomokuBoard, 1)) { gomokuBoard[rr2][cc2] = 2; gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[rr2][cc2] = 0;
    }
    var best = null, bestScore = -1;
    for (var k = 0; k < cands.length; k++) {
      var r3 = cands[k][0], c3 = cands[k][1];
      var score = gomokuEval(r3, c3, 2) + gomokuEval(r3, c3, 1) * 0.95;
      score -= (Math.abs(r3 - GOMOKU_N / 2) + Math.abs(c3 - GOMOKU_N / 2)) * 0.01;
      if (score > bestScore) { bestScore = score; best = [r3, c3]; }
    }
    if (best) {
      gomokuBoard[best[0]][best[1]] = 2;
      gomokuAfterMove(2);
    }
    if (!gomokuOver) gomokuTurn = 1;
  }

  // ---------- 6. 输入 ----------
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };
  var SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","STSong","SimSun",serif';

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vw = window.innerWidth, vh = window.innerHeight;
    var stage = document.getElementById('stage');
    // 横屏舞台缩放器：scale = min(vw/812, vh/375)，居中 + 黑边。
    // 注意：缩放完全由 #stage 的 CSS transform 承担，canvas 自身只按 DPR 放大，避免双重缩放。
    var scale = Math.min(vw / W, vh / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    view.scale = scale;
    view.ox = 0;
    view.oy = 0;
    view.dpr = dpr;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    if (stage) stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toLogic(ev) {
    var r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / view.scale,
      y: (ev.clientY - r.top) / view.scale
    };
  }

  function hitCell(p) {
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var cx = cellCenterX(c), cy = cellCenterY(r);
        if (p.x >= cx - CELL / 2 && p.x <= cx + CELL / 2 &&
            p.y >= cy - CELL / 2 && p.y <= cy + CELL / 2) return idx(r, c);
      }
    }
    return -1;
  }

  function hitRect(p, b) {
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }

  function hitButton(p, b, minPx) {
    minPx = minPx || 0;
    var hw = Math.max(b.w, minPx / view.scale);
    var hh = Math.max(b.h, minPx / view.scale);
    var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    return Math.abs(p.x - cx) <= hw / 2 && Math.abs(p.y - cy) <= hh / 2;
  }

  var pointer = { down: false, startX: 0, startY: 0, moved: false, cell: -1, settled: false };

  cv.addEventListener('pointerdown', function (ev) {

    pointer.startY = p.y;

    pointer.settled = false;

    pointer.scrollMoved = false; // 逐手势复位：之前是跨手势残留，会导致下一次单纯点按被判成拖动
    pointer.codexDown = null;    // 图鉴按下落点，留给 pointerup 做「点按 / 拖动」判定

      if (gomokuOver) return;

      var c = Math.round((p.x - GOMOKU_ORIGIN_X) / GS);
      var r = Math.round((p.y - GOMOKU_ORIGIN_Y) / GS);
      if (r < 0 || r >= GOMOKU_N || c < 0 || c >= GOMOKU_N) return;
      if (Math.abs(p.x - (GOMOKU_ORIGIN_X + c * GS)) > GS / 2 ||
          Math.abs(p.y - (GOMOKU_ORIGIN_Y + r * GS)) > GS / 2) return;
      if (gomokuBoard[r][c] !== 0) return;

      gomokuAfterMove(gomokuTurn);

      if (hitButton(p, BRAWLER_RESTART_BTN, 44)) { if (window.GinAudio) GinAudio.click(); resetBrawler(); return; }

      if (window.GinAudio) GinAudio.click(); detailOpen = false; return;   // 点击空白处返回图鉴
    }

      if (hitRect(p, COLL_BTN)) { if (window.GinAudio) GinAudio.click(); collectionOpen = false; return; }
      if (hitRect(p, CODEX_CLOSE_BTN)) { if (window.GinAudio) GinAudio.click(); collectionOpen = false; return; }

      // 关键：按下时**不**开详情、**不**关面板；只登记落点。
      // 否则按下即 detailOpen=true，pointermove 的滚动分支（!detailOpen）永远进不去 → 列表无法滚动。
      var downTier = null, downHit = false;
      for (var ci = 0; ci < codexRects.length; ci++) {
        if (hitRect(p, codexRects[ci].rect)) {
          downTier = codexRects[ci].tier;
          downHit = true;
          break;
        }
      }
      var unlockedTier = 0;
      if (downHit && downTier !== null && codexCardUnlocked(downTier)) unlockedTier = downTier;
      pointer.codexDown = { tier: unlockedTier, hitCard: downHit };
      return;
    }

    // 高级招募弹层（真模态）：与图鉴弹层同级，独立分发并 return，点击不穿透到下层按钮
    if (recruitOpen) {
      if (hitRect(p, CODEX_CLOSE_BTN)) { if (window.GinAudio) GinAudio.click(); recruitOpen = false; return; }
      for (var ri = 0; ri < recruitRects.length; ri++) {
        var rr2 = recruitRects[ri];
        if (hitRect(p, rr2.rect)) {
          if (rr2.unlocked) { if (window.GinAudio) GinAudio.click(); recruitTier(rr2.tier); }
          else { toast = { text: '需先合出 ' + rr2.tier + ' 档才能招募', t: 1.8 }; }
          return;
        }
      }
      recruitOpen = false; return;   // 点击空白关闭
    }

    if (legendOpen) {
      if (hitRect(p, LEGEND_CLOSE_BTN)) { if (window.GinAudio) GinAudio.click(); legendOpen = false; return; }
      if (window.GinAudio) GinAudio.click(); legendOpen = false; return;   // 点击空白处也可关闭档位表
    }

    if (friendOpen) {
      if (hitRect(p, FRIEND_CLOSE_BTN)) { if (window.GinAudio) GinAudio.click(); friendOpen = false; return; }
      if (window.GinAudio) GinAudio.click(); friendOpen = false; return;   // 点击空白处关闭好友弹窗
    }

    if (hitButton(p, HOME_BTN, 44)) { if (window.GinAudio) GinAudio.click(); location.href = 'home.html'; return; }
    if (hitButton(p, SPAWN_BTN, 44)) { if (window.GinAudio) GinAudio.click(); recruitOpen = true; return; }
    if (hitButton(p, UNLOCK_BTN, 44)) { if (window.GinAudio) GinAudio.click(); tryUnlockRow(); return; }
    if (hitButton(p, COLL_BTN, 44)) { if (window.GinAudio) GinAudio.click(); collectionOpen = true; return; }
    if (hitButton(p, MUTE_BTN, 44)) { if (window.GinAudio) GinAudio.click(); muted = !muted; return; }
    if (hitButton(p, LEGEND_BTN, 44)) { if (window.GinAudio) GinAudio.click(); legendOpen = true; return; }
    if (hitButton(p, FRIEND_BTN, 44)) {
      if (window.GinAudio) GinAudio.click();
      friendOpen = true;
      if (window.GinSocial) GinSocial.open('rank');
      else toast = { text: '社交功能加载中…', t: 1.6 };
      return;
    }
    if (hitButton(p, RESTORE_BTN, 44)) {
      if (window.GinAudio) GinAudio.click();
      restoreBlocks();
      return;
    }
    if (hitButton(p, RESET_BTN, 44)) {
      if (window.GinAudio) GinAudio.click();
      if (window.confirm('确定要清空存档、重新开始吗？')) resetAll();
      return;
    }

    var i = hitCell(p);
    if (i >= 0 && state.cells[i] > 0) {
      pointer.cell = i;
      startPress(i);
    }
  });

  cv.addEventListener('pointermove', function (ev) {
    if (!pointer.down) return;
    ev.preventDefault();
    var p = toLogic(ev);
    var dx = p.x - pointer.startX, dy = p.y - pointer.startY;
    if (!pointer.moved && (dx * dx + dy * dy) > 100) {
      pointer.moved = true;
      cancelPress();
    }
    if (collectionOpen && !detailOpen && !modal) {
      var sdy = p.y - pointer.scrollLastY;
      if (Math.abs(p.y - pointer.startY) > 8) {
        pointer.scrollMoved = true;
        collectionScrollY = Math.max(0, Math.min(collectionMaxScroll, collectionScrollY - sdy));
      }
      pointer.scrollLastY = p.y;
      return;
    }
    if (recruitOpen) {
      var rsdy = p.y - pointer.scrollLastY;
      if (Math.abs(p.y - pointer.startY) > 8) {
        pointer.scrollMoved = true;
        recruitScrollY = Math.max(0, Math.min(recruitMaxScroll, recruitScrollY - rsdy));
      }
      pointer.scrollLastY = p.y;
      return;
    }
    if (pointer.moved && pointer.cell >= 0) {
      drag = { from: pointer.cell, x: p.x, y: p.y };
    }
  });

  cv.addEventListener('pointerup', function (ev) {
    if (!pointer.down) return;
    ev.preventDefault();
    pointer.down = false;
    var p = toLogic(ev);

    if (pointer.settled) {
      pointer.settled = false;
      cancelPress();
      drag = null;
      return;
    }
    cancelPress();

    if (collectionOpen || modal) {
      // 图鉴列表：抬手才判定。位移 <= 10px 记为「点按」→ 开详情 / 点空白关面板；
      // 拖动过（scrollMoved）则什么都不做，只保留滚动结果。
      if (collectionOpen && !detailOpen && !modal && pointer.codexDown) {
        var cdx = p.x - pointer.startX, cdy = p.y - pointer.startY;
        var isTap = !pointer.scrollMoved && (cdx * cdx + cdy * cdy) <= 100;
        if (isTap) {
          if (pointer.codexDown.tier > 0) {
            detailTier = pointer.codexDown.tier;
            detailOpen = true;
            if (window.GinAudio) GinAudio.click();
          } else if (!pointer.codexDown.hitCard) {
            if (window.GinAudio) GinAudio.click();
            collectionOpen = false;        // 保留「点空白关闭面板」行为
          }
        }
      }
      pointer.codexDown = null;
      drag = null;
      return;
    }

    if (pointer.moved && drag) {
      var target = hitCell(p);
      if (target >= 0 && target !== drag.from) {
        doMerge(drag.from, target);
      }
      drag = null;
      return;
    }
    drag = null;
  });

  cv.addEventListener('pointercancel', function () {
    pointer.down = false;
    pointer.settled = false;
    drag = null;
    cancelPress();
  });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('visibilitychange', function () {

  // ---------- 7. 绘制工具 ----------
  function rr(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return false;
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    return true;
  }

  function fillRR(x, y, w, h, r, color) {
    if (!rr(x, y, w, h, r)) return;
    ctx.fillStyle = color;
    ctx.fill();
  }
  function strokeRR(x, y, w, h, r, color, lw) {
    if (!rr(x, y, w, h, r)) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw || 2;
    ctx.stroke();
  }

  function text(str, x, y, size, color, align, weight, font) {
    ctx.font = (weight || '600') + ' ' + size + 'px ' + (font || '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif');
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function textW(str, size, weight) {
    ctx.font = (weight || '600') + ' ' + size + 'px ' + '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    return ctx.measureText(str).width;
  }

  function shade(hex, k) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    if (k >= 0) {
      r = Math.round(r + (255 - r) * k);
      g = Math.round(g + (255 - g) * k);
      b = Math.round(b + (255 - b) * k);
    } else {
      r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k));
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function srgbLum(hex) {
    var h = hex.replace('#', '');
    var ch = [];
    for (var k = 0; k < 3; k++) {
      var v = parseInt(h.substr(k * 2, 2), 16) / 255;
      ch.push(v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    }
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  function contrastRatio(l1, l2) {
    var hi = Math.max(l1, l2) + 0.05;
    var lo = Math.min(l1, l2) + 0.05;
    return hi / lo;
  }

  function contrastText(hex) {
    var L = srgbLum(hex);
    return contrastRatio(1, L) >= contrastRatio(L, srgbLum(TEXT_DARK)) ? TEXT_LIGHT : TEXT_DARK;
  }

  function tierTextContrast(tier) {
    var bg = TIER_COLORS[tier - 1];
    return contrastRatio(srgbLum(contrastText(bg)), srgbLum(bg));
  }

  function easeOutBack(t) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  // 单位表在 Qi(1e18) 之上补 Si(1e21) / Sp(1e24) / Oc(1e27)，并对 NaN/Infinity 兜底。
  var FMT_UNITS = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Si', 'Sp', 'Oc'];
  function fmt(n) {
    n = Number(n);
    if (!isFinite(n)) return '0';                 // 杜绝 "NaN" / "InfinityQi"
    n = Math.floor(n);
    if (n < 0) n = 0;
    if (n < 1000) return String(n);
    var v = n, u = 0;
    while (v >= 1000 && u < FMT_UNITS.length - 1) { v /= 1000; u++; }
    var dec = v < 10 ? 2 : (v < 100 ? 1 : 0);
    var rounded = Number(v.toFixed(dec));
    // 进位不换单位修复：四舍五入后若已达 1000，继续升一档（999500 必须显示 1.00M，而不是 1000K）
    while (rounded >= 1000 && u < FMT_UNITS.length - 1) {
      v /= 1000; u++;
      dec = v < 10 ? 2 : (v < 100 ? 1 : 0);
      rounded = Number(v.toFixed(dec));
    }
    return rounded.toFixed(dec) + FMT_UNITS[u];
  }

  function fmtTime(sec) {
    sec = Math.floor(sec);
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
    if (hh > 0) return hh + ' 小时 ' + mm + ' 分';
    return mm + ' 分 ' + (sec % 60) + ' 秒';
  }

  // ---------- 8. 绘制（银魂 anime 风格） ----------
  function drawBackground() {
    // #0b0e14 → #141b28 渐变
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#141b28');
    g.addColorStop(0.55, '#0e131e');
    g.addColorStop(1, '#0b0e14');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 青海波（seigaiha）同心波纹，5-8% 透明度
    drawSeigaiha();

    // 顶部柔光
    var rg = ctx.createRadialGradient(W * 0.28, 30, 10, W * 0.28, 30, 320);
    rg.addColorStop(0, 'rgba(232,193,90,' + (0.10 + bgPulse * 0.22) + ')');
    rg.addColorStop(1, 'rgba(232,193,90,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W * 0.6, H);

    // 底部冷光
    var bg = ctx.createRadialGradient(PANEL_X, H + 40, 10, PANEL_X, H + 40, 340);
    bg.addColorStop(0, 'rgba(58,167,216,0.06)');
    bg.addColorStop(1, 'rgba(58,167,216,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(PANEL_X - 100, H - 340, W - PANEL_X + 100, 340);
  }

  function drawSeigaiha() {
    var R = 30;
    var cols = Math.ceil(W / R) + 2;
    var rows = Math.ceil(H / R) + 2;
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#3a4a78';
    ctx.lineWidth = 1.4;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cx = c * R * 2 - R;
        var cy = r * R * 2 - R + (c % 2 ? R : 0);
        for (var k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.arc(cx, cy, R * k * 0.5, Math.PI, 0);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawPanelBg() {
    // 右侧控制面板
    fillRR(PANEL_X, 0, PANEL_W, H, 0, '#141b28');
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(PANEL_X, 0, 1, H);                 // 中线高光
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(PANEL_X + 1, 0, 1, H);
    // 面板顶栏底色
    fillRR(PANEL_X, 0, PANEL_W, HUD_H, 0, 'rgba(20,27,40,0.96)');
    ctx.fillStyle = 'rgba(232,193,90,0.18)';
    ctx.fillRect(PANEL_X, HUD_H - 1, PANEL_W, 1);  // 金色分隔线
  }

  function drawHomeButton() {
    drawButton(HOME_BTN, '← 首页', '#2a3550', false);
  }

  function drawHud() {
    // 金币图标（金色圆 + 銀 字）+ 金额 + 每秒产出
    ctx.save();
    ctx.shadowColor = '#e8c15a';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(PX0 + 14, 32, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#e8c15a';
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.arc(PX0 + 14, 32, 9, 0, Math.PI * 2);
    ctx.fillStyle = shade('#e8c15a', -0.18);
    ctx.fill();
    text('銀', PX0 + 14, 32, 13, '#3a2e10', 'center', '800', SERIF);

    text('金币', PX0 + 36, 18, 12, '#8a93ad', 'left', '600');
    text(fmt(state.coins), PX0 + 36, 40, 24, '#ffd23a', 'left', '800');

    // 每秒产出
    var cps = coinsPerSecond();
    fillRR(PX0 + 36, 54, 150, 18, 9, 'rgba(46,204,113,0.16)');
    text('+' + fmt(cps) + '/秒', PX0 + 111, 63, 12, '#5fe08f', 'center', '700');

    // 图鉴 + 音乐 按钮
    drawButton(COLL_BTN, '图鉴', '#3aa7d8', false);
    drawButton(MUTE_BTN, muted ? '✕' : '♪', muted ? '#c0392b' : '#2ecc71', false);
  }

  function drawButton(b, label, color, primary, dx) {
    dx = dx || 0;
    var pressed = (pressedBtn === b);
    var oy = pressed ? 2 : 0;
    var r = 12;
    var bx = b.x + dx;
    fillRR(bx, b.y + oy, b.w, b.h, r, pressed ? shade(color, -0.22) : shade(color, -0.12));
    var g = ctx.createLinearGradient(0, b.y + oy, 0, b.y + b.h - 3 + oy);
    g.addColorStop(0, 'rgba(255,255,255,0.20)');
    g.addColorStop(1, color);
    if (rr(bx, b.y + oy, b.w, b.h - 3, r)) { ctx.fillStyle = g; ctx.fill(); }
    // 2px 深色 cel 描边
    strokeRR(bx, b.y + oy, b.w, b.h, r, 'rgba(11,14,20,0.85)', 2);
    // 主按钮金色强调边框
    if (primary) strokeRR(bx + 1.5, b.y + oy + 1.5, b.w - 3, b.h - 3, r - 1, 'rgba(232,193,90,0.9)', 2);
    // 主标签自适应字号，确保文字不溢出按钮
    var maxW = b.w - 16;
    var ls = 16;
    while (ls > 9 && textW(label, ls, '700') > maxW) ls--;
    text(label, bx + b.w / 2, b.y + b.h / 2 - 1 + oy, ls, '#ffffff', 'center', '700');
  }

  function drawGrid() {
    // 棋盘底板
    fillRR(GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 18, 'rgba(10,14,22,0.85)');
    strokeRR(GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 18, '#2a3550', 1.5);

    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var i = idx(r, c);
        var cx = cellCenterX(c), cy = cellCenterY(r);
        var x = cx - CELL / 2, y = cy - CELL / 2;

        // 空槽位：rounded #141b28 瓦片 + 1px #2a3550 边框 + 内阴影
        var tx = x + 3, ty = y + 3, ts = CELL - 6;
        fillRR(tx, ty, ts, ts, 10, '#141b28');
        strokeRR(tx, ty, ts, ts, 10, '#2a3550', 1);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        fillRR(tx + 2, ty + ts - 5, ts - 4, 4, 6, 'rgba(0,0,0,0.35)');
        ctx.restore();

        // 正在播放开锁动效的那一行：暗化 + 金色描边按列依次亮起（锁图标由锁定条承载）
        if (unlockFx && unlockFx.row === r) {
          drawUnlockRowCell(tx, ty, ts, r, c);
          continue;
        }

        var tier = state.cells[i];
        if (tier <= 0) continue;

        if (drag && drag.from === i) {
          fillRR(tx, ty, ts, ts, 10, 'rgba(255,255,255,0.12)');
          continue;
        }

        drawUnit(x, y, tier, i, 1);
      }
    }

    // 锁定迷你格（棋盘正下方）：把扩展区域渲染为格子而非空白条
    drawLockedGrid();
  }

  function drawLockedGrid() {
    if (GRID_ROWS >= MAX_ROWS) return;                 // 已解锁满行：无锁定格
    var gapL = 3;
    var lockedRows = MAX_ROWS - GRID_ROWS;
    for (var r = 0; r < lockedRows; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var x = LOCK_GX + c * (LOCK_CELL + gapL);
        var y = LOCK_GY + r * (LOCK_CELL + gapL);
        fillRR(x, y, LOCK_CELL, LOCK_CELL, 4, '#0e1420');
        strokeRR(x, y, LOCK_CELL, LOCK_CELL, 4, '#2a3550', 1);
        // 小锁图标（金色，半透明）
        var cx = x + LOCK_CELL / 2, cy = y + LOCK_CELL / 2;
        var s = LOCK_CELL;
        var bw = s * 0.34, bh = s * 0.26;
        var bx = cx - bw / 2, by = cy - bh / 2 + s * 0.04;
        strokeRR(bx, by, bw, bh, 2, 'rgba(232,193,90,0.55)', 1);
        ctx.beginPath();
        ctx.arc(cx, by, bw * 0.34, Math.PI, 0);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(232,193,90,0.55)';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, by + bh * 0.5, bw * 0.07, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(232,193,90,0.55)';
        ctx.fill();
      }
    }
  }

  function drawUnlockRowCell(tx, ty, ts, r, c) {
    // 新解锁行的「按列 stagger 依次亮起金色描边」动效；不再逐格画锁（锁交给锁定条）
    var lit = 0;
    if (unlockFx && unlockFx.row === r) {
      var p = Math.max(0, Math.min(1, unlockFx.t / unlockFx.dur));
      var stagger = c / GRID_COLS;                       // 列依次亮起
      lit = Math.max(0, Math.min(1, (p - 0.1 - stagger * 0.3) / 0.5));
    }
    // 半透明暗化（随亮起减弱）
    ctx.save();
    ctx.globalAlpha = (1 - lit * 0.9);
    fillRR(tx, ty, ts, ts, 10, 'rgba(8,10,16,0.66)');
    ctx.restore();
    strokeRR(tx, ty, ts, ts, 10, 'rgba(42,53,80,0.6)', 1);
    if (lit > 0) strokeRR(tx + 1, ty + 1, ts - 2, ts - 2, 10, 'rgba(232,193,90,' + (0.9 * lit) + ')', 1.5);
  }

  // 锁定条已由 drawLockedGrid 取代（扩展区域渲染为清晰格子）


  function drawUnit(x, y, tier, i, extraAlpha) {
    var a = anim[i];
    var s = 1;
    var alpha = extraAlpha;
    if (a && a.kind) {
      var p = a.t / a.dur;
      if (p < 1) {
        if (p < 0) p = 0;
        if (a.kind === 'merge') s = 0.55 + 0.45 * easeOutBack(Math.min(1, p * 1.15));
        else if (a.kind === 'spawn') s = 0.5 + 0.5 * easeOutBack(p);
        else if (a.kind === 'clear') alpha = extraAlpha * (1 - p);
      }
    }
    if (!isFinite(s) || s < 0.2) s = 0.2;
    if (!isFinite(alpha)) alpha = 1;

    // 极轻 idle 呼吸（非晃动，仅无合并/生成动画时）：给棋盘一点生命感（B5）
    if ((!a || !a.kind)) {
      var breathe = 1 + Math.sin(clock * 1.6 + i * 0.7) * 0.018;
      s *= breathe;
    }

    var color = TIER_COLORS[tier - 1];
    var size = (CELL - 8) * s;
    var px = x + (CELL - size) / 2;
    var py = y + (CELL - size) / 2;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

    var cxm = x + CELL / 2, cym = y + CELL / 2;

    var sprite = boardImg[tier];
    if (sprite) {
      // 圆形徽章：裁剪为圆 + 金边圆环（与矩形图鉴明显区分）；单位静止不晃动
      var r = (CELL - 8) * s / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      ctx.beginPath();
      ctx.arc(cxm, cym, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(sprite, cxm - r, cym - r, r * 2, r * 2);
      ctx.restore();
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.beginPath();
      ctx.arc(cxm, cym, r, 0, Math.PI * 2);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#e8c15a';
      ctx.stroke();
      if (selected === i) {
        ctx.beginPath();
        ctx.arc(cxm, cym, r + 2, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }
      if (tier === MAX_TIER || tier >= 13) {
        ctx.beginPath();
        ctx.arc(cxm, cym, r + 1.5, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffe58a';
        ctx.stroke();
      }
    } else {
      // 六边形色块（tier13-24）：渐变填充 + 金边，区别于矩形图鉴
      var hs = (CELL - 12) * s / 2;
      function hexPath(rr) {
        ctx.beginPath();
        for (var q = 0; q < 6; q++) {
          var a2 = Math.PI / 6 + q * Math.PI / 3;
          var x2 = cxm + Math.cos(a2) * rr, y2 = cym + Math.sin(a2) * rr;
          if (q === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
        }
        ctx.closePath();
      }
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      hexPath(hs);
      var g = ctx.createLinearGradient(cxm, cym - hs, cxm, cym + hs);
      g.addColorStop(0, shade(color, 0.28));
      g.addColorStop(0.5, color);
      g.addColorStop(1, shade(color, -0.22));
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      hexPath(hs);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#e8c15a';
      ctx.stroke();
      if (selected === i) { hexPath(hs + 2); ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke(); }
    }

    // 档位数字底座（保证在图案上清晰可读）
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.85;
    fillRR(cxm - 16, cym - 10, 32, 20, 6, 'rgba(0,0,0,0.45)');
    ctx.restore();

    var fg = contrastText(color);
    var fs = Math.max(11, Math.floor((CELL - 8) * s * 0.40));
    text(String(tier), cxm, cym + 1, fs, fg, 'center', '800');
    ctx.restore();

    var small = Math.max(9, Math.floor((CELL - 8) * s * 0.19));
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.85;
    text('+' + COIN_RATE[tier - 1], x + CELL - 8, y + CELL - 8, small, fg, 'right', '700');
    ctx.globalAlpha = 1;
  }

  function drawPressRing() {
    if (press.i < 0) return;
    var pressTier = state.cells[press.i];
    if (pressTier <= 0 || pressTier !== state.highestTier) return;   // 同 canSettle：当前最高档才可长按变现
    var p = Math.max(0, Math.min(1, press.t / LONG_PRESS_MS));
    var r = Math.floor(press.i / GRID_COLS), c = press.i % GRID_COLS;
    var cx = cellCenterX(c), cy = cellCenterY(r);
    var rad = CELL / 2 - 4;
    ctx.save();
    var grd = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
    grd.addColorStop(0, 'rgba(255,255,255,0.28)');
    grd.addColorStop(1, 'rgba(255,229,138,0.18)');
    ctx.lineWidth = 1;
    ctx.strokeStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, rad + 3, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    if (p > 0) {
      ctx.strokeStyle = '#ffe58a';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 实际解锁一行（不含扣费）—— 付费路径与「看视频解锁」路径共用，避免逻辑分叉
  function unlockRowNow() {

    GRID_ROWS++;

  /* =========================================================================
   * 激励视频广告解锁模块（微信小游戏 wx.createRewardedVideoAd）
   * 设计要点：
   *  - 环境判定：wx.createRewardedVideoAd 存在 → 小游戏；否则 web。
   *  - 奖励唯一条件：onClose 且 res.isEnded === true（完整播放）。
   *  - 绝不允许卡死玩家：onError 自动 load() 重试一次；仍失败 / web 环境 /
   *    广告位未配置 → 一律直接按成功处理并提示「当前环境无广告，已直接解锁」。
   *  - 每日 3 次，localStorage 记 {date,count}，跨天自动重置。
   * ========================================================================= */
  var AD_UNIT_ID = 'adunit-REPLACE_ME';
  var AD_DAILY_LIMIT = 3;
  var AD_SAVE_KEY = 'merge_samurai_ad_v1';
  var adVideoAd = null;         // 惰性创建的激励视频实例

  function adEnv() {
    return (typeof wx !== 'undefined' && typeof wx.createRewardedVideoAd === 'function') ? 'wx' : 'web';
  }
  function adConfigured() {
    return typeof AD_UNIT_ID === 'string' && AD_UNIT_ID.length > 0 && AD_UNIT_ID.indexOf('REPLACE_ME') < 0;
  }
  function adTodayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function adDaily() {
    var o = null;
    try { o = JSON.parse(localStorage.getItem(AD_SAVE_KEY)); } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || o.date !== adTodayStr() ||
        typeof o.count !== 'number' || !isFinite(o.count) || o.count < 0) {
      o = { date: adTodayStr(), count: 0 };
    }
    return o;
  }
  function adSaveDaily(o) { try { localStorage.setItem(AD_SAVE_KEY, JSON.stringify(o)); } catch (e) {} }
  function adRemainingToday() { return Math.max(0, AD_DAILY_LIMIT - adDaily().count); }
  function adConsumeDaily() {
    var o = adDaily();
    if (o.count >= AD_DAILY_LIMIT) { adSaveDaily(o); return false; }
    o.count++;
    adSaveDaily(o);
    return true;
  }

  function adApplyTierUnlock(tier) {
    state.adUnlockedTiers[tier] = true;
    save();
    if (window.GinAudio) GinAudio.unlock();
    toast = { text: '已解锁 ' + tier + ' 档（看视频奖励）', t: 2.4 };
    return true;
  }
  function adApplyRowUnlock(row) {
    if (GRID_ROWS >= MAX_ROWS) { toast = { text: '已解锁满行', t: 1.6 }; return false; }
    unlockRowNow();
    toast = { text: '看视频解锁第 ' + GRID_ROWS + ' 行！', t: 2.4 };
    return true;
  }

  // 播放激励视频；成功（含兜底）后回调 onSuccess。返回是否走到了「可兑现」的分支。
  function adShow(onSuccess) {
    function done() { if (typeof onSuccess === 'function') onSuccess(); }
    if (adEnv() !== 'wx' || !adConfigured()) {
      toast = { text: '当前环境无广告，已直接解锁', t: 2.2 };
      done();
      return true;
    }
    if (adRemainingToday() <= 0) {
      toast = { text: '今日解锁次数已用完', t: 2.2 };
      return false;
    }
    if (!adVideoAd) {
      try { adVideoAd = wx.createRewardedVideoAd({ adUnitId: AD_UNIT_ID }); } catch (e) { adVideoAd = null; }
    }
    if (!adVideoAd || typeof adVideoAd.show !== 'function') {
      toast = { text: '当前环境无广告，已直接解锁', t: 2.2 };
      done();
      return true;
    }
    var finished = false, retried = false;
    function cleanup() {
      try { if (adVideoAd.offClose) adVideoAd.offClose(onClose); } catch (e) {}
      try { if (adVideoAd.offError) adVideoAd.offError(onError); } catch (e) {}
    }
    function fallback() {
      if (finished) return;
      finished = true; cleanup();
      toast = { text: '当前环境无广告，已直接解锁', t: 2.2 };
      done();
    }
    function onClose(res) {
      if (finished) return;
      finished = true; cleanup();
      if (res && res.isEnded === true) { adConsumeDaily(); done(); }
      else { toast = { text: '需要看完视频才能解锁', t: 2.2 }; }
    }
    function onError() {
      if (finished) return;
      cleanup();
      if (retried) { fallback(); return; }
      retried = true;                                  // 自动重试一次
      try {
        adVideoAd.load().then(function () {
          if (finished) return;
          adVideoAd.onClose(onClose);
          adVideoAd.onError(onError);
          adVideoAd.show().catch(function () { fallback(); });
        }).catch(function () { fallback(); });
      } catch (e) { fallback(); }
    }
    try {
      adVideoAd.onClose(onClose);
      adVideoAd.onError(onError);
      adVideoAd.show().catch(function () {
        if (finished) return;
        try {
          adVideoAd.load().then(function () {
            adVideoAd.show().catch(function () { onError(); });
          }).catch(function () { onError(); });
        } catch (e) { onError(); }
      });
    } catch (e) { onError(); }
    return true;
  }

  function drawFloats(dt) {
    for (var i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.t += dt;
      var p = f.t / f.dur;
      if (p >= 1) { floats.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - p;
      text(f.text, f.x, f.y - 8 - p * 30, 15, '#ffe58a', 'center', '800');
      ctx.globalAlpha = 1;
    }
  }

  function drawDragGhost() {
    if (!drag) return;
    var tier = state.cells[drag.from];
    if (tier <= 0) return;
    var hover = hitCell(drag);
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var i = idx(r, c);
        if (state.cells[i] === tier && i !== drag.from && tier < MAX_TIER) {
          var cx = cellCenterX(c), cy = cellCenterY(r);
          if (i === hover) {
            var dg = ctx.createLinearGradient(cx - CELL / 2 + 2, cy - CELL / 2 + 2, cx + CELL / 2 - 2, cy + CELL / 2 - 2);
            dg.addColorStop(0, 'rgba(95,224,143,0.95)');
            dg.addColorStop(1, 'rgba(95,224,143,0.4)');
            strokeRR(cx - CELL / 2 + 2, cy - CELL / 2 + 2, CELL - 4, CELL - 4, 12, dg, 4);
          } else {
            strokeRR(cx - CELL / 2 + 2, cy - CELL / 2 + 2, CELL - 4, CELL - 4, 12, 'rgba(95,224,143,0.45)', 2);
          }
        }
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.92;
    drawUnit(drag.x - CELL / 2, drag.y - CELL / 2 - 10, tier, drag.from, 1);
    ctx.restore();
  }

  function drawCover(img, dx, dy, dw, dh) {
    var ir = img.width / img.height, dr = dw / dh;
    var sw, sh, sx, sy;
    if (ir > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  function drawCollection() {
    ctx.fillStyle = 'rgba(6,6,12,1)';
    ctx.fillRect(0, 0, W, H);
    text('角色图鉴', W / 2, 30, 24, '#e8c15a', 'center', '800', SERIF);
    text('合出对应档位即可解锁 · 点卡片查看详情 · 变现=长按满级单位换金币', W / 2, 54, 12, '#9a9ab0', 'center', '500');
    strokeRR(W / 2 - 140, 62, 280, 1, 1, 'rgba(232,193,90,0.35)', 1);

    codexRects = [];
    var cardW = (W - 32 - 12) / 2;
    var cardH = 96;
    var gap = 12;
    var startY = 70;
    collectionMaxScroll = Math.max(0, (MAX_TIER / 2) * (cardH + gap) - (H - 175));

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, startY, W, H - 175);
    ctx.clip();

    for (var i = 0; i < MAX_TIER; i++) {
      var r = Math.floor(i / 2), c = i % 2;
      var x = 16 + c * (cardW + 12);
      var y = startY + r * (cardH + gap) - collectionScrollY;
      var tierN = i + 1;

      var isGateTier = GATE_TIERS[tierN];

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      if (unlocked && codexImg[tierN]) {
        fillRR(x, y, cardW, cardH, 16, '#1c1c2a');
        drawCover(codexImg[tierN], x, y, cardW, cardH);
      } else {
        fillRR(x, y, cardW, cardH, 16, 'rgba(255,255,255,0.06)');
      }
      ctx.restore();
      strokeRR(x, y, cardW, cardH, 16, TIER_COLORS[i], 2.5);

      if (unlocked && codexImg[tierN]) {
        var bg2 = ctx.createLinearGradient(0, y + cardH - 30, 0, y + cardH);
        bg2.addColorStop(0, 'rgba(0,0,0,0)');
        bg2.addColorStop(1, 'rgba(0,0,0,0.62)');
        ctx.fillStyle = bg2;
        ctx.fillRect(x, y + cardH - 30, cardW, 30);
      }

      // 醒目角标（左上角圆点 + 档位数字）：高对比 + 金边，明显一点
      var bgr = 19, bgx = x + 12, bgy = y + 12;
      ctx.beginPath();
      ctx.arc(bgx + bgr, bgy + bgr, bgr, 0, Math.PI * 2);
      ctx.fillStyle = unlocked ? TIER_COLORS[i] : 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = unlocked ? '#ffe58a' : 'rgba(255,255,255,0.2)';
      ctx.stroke();
      text(String(i + 1), bgx + bgr, bgy + bgr + 1, 17, unlocked ? contrastText(TIER_COLORS[i]) : '#6d6d83', 'center', '800');

      var name = unlocked ? CHARACTER_NAMES[i] : (isGateTier ? gateGoalText(tierN) : '未解锁');
      text(name, x + 12, y + cardH - 14, unlocked ? 14 : 10,
           unlocked ? '#ffffff' : '#d8d8e6', 'left', unlocked ? '800' : '700');
      if (unlocked) {
        text('▶ 原声', x + cardW - 12, y + cardH - 14, 11, '#9fe0ff', 'right', '700');
        text('+' + COIN_RATE[i] + '/秒', x + 12, y + cardH - 32, 11, '#8fd8a8', 'left', '600');
        text('碎片 ' + fragments[tierN] + '/10', x + 12, y + cardH - 48, 10, codexDone[tierN] ? '#e8c15a' : '#cfcfe0', 'left', '600');
      } else if (!isGateTier) {
        text('需要 ' + tierN + ' 档', x + 12, y + cardH - 32, 11, '#5c5c72', 'left', '600');
      }

      // 命中矩形必须与绘制裁剪区（y ∈ [startY, startY + (H-175)]）求交：
      // 只登记可见卡片，并把矩形夹进可视区 → 点纯黑空白不再命中卡片
      var visTop = startY, visBot = startY + (H - 175);
      if (y + cardH > visTop && y < visBot) {
        var cy0 = Math.max(y, visTop), cy1 = Math.min(y + cardH, visBot);
        codexRects.push({ rect: { x: x, y: cy0, w: cardW, h: cy1 - cy0 }, tier: tierN });
      }
    }

    ctx.restore();

    drawButton(CODEX_CLOSE_BTN, '关闭', '#e8c15a');
    if (collectionMaxScroll > 0) {
      text('上下滑动查看更多', W / 2, H - 30, 11, '#8a93ad', 'center', '500');
    } else {
      text('（点击任意空白处也可关闭）', W / 2, H - 30, 11, '#8a93ad', 'center', '500');
    }
  }

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawPanelBg();
    drawHomeButton();
    drawHud();

    ctx.save();
    if (screenShake > 0) {
      var sh = screenShake * 4;
      ctx.translate((Math.random() * 2 - 1) * sh, (Math.random() * 2 - 1) * sh);
    }
    drawGrid();
    drawPressRing();
    drawDragGhost();
    ctx.restore();

    drawSpawnArea();
    drawUnlockButton();

    if (!collectionOpen && !legendOpen && !gomokuOpen && !brawlerOpen) {
      drawLegend();
      drawStats();
      drawFriendBtn();
      drawRestoreBtn();
      drawBottom();
      drawAutoInfo();
    }

    drawParticles();
    drawFloats(dt);

    if (celebration) drawCelebration();
    if (collectionOpen) drawCollection();
    if (legendOpen) drawLegendOverlay();
    if (friendOpen) drawFriendOverlay();
    if (detailOpen) drawDetail();
    if (recruitOpen) drawRecruitOverlay();
    if (modal) { if (modal.kind === 'ad') drawAdModal(); else drawModal(); }
    if (gomokuOpen) {
      if (gomokuScreen === 'menu') drawGomokuMenu(); else drawGomoku();
    }
    if (brawlerOpen) drawBrawler();
    if (showTut) drawTutorial();

    // 必须最后画：位于所有全屏层之上，否则招募缺钱 / 门槛 / 五子棋奖励等提示会被完全遮死
    drawToast();

  function drawParticles() {
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      var a = 1 - p.life / p.dur;
      ctx.globalAlpha = Math.max(0, a);
      fillRR(p.x - 3, p.y - 3, 6, 6, 3, p.color);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 9. 主循环 ----------
  function update(dt) {
    var cps = coinsPerSecond();
    if (cps > 0) state.coins += cps * dt;

    autoSpawnTimer += dt;
    if (autoSpawnTimer >= AUTO_SPAWN_INTERVAL) { autoSpawnTimer = 0; autoSpawn(); }

    updateBrawler(dt);

    for (var i = 0; i < anim.length; i++) {
      var a = anim[i];
      if (a.kind) {
        a.t += dt;
        if (a.t >= a.dur) { a.t = 1; a.kind = null; }
      }
    }
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    if (unlockFx) { unlockFx.t += dt; if (unlockFx.t >= unlockFx.dur) unlockFx = null; }
    if (unlockBtnShake > 0) unlockBtnShake = Math.max(0, unlockBtnShake - dt);
    if (bgPulse > 0) bgPulse = Math.max(0, bgPulse - dt * 1.2);
    if (press.i >= 0) press.t += dt * 1000;

    clock += dt;
    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];
      pt.life += dt;
      if (pt.life >= pt.dur) { particles.splice(pi, 1); continue; }
      pt.vy += 140 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 2.2);

    if (celebration) { celebration.t += dt; if (celebration.t >= celebration.dur) celebration = null; }

    saveTimer += dt;
    if (saveTimer >= 2) { saveTimer = 0; save(); }
  }

  function loop(ts) {
    var now = ts / 1000;
    var dt = lastFrame ? Math.min(0.1, now - lastFrame) : 0;
    lastFrame = now;
    if (!modal) update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  // ---------- 10. 启动 ----------
  function boot() {
    resize();
    load();
    loadGomokuRecords();
    loadAssets();
    if (state.cells.every(function (v) { return v === 0; }) && state.merges === 0 && state.coins === 0) {
      for (var i = 0; i < INITIAL_UNITS; i++) spawnTier1();
      toast = { text: '拖动一个单位到另一个同档单位上即可合并升档（长按满级单位可变现金币）', t: 3.2 };
    }
    // URL 参数：mode=gomoku 自动打开五子棋菜单（home.html 跳转入口）
    try {
      if (location.search && location.search.indexOf('mode=gomoku') >= 0) {
        gomokuOpen = true;
        gomokuScreen = 'menu';
      }
    } catch (e) {}
    window.__gameReady = true;
    requestAnimationFrame(loop);
  }

  // 暴露给自动化验证使用
  window.__game = {
    state: state,
    coinsPerSecond: coinsPerSecond,
    spawnTier1: spawnTier1,
    doMerge: doMerge,
    hitCellAt: function (r, c) { return { x: cellCenterX(c), y: cellCenterY(r) }; },
    cellCenterX: cellCenterX,
    cellCenterY: cellCenterY,
    save: save,
    saveKey: SAVE_KEY,
    version: 'h5-fallback-2.8.0',
    isReady: function () { return window.__gameReady === true; },
    isCollectionOpen: function () { return collectionOpen; },
    isModalOpen: function () { return !!modal; },
    // T-007 三项修复的自测钩子
    settleValue: settleValue,
    doSettle: doSettle,
    settleSeconds: SETTLE_SECONDS,
    longPressMs: LONG_PRESS_MS,
    maxTier: MAX_TIER,
    // 放置棋盘 / 招募改造的自测钩子（v2.8.0）
    recruitCost: recruitCost,
    recruitTier: recruitTier,
    recruitCounts: function () { return recruitCounts.slice(); },
    tryUnlockRow: tryUnlockRow,
    unlockPrice: function () { return GRID_ROWS < MAX_ROWS ? ROW_UNLOCK_PRICES[GRID_ROWS + 1] : null; },
    restoreBlocks: restoreBlocks,
    cols: function () { return GRID_COLS; },
    rows: function () { return GRID_ROWS; },
    maxRows: function () { return MAX_ROWS; },
    defaultRows: function () { return 5; },
    isPressActive: function () { return press.i >= 0; },
    canSettleAt: canSettle,
    cardUnlocked: function (i) { return state.highestTier >= i + 1; },
    unlockedCardCount: unlockedCardCount,
    isLastCardUnlocked: isLastCardUnlocked,
    // 设计选项 D：7/8 档解锁门槛的自测钩子
    tier7Unlocked: tier7Unlocked,
    tier8Unlocked: tier8Unlocked,
    codexCardUnlocked: function (i) { return codexCardUnlocked(i + 1); },
    setSettles: function (n) { state.settles = n; return state.settles; },
    tierTextColor: function (tier) { return contrastText(TIER_COLORS[tier - 1]); },
    tierTextContrast: tierTextContrast,
    allTierContrasts: function () {
      var out = [];
      for (var t = 1; t <= MAX_TIER; t++) {
        out.push({ tier: t, color: TIER_COLORS[t - 1], text: contrastText(TIER_COLORS[t - 1]),
                   ratio: Math.round(tierTextContrast(t) * 100) / 100 });
      }
      return out;
    },
    layout: {
      W: W, H: H, GRID_X: GRID_X, GRID_Y: GRID_Y, CELL: CELL, GAP: GAP,
      COLS: GRID_COLS, ROWS: GRID_ROWS,
      SPAWN_BTN: SPAWN_BTN, COLL_BTN: COLL_BTN, RESET_BTN: RESET_BTN
    },
    toClient: function (x, y) {
      var r = cv.getBoundingClientRect();
      return { x: r.left + x * view.scale, y: r.top + y * view.scale };
    },
    coinRateMax: COIN_RATE[MAX_TIER - 1],
    assetsLoaded: function () { return { board: loadedBoard, codex: loadedCodex, audio: loadedAudio, total: 24 }; },
    isMuted: function () { return muted; },
    playVoice: playVoice,
    boardImgLoaded: function (t) { return !!boardImg[t]; },
    codexImgLoaded: function (t) { return !!codexImg[t]; },
    fmt: fmt,
    isRecruitOpen: function () { return recruitOpen; },
    isDetailOpen: function () { return detailOpen; },
    detailTierNow: function () { return detailTier; },
    collectionScroll: function () { return { y: collectionScrollY, max: collectionMaxScroll }; },
    modalInfo: function () {
      return modal
        ? { open: true, kind: modal.kind || 'offline', adKind: modal.adKind || null,
            tier: modal.tier || 0, row: modal.row || 0 }
        : { open: false };
    },
    adState: adState,
    adGrant: adGrant,
    setAdUnitId: setAdUnitId,
    adModalRects: adModalRects,
    gomoku: {
      N: GOMOKU_N,
      isOpen: function () { return gomokuOpen; },
      isOver: function () { return gomokuOver; },
      result: function () { return gomokuResult; },
      turn: function () { return gomokuTurn; },
      board: function () { return gomokuBoard; },
      open: function () { gomokuOpen = true; gomokuScreen = 'play'; resetGomoku(); return gomokuBoard; },
      close: function () { gomokuOpen = false; },
      reset: function () { resetGomoku(); },
      place: function (r, c, who) {
        if (r < 0 || r >= GOMOKU_N || c < 0 || c >= GOMOKU_N) return false;
        if (gomokuBoard[r][c] !== 0) return false;
        gomokuBoard[r][c] = who;
        gomokuAfterMove(who);
        return true;
      },
      win: function (b, who) { return gomokuWin(b, who); },
      aiMove: function () { aiGomokuMove(); },
      setTurn: function (t) { gomokuTurn = t; },
      origin: function () { return { x: GOMOKU_ORIGIN_X, y: GOMOKU_ORIGIN_Y, gs: GS }; },
      buttons: { entry: null, back: GOMOKU_BACK_BTN, restart: GOMOKU_RESTART_BTN }
    },
    tick: function (dt) { update(dt); },
    brawler: {
      isOpen: function () { return brawlerOpen; },
      isOver: function () { return brawlerOver; },
      result: function () { return brawlerResult; },
      wave: function () { return brawlerWave; },
      score: function () { return brawlerScore; },
      enemies: function () { return enemies.length; },
      player: function () { return { x: bw.x, y: bw.y, hp: bw.hp, maxhp: bw.maxhp, atkT: bw.atkT }; },
      open: function () { brawlerOpen = true; resetBrawler(); return true; },
      close: function () { brawlerOpen = false; },
      reset: function () { resetBrawler(); },
      attack: function () { brawlerAttack(); },
      draw: function () { drawBrawler(); },
      buttons: { entry: null, back: BRAWLER_BACK_BTN, restart: BRAWLER_RESTART_BTN }
    }
  };

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  boot();
})();
</script>
<script src="assets/js/social.js" defer></script>
</body>
