<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<title>银魂 · 侍合戦（合并武士换皮版）</title>
<style>
  :root {
    --bg:#0b0e14;
    --panel:#141b28;
    --line:#2a3550;
    --gold:#e8c15a;
    --gold2:#ffd23a;
    --red:#d84a3b;
    --blue:#3aa7d8;
    --paper:#f2ead8;
    --dim:#8a93ad;
    --wood:#6b4a2b;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;            /* black letterbox behind the 812x375 stage */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  /* Stage scaler: logical 812x375, scaled to fit viewport and centered (black letterbox). */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 812px; height: 375px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; background: var(--bg); }
  #rot { display: none; }
</style>
  <script src="assets/js/audio.js" defer></script>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
</div>
<script>
(function () {
  "use strict";

  /* =========================================================================
   * 合并武士 · 放置图鉴 —— 浏览器直玩版（H5 兜底实现）
   * 与 Cocos 原型 assets/src/data/GameConfig.ts 的数值完全一致。
   * 美术 100% 为代码绘制的纯色块，不含任何图片素材 / 版权角色形象。
   * 布局：812x375 横屏（左侧棋盘区 + 右侧控制面板），银魂 anime 风格。
   * ========================================================================= */

  // ---------- 1. 配置（与 GameConfig.ts 一一对应） ----------
  var GRID_COLS = 5;
  var MAX_ROWS = 8;                 // 棋盘行数上限（可解锁行机制）
  var GRID_ROWS = 4;                // 当前已解锁行数（被存档 unlockedRows 覆盖）
  // 解锁下一行的价格：key = 当前行数 + 1（即要解锁到的行）
  var ROW_UNLOCK_PRICES = { 5: 1000, 6: 4000, 7: 16000, 8: 64000 };
  // 银魂换皮：最高档位扩到 24；其余数值全部以 MAX_TIER / 公式派生，绝不写死。
  var MAX_TIER = 24;
  // 档位底色：24 档；contrastText 自动选字色（满足 WCAG AA）
  var TIER_COLORS = [
    '#7f8c8d', '#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#e74c3c', '#8e44ad', '#16a085',
    '#154360', '#aed6f1', '#1b2631', '#d4ac0d', '#e84393', '#00cec9', '#6c5ce7', '#fd79a8',
    '#fab1a0', '#00b894', '#0984e3', '#b2bec3', '#636e72', '#e17055', '#a29bfe', '#ffeaa7'
  ];
  // COIN_RATE[t-1] = 3^(t-1)：tier1=1 … tier24=94143178827（每档 ×3，结算值由公式派生）
  var COIN_RATE = [1, 3, 9, 27, 81, 243, 729, 2187, 6561, 19683, 59049, 177147, 531441, 1594323, 4782969, 14348907, 43046721, 129140163, 387420489, 1162261467, 3486784401, 10460353203, 31381059609, 94143178827];
  // 银魂角色名（index 0 = tier1）
  var CHARACTER_NAMES = [
    '坂田银时', '志村新八', '神乐', '定春', '近藤勋', '土方十四郎',
    '冲田总悟', '桂小太郎', '伊丽莎白', '高杉晋助', '神威', '虚（吉田松阳）',
    '山崎退', '柳生九兵衛', '月詠', 'お登勢', 'キャサリン', '長谷川泰三',
    '武蔵', '岡田似蔵', '来島また子', '徳川茂茂', '幾松', '坂本辰馬'
  ];
  // 每档对应的美术资源文件名（index 0 = tier1）。
  // tier1-12 沿用既有资源（board/codex/audio 三件套）；tier13-24 立绘缺口：
  //   board:null（主棋盘回落代码绘制色块）、codex:'NN_名字.png'（已置 build/assets/codex）、audio:null（回落原声/默认静默）
  // 注意 tier12 音频无下划线：voice_虚吉田松阳.mp3
  var TIER_META = [
    { board: 'tier1.png',  codex: '01_坂田银时.png',   audio: 'voice_坂田银时.mp3' },
    { board: 'tier2.png',  codex: '02_志村新八.png',   audio: 'voice_志村新八.mp3' },
    { board: 'tier3.png',  codex: '03_神乐.png',       audio: 'voice_神乐.mp3' },
    { board: 'tier4.png',  codex: '04_定春.png',       audio: 'voice_定春.mp3' },
    { board: 'tier5.png',  codex: '05_近藤勋.png',     audio: 'voice_近藤勋.mp3' },
    { board: 'tier6.png',  codex: '06_土方十四郎.png', audio: 'voice_土方十四郎.mp3' },
    { board: 'tier7.png',  codex: '07_冲田总悟.png',   audio: 'voice_冲田总悟.mp3' },
    { board: 'tier8.png',  codex: '08_桂小太郎.png',   audio: 'voice_桂小太郎.mp3' },
    { board: 'tier9.png',  codex: '09_伊丽莎白.png',   audio: 'voice_伊丽莎白.mp3' },
    { board: 'tier10.png', codex: '10_高杉晋助.png',   audio: 'voice_高杉晋助.mp3' },
    { board: 'tier11.png', codex: '11_神威.png',       audio: 'voice_神威.mp3' },
    { board: 'tier12.png', codex: '12_虚_吉田松阳.png', audio: 'voice_虚吉田松阳.mp3' },
    { board: null, codex: '13_山崎退.png',   audio: null },
    { board: null, codex: '14_柳生九兵衛.png', audio: null },
    { board: null, codex: '15_月詠.png',      audio: null },
    { board: null, codex: '16_お登勢.png',    audio: null },
    { board: null, codex: '17_キャサリン.png', audio: null },
    { board: null, codex: '18_長谷川泰三.png', audio: null },
    { board: null, codex: '19_武蔵.png',      audio: null },
    { board: null, codex: '20_岡田似蔵.png',  audio: null },
    { board: null, codex: '21_来島また子.png', audio: null },
    { board: null, codex: '22_徳川茂茂.png',  audio: null },
    { board: null, codex: '23_幾松.png',      audio: null },
    { board: null, codex: '24_坂本辰馬.png',  audio: null }
  ];
  var INITIAL_UNITS = 6;

  // 离线收益：8 小时封顶，50% 效率
  var OFFLINE_CAP_SEC = 8 * 3600;
  var OFFLINE_EFFICIENCY = 0.5;
  var SAVE_KEY = 'merge_samurai_save_v1';

  // 12 档解锁门槛（通用映射，仅动作门槛，合并永远免费）：
  var GATE = {
    7: { settle: 3 }, 8: { settle: 10, codex: 6 }, 11: { settle: 20 }, 12: { settle: 40, codex: 10 },
    13: { settle: 5 }, 16: { settle: 8 }, 19: { settle: 12 }, 22: { settle: 18 }, 24: { settle: 25 }
  };
  var GATE_TIERS = { 7: true, 8: true, 11: true, 12: true, 13: true, 16: true, 19: true, 22: true, 24: true };
  function tierGateOk(t) {
    var g = GATE[t];
    if (!g) return true;
    if (g.settle && state.settles < g.settle) return false;
    if (g.codex && state.highestTier < g.codex) return false;
    return true;
  }

  // 满级结算：长按满级单位 ≥ LONG_PRESS_MS 毫秒 → 兑换为金币并释放该格
  var LONG_PRESS_MS = 500;
  var SETTLE_SECONDS = 30;
  var TEXT_DARK = '#141414';
  var TEXT_LIGHT = '#ffffff';
  // 美术资源相对路径基准；微信小游戏可改为打包内路径（如 'game_assets/'）
  var ASSET_BASE = '';

  // ---------- 2. 逻辑分辨率与布局（横屏 812x375） ----------
  var W = 812;
  var H = 375;

  var HUD_H = 64;                  // 右侧面板顶栏高度（仅绘制参考）
  var GAP = 6;                     // 棋盘格间距
  var CELL_MAX = 86;               // 单格最大尺寸（受行数 / 宽度自适应缩放）

  // 左侧棋盘区（约 58%）
  var BOARD_X0 = 12;
  var BOARD_X1 = 466;
  var REGION_W = BOARD_X1 - BOARD_X0;            // 454
  var REGION_TOP = 46;                           // 顶部给「返回首页」按钮留白
  var REGION_BOTTOM = 366;
  var REGION_H = REGION_BOTTOM - REGION_TOP;     // 320

  // 右侧控制面板（约 42%）
  var PANEL_X = 478;
  var PANEL_W = W - PANEL_X;                      // 334
  var PX0 = PANEL_X + 12;                         // 面板内容左 = 490
  var PX1 = W - 12;                               // 面板内容右 = 800
  var PW = PX1 - PX0;                             // 310

  // 以下几何量由 recomputeLayout() 依据当前已解锁行数（GRID_ROWS）计算
  var CELL = 62;
  var GRID_W = 0, GRID_H = 0, GRID_X = BOARD_X0, GRID_Y = REGION_TOP;

  function cellCenterX(c) { return GRID_X + c * (CELL + GAP) + CELL / 2; }
  function cellCenterY(r) { return GRID_Y + r * (CELL + GAP) + CELL / 2; }
  // 当前可交互的格子数（仅已解锁行参与放置/合并/结算）
  function activeCells() { return GRID_COLS * GRID_ROWS; }

  // CELL 自适应：行数越多格子越小；同时受「棋盘区宽度」约束，保证 5 列居中且恒落在
  // [REGION_TOP, REGION_BOTTOM] 内，其右侧控制面板位置固定，保证 812×375 全程无重叠。
  function recomputeLayout() {
    var rows = Math.max(1, Math.min(MAX_ROWS, GRID_ROWS));
    var cellH = Math.floor((REGION_H - (rows - 1) * GAP) / rows);
    var cellW = Math.floor((REGION_W - (GRID_COLS - 1) * GAP) / GRID_COLS);
    CELL = Math.min(CELL_MAX, cellH, cellW);
    GRID_W = GRID_COLS * CELL + (GRID_COLS - 1) * GAP;
    GRID_H = rows * CELL + (rows - 1) * GAP;
    GRID_X = BOARD_X0 + (REGION_W - GRID_W) / 2;
    GRID_Y = REGION_TOP + (REGION_H - GRID_H) / 2;
  }
  recomputeLayout();

  // ---------- 右侧面板按钮（固定位置） ----------
  var HOME_BTN = { x: 12, y: 8, w: 92, h: 30 };                 // 返回首页（棋盘区左上角）
  var COLL_BTN = { x: 660, y: 14, w: 64, h: 44 };               // 图鉴（HUD 内）
  var MUTE_BTN = { x: 732, y: 14, w: 56, h: 44 };               // 音乐（HUD 内）
  var SPAWN_BTN  = { x: PX0,      y: 96,  w: 152, h: 44 };      // 招募 +1
  var UNLOCK_BTN = { x: PX1 - 152, y: 96,  w: 152, h: 44 };     // 解锁第 N 行
  var LEGEND_BTN = { x: PX0,      y: 152, w: PW,  h: 38 };      // 档位产出表
  var FRIEND_BTN = { x: PX0,      y: 224, w: 152, h: 46 };      // 好友
  var RESET_BTN  = { x: PX1 - 152, y: 224, w: 152, h: 46 };     // 重置存档
  var TIP_Y = 84;                                              // 免费放置提示行
  var STATS_Y = 202;                                           // 首页统计行
  var STATS_BOX = { x: PX0, y: 190, w: PW, h: 26 };
  var SAVE_NOTE_Y = 336;                                       // 自动存档提示

  // 图鉴弹出层的关闭按钮（drawCollection 内绘制）
  var CODEX_CLOSE_BTN = { x: W / 2 - 80, y: H - 96, w: 160, h: 48 };

  var LEGEND_CLOSE_BTN = { x: W / 2 - 80, y: H - 96, w: 160, h: 48 };
  var DETAIL_VOICE_BTN = { x: W / 2 - 70, y: H - 132, w: 140, h: 46 };
  var DETAIL_CLOSE_BTN = { x: W / 2 - 80, y: H - 72, w: 160, h: 46 };
  var LEGEND_ROW = 22;

  // ---------- 五子棋小游戏（角色扮演：你=银 / 敌=鬼） ----------
  var GOMOKU_N = 13;                         // 13×13 交叉点
  var GS = 23;                               // 交叉点间距（格 ≈23px）
  var GOMOKU_PAD = 16;                       // 棋盘外框留白
  var BOARD_SPAN = (GOMOKU_N - 1) * GS;      // = 276
  var GOMOKU_FRAME_W = BOARD_SPAN + GOMOKU_PAD * 2;   // = 308
  var GOMOKU_FRAME_X = 40;                   // 横屏：棋盘置于左侧
  var GOMOKU_FRAME_Y = 28;
  var GOMOKU_ORIGIN_X = GOMOKU_FRAME_X + GOMOKU_PAD;  // 首个交叉点 x
  var GOMOKU_ORIGIN_Y = GOMOKU_FRAME_Y + GOMOKU_PAD;  // 首个交叉点 y

  // 五子棋流程：'menu'（选模式/角色/背景） → 'play'（对局）
  var gomokuScreen = 'menu';
  var gomokuMode = 'pve';                    // 'pve' 人机对战 / 'pvp' 双人面对面
  var gomokuPName = CHARACTER_NAMES[0];      // 玩家 1（你）外观名（cosmetic）
  var gomokuPName2 = '鬼';                   // 玩家 2（双人）/ AI（人机）外观名
  var gomokuBG = 0;                          // 棋盘背景主题索引
  var GOMOKU_BGS = [
    { name: '传统木纹', frame: 'rgba(122,82,42,0.96)', line: 'rgba(255,238,205,0.55)', star: 'rgba(255,238,205,0.85)', bg: 'rgba(58,38,20,1)' },
    { name: '夜樱',     frame: 'rgba(44,30,64,0.96)',  line: 'rgba(255,200,230,0.5)',  star: 'rgba(255,200,230,0.85)', bg: 'rgba(20,14,34,1)' },
    { name: '金砂',     frame: 'rgba(64,52,22,0.96)',  line: 'rgba(247,215,116,0.55)', star: 'rgba(247,215,116,0.85)', bg: 'rgba(28,22,10,1)' }
  ];
  // 战绩持久化（人机 / 双人 分开记录）
  var GOMOKU_REC_KEY = 'gomoku_records_v1';
  var gomokuRecords = { pve: { win: 0, loss: 0, draw: 0 }, pvp: { win: 0, loss: 0, draw: 0 } };
  function loadGomokuRecords() {
    try {
      var r = JSON.parse(localStorage.getItem(GOMOKU_REC_KEY));
      if (r && r.pve && r.pvp &&
          typeof r.pve.win === 'number' && typeof r.pvp.win === 'number') gomokuRecords = r;
    } catch (e) {}
  }
  function saveGomokuRecords() {
    try { localStorage.setItem(GOMOKU_REC_KEY, JSON.stringify(gomokuRecords)); } catch (e) {}
  }

  // 弹层内按钮（对局页）—— 置于右侧控制区
  var GOMOKU_BACK_BTN = { x: 384, y: 250, w: 168, h: 46 };
  var GOMOKU_RESTART_BTN = { x: 384, y: 304, w: 168, h: 46 };
  // 弹层内按钮（菜单页，两列布局）
  var GOMOKU_MENU_MODE_PVE = { x: 24, y: 64, w: 170, h: 44 };
  var GOMOKU_MENU_MODE_PVP = { x: 218, y: 64, w: 170, h: 44 };
  var GOMOKU_MENU_CHAR_PREV = { x: 40, y: 132, w: 48, h: 44 };
  var GOMOKU_MENU_CHAR_NEXT = { x: 380, y: 132, w: 48, h: 44 };
  var GOMOKU_MENU_CHAR2_PREV = { x: 40, y: 188, w: 48, h: 44 };
  var GOMOKU_MENU_CHAR2_NEXT = { x: 380, y: 188, w: 48, h: 44 };
  var GOMOKU_MENU_BG = [
    { x: 24, y: 240, w: 250, h: 40 },
    { x: 281, y: 240, w: 250, h: 40 },
    { x: 538, y: 240, w: 250, h: 40 }
  ];
  var GOMOKU_MENU_START = { x: 24, y: 330, w: 380, h: 40 };
  var GOMOKU_MENU_BACK = { x: 408, y: 330, w: 380, h: 40 };

  var gomokuOpen = false;
  var gomokuBoard = [];        // 13×13，0=空,1=玩家(银),2=AI(鬼)
  var gomokuTurn = 1;          // 1=玩家先手
  var gomokuOver = false;
  var gomokuResult = '';       // '玩家胜' / '敌方胜' / '平局'

  function resetGomoku() {
    gomokuBoard = [];
    for (var r = 0; r < GOMOKU_N; r++) {
      var row = [];
      for (var c = 0; c < GOMOKU_N; c++) row.push(0);
      gomokuBoard.push(row);
    }
    gomokuTurn = 1;
    gomokuOver = false;
    gomokuResult = '';
  }
  resetGomoku();

  // ---------- 横板平A小游戏（side-scroll beat-em-up） ----------
  var BRAWLER_BACK_BTN = { x: 620, y: 250, w: 170, h: 46 };
  var BRAWLER_RESTART_BTN = { x: 620, y: 304, w: 170, h: 46 };
  var BRAWLER_GY = 284;            // 地面线 y
  var BRAWLER_R = 26;             // 角色半径
  var BRAWLER_SPAWN_INT = 0.85;   // 敌人生成间隔（秒）
  var BRAWLER_WAVE_DELAY = 1.2;   // 波次间隔（秒）
  var BRAWLER_WAVE_TOTAL = 3;     // 共 3 波
  var BRAWLER_ATK_WIN = 0.2;      // 平A 攻击窗口（秒）
  var BRAWLER_ATK_DPS = 300;      // 攻击窗口内每秒伤害（敌 hp=30 → 一击可清）
  var BRAWLER_REACH = 56;         // 玩家前方 hitbox 长度
  var BRAWLER_PLAYER_SPD = 22;    // 玩家自动右移速度（px/s）

  var brawlerOpen = false;
  var bw = { x: 60, y: BRAWLER_GY - BRAWLER_R, hp: 100, maxhp: 100, atkT: 0 };
  var enemies = [];
  var brawlerWave = 0;
  var brawlerScore = 0;
  var brawlerOver = false;
  var brawlerResult = '';
  var brawlerSpawnT = 0;
  var brawlerSpawnLeft = 0;
  var brawlerWaveDelay = 0;

  function brawlerWaveCount(w) {
    return (w === 0) ? 4 : (w === 1 ? 5 : 5);
  }

  function resetBrawler() {
    brawlerWave = 0;
    brawlerScore = 0;
    brawlerOver = false;
    brawlerResult = '';
    brawlerSpawnT = 0;
    brawlerWaveDelay = 0;
    brawlerSpawnLeft = brawlerWaveCount(0);
    enemies = [];
    bw = { x: 60, y: BRAWLER_GY - BRAWLER_R, hp: 100, maxhp: 100, atkT: 0 };
  }

  function spawnBrawlerEnemy() {
    enemies.push({
      x: W + 30,
      y: BRAWLER_GY - BRAWLER_R,
      hp: 30, maxhp: 30,
      spd: 55 + Math.random() * 25,
      dps: 8 + Math.random() * 4,
      dead: false
    });
  }

  function brawlerAttack() { bw.atkT = BRAWLER_ATK_WIN; }

  function updateBrawler(dt) {
    if (!brawlerOpen) return;
    if (brawlerOver) return;

    bw.x += BRAWLER_PLAYER_SPD * dt;
    if (bw.x > W - 90) bw.x = W - 90;

    if (bw.atkT > 0) bw.atkT = Math.max(0, bw.atkT - dt);

    if (brawlerWaveDelay > 0) {
      brawlerWaveDelay -= dt;
    } else if (brawlerSpawnLeft > 0) {
      brawlerSpawnT += dt;
      if (brawlerSpawnT >= BRAWLER_SPAWN_INT) {
        brawlerSpawnT = 0;
        spawnBrawlerEnemy();
        brawlerSpawnLeft--;
      }
    } else if (enemies.length === 0) {
      if (brawlerWave < BRAWLER_WAVE_TOTAL - 1) {
        brawlerWave++;
        brawlerSpawnLeft = brawlerWaveCount(brawlerWave);
        brawlerWaveDelay = BRAWLER_WAVE_DELAY;
        toast = { text: '第 ' + (brawlerWave + 1) + ' 波来袭！', t: 1.6 };
      } else {
        brawlerOver = true;
        brawlerResult = '通关！';
        if (typeof state.coins === 'number') {
          state.coins += 2000;
          toast = { text: '通关！金币 +2000', t: 2.6 };
          save();
        }
      }
    }

    var frontX = bw.x + BRAWLER_R;
    var stopX = bw.x + (BRAWLER_R * 2 - 6);
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      if (e.x > stopX) {
        e.x -= e.spd * dt;
        if (e.x < stopX) e.x = stopX;
      }
      if (Math.abs(e.x - bw.x) < (BRAWLER_R * 2 - 4)) {
        bw.hp -= e.dps * dt;
      }
      if (bw.atkT > 0 &&
          e.x >= bw.x - BRAWLER_R && e.x <= frontX + BRAWLER_REACH &&
          Math.abs(e.y - bw.y) < BRAWLER_R * 2) {
        e.hp -= BRAWLER_ATK_DPS * dt;
      }
      if (e.hp <= 0) {
        enemies.splice(i, 1);
        brawlerScore++;
        if (typeof state.coins === 'number') {
          state.coins += 50;
          floats.push({ x: e.x, y: e.y - BRAWLER_R, t: 0, dur: 1.0, text: '+50' });
        }
      }
    }

    if (bw.hp <= 0) {
      bw.hp = 0;
      brawlerOver = true;
      brawlerResult = '失败';
    }
  }

  // ---------- 3. 状态 ----------

  // ---------- 4. 存档 ----------
  var suppressSave = false;

  function save() {
    if (suppressSave) return false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        cells: state.cells,
        coins: state.coins,
        highestTier: state.highestTier,
        merges: state.merges,
        spawns: state.spawns,
        settles: state.settles,
        unlockedRows: GRID_ROWS,
        fragments: fragments.slice(),
        codexDone: codexDone.slice(),
        time: Date.now()
      }));
      return true;
    } catch (e) { return false; }
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
    if (!raw) return;
    var d = null;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !Array.isArray(d.cells)) return;

    var n = Math.min(d.cells.length, state.cells.length);
    for (var i = 0; i < n; i++) {
      var t = Number(d.cells[i]) || 0;
      state.cells[i] = Math.max(0, Math.min(MAX_TIER, Math.floor(t)));
    }

    if (typeof d.unlockedRows === 'number') {
      GRID_ROWS = Math.max(4, Math.min(MAX_ROWS, Math.floor(d.unlockedRows)));
    }
    recomputeLayout();

    state.coins = Number(d.coins) || 0;
    state.highestTier = Math.max(1, Number(d.highestTier) || 1);
    state.merges = Number(d.merges) || 0;
    state.spawns = Number(d.spawns) || 0;
    state.settles = Number(d.settles) || 0;

    if (Array.isArray(d.fragments)) {
      for (var fi = 1; fi <= MAX_TIER; fi++) {
        fragments[fi] = Math.max(0, Math.min(10, Number(d.fragments[fi]) || 0));
      }
    }
    if (Array.isArray(d.codexDone)) {
      for (var ci2 = 1; ci2 <= MAX_TIER; ci2++) codexDone[ci2] = !!d.codexDone[ci2];
    }

    var elapsed = Math.max(0, (Date.now() - (Number(d.time) || Date.now())) / 1000);
    if (elapsed > 60) {
      var rate = coinsPerSecond();
      var eff = Math.min(elapsed, OFFLINE_CAP_SEC);
      var gain = Math.floor(rate * eff * OFFLINE_EFFICIENCY);
      if (gain > 0) {
        state.coins += gain;
        modal = { title: '离线收益已到账', amount: gain, seconds: eff, rate: rate };
      }
    }
  }

  function resetAll() {
    suppressSave = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  // ---------- 5. 玩法逻辑 ----------
  function idx(r, c) { return r * GRID_COLS + c; }
  function tierAt(i) { return state.cells[i]; }

  function coinsPerSecond() {
    var sum = 0;
    for (var i = 0; i < activeCells(); i++) {
      var t = state.cells[i];
      if (t > 0) sum += COIN_RATE[t - 1];
    }
    return sum;
  }

  function spawnTier1() {
    var empties = [];
    for (var i = 0; i < activeCells(); i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) {
      toast = {
        text: hasMaxTierUnit()
          ? '格子已满：长按满级单位变现可腾出空位'
          : '格子已满，先合并腾出空位',
        t: 2.0
      };
      return false;
    }
    var pick = empties[Math.floor(Math.random() * empties.length)];
    state.cells[pick] = 1;
    state.spawns++;
    anim[pick] = { t: 0, dur: 0.32, kind: 'spawn' };
    return true;
  }

  function autoSpawn() {
    var empties = [];
    for (var i = 0; i < activeCells(); i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) return;
    var cap = Math.max(1, state.highestTier - 3);
    var weights = [], total = 0;
    for (var t = 1; t <= cap; t++) { var w = Math.pow(t, 1.3); weights.push(w); total += w; }
    var roll = Math.random() * total, chosen = 1;
    for (var k = 0; k < weights.length; k++) { roll -= weights[k]; if (roll <= 0) { chosen = k + 1; break; } }
    var cellIdx = empties[Math.floor(Math.random() * empties.length)];
    state.cells[cellIdx] = chosen;
    state.spawns++;
    anim[cellIdx] = { t: 0, dur: 0.32, kind: 'spawn' };
    var cc = cellIdx % GRID_COLS, cr = Math.floor(cellIdx / GRID_COLS);
    floats.push({ x: cellCenterX(cc), y: cellCenterY(cr), t: 0, dur: 1.0, text: '自动放置 +' + chosen + '档' });
  }

  function doMerge(from, to) {
    if (from === to) return false;
    var tf = state.cells[from];
    var tt = state.cells[to];
    if (tf <= 0 || tt <= 0) return false;
    if (tf !== tt) return false;
    if (tt >= MAX_TIER) {
      toast = { text: '已是最高档（' + MAX_TIER + ' 档）：长按可变现金币', t: 2.0 };
      return false;
    }
    var targetTier = tt + 1;
    if (!tierGateOk(targetTier)) {
      toast = { text: gateGoalText(targetTier), t: 2.4 };
      return false;
    }
    state.cells[to] = tt + 1;
    state.cells[from] = 0;
    state.merges++;
    anim[to] = { t: 0, dur: 0.42, kind: 'merge' };
    anim[from] = { t: 0, dur: 0.2, kind: 'clear' };
    if (state.cells[to] > state.highestTier) state.highestTier = state.cells[to];

    var newTier = state.cells[to];
    fragments[newTier] = Math.min(10, (fragments[newTier] || 0) + 1);
    if (fragments[newTier] >= 10 && !codexDone[newTier]) {
      codexDone[newTier] = true;
      triggerCodexCelebration(newTier);
    }

    var cx = cellCenterX(to % GRID_COLS), cy = cellCenterY(Math.floor(to / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.0, text: '合体 → ' + newTier + '档' });
    bgPulse = 0.35;
    spawnParticles(cx, cy);
    screenShake = Math.min(1, screenShake + 0.6);
    playVoice(newTier);
    playSfx('sfx_merge');
    return true;
  }

  function triggerCodexCelebration(tier) {
    celebration = { tier: tier, t: 0, dur: 3.4 };
    playSfx('sfx_unlock');
    playVoice(tier);
    var cxp = W / 2, cyp = H * 0.42;
    for (var k = 0; k < 18; k++) {
      var ang = (Math.PI * 2 * k) / 18 + Math.random() * 0.3;
      var spd = 60 + Math.random() * 120;
      particles.push({
        x: cxp, y: cyp,
        vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 30,
        life: 0, dur: 1.4 + Math.random() * 0.8, color: '#f7d774'
      });
    }
  }

  function settleValue(tier) { return SETTLE_SECONDS * COIN_RATE[tier - 1]; }

  function doSettle(i) {
    var tier = state.cells[i];
    if (tier !== MAX_TIER) return false;
    var gain = settleValue(tier);

    state.cells[i] = 0;
    state.coins += gain;
    state.settles++;
    selected = -1;
    anim[i] = { t: 0, dur: 0.25, kind: 'clear' };

    var cx = cellCenterX(i % GRID_COLS), cy = cellCenterY(Math.floor(i / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.2, text: '+' + fmt(gain) + ' 变现' });
    toast = { text: tier + ' 档变现 +' + fmt(gain) + ' 金币（' + SETTLE_SECONDS + ' 秒产出）', t: 2.2 };
    bgPulse = 0.3;
    playVoice(MAX_TIER);
    playSfx('sfx_settle');
    return true;
  }

  function canSettle(i) { return i >= 0 && state.cells[i] === MAX_TIER; }

  // ---------- 五子棋小游戏逻辑 ----------
  function gomokuWin(b, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (var r = 0; r < GOMOKU_N; r++) {
      for (var c = 0; c < GOMOKU_N; c++) {
        if (b[r][c] !== who) continue;
        for (var di = 0; di < dirs.length; di++) {
          var dr = dirs[di][0], dc = dirs[di][1];
          var pr = r - dr, pc = c - dc;
          if (pr >= 0 && pr < GOMOKU_N && pc >= 0 && pc < GOMOKU_N && b[pr][pc] === who) continue;
          var cnt = 0, rr = r, cc = c;
          while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && b[rr][cc] === who) {
            cnt++; rr += dr; cc += dc;
          }
          if (cnt >= 5) return true;
        }
      }
    }
    return false;
  }

  function gomokuRun(r, c, who) {
    var dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    var max = 1;
    for (var di = 0; di < dirs.length; di++) {
      var dr = dirs[di][0], dc = dirs[di][1], cnt = 1;
      var rr = r + dr, cc = c + dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) {
        cnt++; rr += dr; cc += dc;
      }
      rr = r - dr; cc = c - dc;
      while (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] === who) {
        cnt++; rr -= dr; cc -= dc;
      }
      if (cnt > max) max = cnt;
    }
    return max;
  }

  function gomokuEval(r, c, who) {
    return Math.pow(10, Math.max(0, gomokuRun(r, c, who) - 1));
  }

  function gomokuBoardFull() {
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] === 0) return false;
    return true;
  }

  function gomokuRecordResult(who) {
    var key = (gomokuMode === 'pvp') ? 'pvp' : 'pve';
    if (who === 0) gomokuRecords[key].draw++;
    else if (who === 1) gomokuRecords[key].win++;
    else gomokuRecords[key].loss++;
    saveGomokuRecords();
  }

  function gomokuAfterMove(who) {
    if (gomokuWin(gomokuBoard, who)) {
      gomokuOver = true;
      if (gomokuMode === 'pvp') {
        gomokuResult = (who === 1) ? '玩家1胜' : '玩家2胜';
      } else {
        gomokuResult = (who === 1) ? '玩家胜' : '敌方胜';
      }
      gomokuRecordResult(who);
      if (who === 1 && gomokuMode === 'pve') rewardGomokuWin();
      return;
    }
    if (gomokuBoardFull()) {
      gomokuOver = true;
      gomokuResult = '平局';
      gomokuRecordResult(0);
    }
  }

  function rewardGomokuWin() {
    if (typeof state.coins === 'number') {
      state.coins += 1000;
      toast = { text: '五子棋获胜！金币 +1000', t: 2.4 };
      save();
    }
  }

  function handleGomokuMenuInput(p) {
    if (hitButton(p, GOMOKU_MENU_BACK, 44)) { gomokuOpen = false; return; }
    if (hitButton(p, GOMOKU_MENU_MODE_PVE, 44)) { gomokuMode = 'pve'; gomokuPName2 = '鬼'; return; }
    if (hitButton(p, GOMOKU_MENU_MODE_PVP, 44)) { gomokuMode = 'pvp'; return; }
    if (hitButton(p, GOMOKU_MENU_CHAR_PREV, 44)) { cycleGomokuChar(1, -1); return; }
    if (hitButton(p, GOMOKU_MENU_CHAR_NEXT, 44)) { cycleGomokuChar(1, 1); return; }
    if (gomokuMode === 'pvp') {
      if (hitButton(p, GOMOKU_MENU_CHAR2_PREV, 44)) { cycleGomokuChar(2, -1); return; }
      if (hitButton(p, GOMOKU_MENU_CHAR2_NEXT, 44)) { cycleGomokuChar(2, 1); return; }
    }
    for (var bi = 0; bi < GOMOKU_MENU_BG.length; bi++) {
      if (hitButton(p, GOMOKU_MENU_BG[bi], 44)) { gomokuBG = bi; return; }
    }
    if (hitButton(p, GOMOKU_MENU_START, 44)) {
      gomokuScreen = 'play';
      resetGomoku();
      return;
    }
  }
  function cycleGomokuChar(side, dir) {
    var names = CHARACTER_NAMES;
    var cur = (side === 1) ? gomokuPName : gomokuPName2;
    var idx = names.indexOf(cur);
    if (idx < 0) idx = 0;
    idx = (idx + dir + names.length) % names.length;
    if (side === 1) gomokuPName = names[idx]; else gomokuPName2 = names[idx];
  }

  function aiGomokuMove() {
    if (!gomokuOpen || gomokuOver || gomokuTurn !== 2) return;

    var cands = [];
    var anyStone = false;
    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++)
        if (gomokuBoard[r][c] !== 0) anyStone = true;
    for (var r2 = 0; r2 < GOMOKU_N; r2++) {
      for (var c2 = 0; c2 < GOMOKU_N; c2++) {
        if (gomokuBoard[r2][c2] !== 0) continue;
        if (!anyStone) { cands.push([r2, c2]); continue; }
        var near = false;
        for (var dr = -2; dr <= 2; dr++)
          for (var dc = -2; dc <= 2; dc++) {
            var rr = r2 + dr, cc = c2 + dc;
            if (rr >= 0 && rr < GOMOKU_N && cc >= 0 && cc < GOMOKU_N && gomokuBoard[rr][cc] !== 0) near = true;
          }
        if (near) cands.push([r2, c2]);
      }
    }
    if (cands.length === 0) return;

    for (var i = 0; i < cands.length; i++) {
      var r = cands[i][0], c = cands[i][1];
      gomokuBoard[r][c] = 2;
      if (gomokuWin(gomokuBoard, 2)) { gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[r][c] = 0;
    }
    for (var j = 0; j < cands.length; j++) {
      var rr2 = cands[j][0], cc2 = cands[j][1];
      gomokuBoard[rr2][cc2] = 1;
      if (gomokuWin(gomokuBoard, 1)) { gomokuBoard[rr2][cc2] = 2; gomokuAfterMove(2); if (!gomokuOver) gomokuTurn = 1; return; }
      gomokuBoard[rr2][cc2] = 0;
    }
    var best = null, bestScore = -1;
    for (var k = 0; k < cands.length; k++) {
      var r3 = cands[k][0], c3 = cands[k][1];
      var score = gomokuEval(r3, c3, 2) + gomokuEval(r3, c3, 1) * 0.95;
      score -= (Math.abs(r3 - GOMOKU_N / 2) + Math.abs(c3 - GOMOKU_N / 2)) * 0.01;
      if (score > bestScore) { bestScore = score; best = [r3, c3]; }
    }
    if (best) {
      gomokuBoard[best[0]][best[1]] = 2;
      gomokuAfterMove(2);
    }
    if (!gomokuOver) gomokuTurn = 1;
  }

  function firstChar(s) { return s ? String(s).charAt(0) : ''; }

  function drawGomoku() {
    var bg = GOMOKU_BGS[gomokuBG] || GOMOKU_BGS[0];
    ctx.fillStyle = bg.bg;
    ctx.fillRect(0, 0, W, H);
    var title = (gomokuMode === 'pvp')
      ? ('五子棋 · ' + gomokuPName + ' vs ' + gomokuPName2)
      : ('五子棋 · ' + gomokuPName + ' vs ' + gomokuPName2);
    text(title, GOMOKU_FRAME_X + GOMOKU_FRAME_W / 2, 18, 18, '#ffffff', 'center', '800', SERIF);

    fillRR(GOMOKU_FRAME_X, GOMOKU_FRAME_Y, GOMOKU_FRAME_W, GOMOKU_FRAME_W, 14, bg.frame);

    ctx.strokeStyle = bg.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 0; i < GOMOKU_N; i++) {
      var x = GOMOKU_ORIGIN_X + i * GS;
      ctx.moveTo(x, GOMOKU_ORIGIN_Y); ctx.lineTo(x, GOMOKU_ORIGIN_Y + BOARD_SPAN);
      var y = GOMOKU_ORIGIN_Y + i * GS;
      ctx.moveTo(GOMOKU_ORIGIN_X, y); ctx.lineTo(GOMOKU_ORIGIN_X + BOARD_SPAN, y);
    }
    ctx.stroke();

    var stars = [3, 6, 9];
    ctx.fillStyle = bg.star;
    for (var a = 0; a < stars.length; a++)
      for (var b = 0; b < stars.length; b++) {
        ctx.beginPath();
        ctx.arc(GOMOKU_ORIGIN_X + stars[a] * GS, GOMOKU_ORIGIN_Y + stars[b] * GS, 3, 0, Math.PI * 2);
        ctx.fill();
      }

    for (var r = 0; r < GOMOKU_N; r++)
      for (var c = 0; c < GOMOKU_N; c++) {
        var v = gomokuBoard[r][c];
        if (v === 0) continue;
        var px = GOMOKU_ORIGIN_X + c * GS, py = GOMOKU_ORIGIN_Y + r * GS;
        var col = (v === 1) ? '#f1c40f' : '#2c3e50';
        var rad = GS * 0.42;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
        ctx.restore();
        var label = (v === 1) ? firstChar(gomokuPName) : firstChar(gomokuPName2);
        text(label, px, py, 15, v === 1 ? '#141414' : '#ffffff', 'center', '800');
      }

    // 右侧控制区：回合 / 胜负提示
    var curName = (gomokuTurn === 1) ? gomokuPName : gomokuPName2;

  // ---------- 6. 输入 ----------
  var cv = document.getElementById('cv');

  var SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","STSong","SimSun",serif';

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vw = window.innerWidth, vh = window.innerHeight;
    var stage = document.getElementById('stage');
    // 横屏舞台缩放器：scale = min(vw/812, vh/375)，居中 + 黑边。
    // 注意：缩放完全由 #stage 的 CSS transform 承担，canvas 自身只按 DPR 放大，避免双重缩放。
    var scale = Math.min(vw / W, vh / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    view.scale = scale;
    view.ox = 0;
    view.oy = 0;
    view.dpr = dpr;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    if (stage) stage.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function toLogic(ev) {
    var r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / view.scale,
      y: (ev.clientY - r.top) / view.scale
    };
  }

  function hitCell(p) {
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var cx = cellCenterX(c), cy = cellCenterY(r);
        if (p.x >= cx - CELL / 2 && p.x <= cx + CELL / 2 &&
            p.y >= cy - CELL / 2 && p.y <= cy + CELL / 2) return idx(r, c);
      }
    }
    return -1;
  }

  function hitRect(p, b) {
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }

  function hitButton(p, b, minPx) {
    minPx = minPx || 0;
    var hw = Math.max(b.w, minPx / view.scale);
    var hh = Math.max(b.h, minPx / view.scale);
    var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    return Math.abs(p.x - cx) <= hw / 2 && Math.abs(p.y - cy) <= hh / 2;
  }

  var pointer = { down: false, startX: 0, startY: 0, moved: false, cell: -1, settled: false };

  cv.addEventListener('pointermove', function (ev) {

  // ---------- 7. 绘制工具 ----------
  function rr(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return false;
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    return true;
  }

  function fillRR(x, y, w, h, r, color) {
    if (!rr(x, y, w, h, r)) return;
    ctx.fillStyle = color;
    ctx.fill();
  }
  function strokeRR(x, y, w, h, r, color, lw) {
    if (!rr(x, y, w, h, r)) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw || 2;
    ctx.stroke();
  }

  function text(str, x, y, size, color, align, weight, font) {
    ctx.font = (weight || '600') + ' ' + size + 'px ' + (font || '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif');
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function shade(hex, k) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    if (k >= 0) {
      r = Math.round(r + (255 - r) * k);
      g = Math.round(g + (255 - g) * k);
      b = Math.round(b + (255 - b) * k);
    } else {
      r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k));
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function srgbLum(hex) {
    var h = hex.replace('#', '');
    var ch = [];
    for (var k = 0; k < 3; k++) {
      var v = parseInt(h.substr(k * 2, 2), 16) / 255;
      ch.push(v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    }
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  function contrastRatio(l1, l2) {
    var hi = Math.max(l1, l2) + 0.05;
    var lo = Math.min(l1, l2) + 0.05;
    return hi / lo;
  }

  function contrastText(hex) {
    var L = srgbLum(hex);
    return contrastRatio(1, L) >= contrastRatio(L, srgbLum(TEXT_DARK)) ? TEXT_LIGHT : TEXT_DARK;
  }

  function tierTextContrast(tier) {
    var bg = TIER_COLORS[tier - 1];
    return contrastRatio(srgbLum(contrastText(bg)), srgbLum(bg));
  }

  function easeOutBack(t) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return String(n);
    var units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
    var u = 0;
    while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
    return n.toFixed(n < 10 ? 2 : (n < 100 ? 1 : 0)) + units[u];
  }

  function fmtTime(sec) {
    sec = Math.floor(sec);
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
    if (hh > 0) return hh + ' 小时 ' + mm + ' 分';
    return mm + ' 分 ' + (sec % 60) + ' 秒';
  }

  // ---------- 8. 绘制（银魂 anime 风格） ----------
  function drawBackground() {
    // #0b0e14 → #141b28 渐变
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#141b28');
    g.addColorStop(0.55, '#0e131e');
    g.addColorStop(1, '#0b0e14');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 青海波（seigaiha）同心波纹，5-8% 透明度
    drawSeigaiha();

    // 顶部柔光
    var rg = ctx.createRadialGradient(W * 0.28, 30, 10, W * 0.28, 30, 320);
    rg.addColorStop(0, 'rgba(232,193,90,' + (0.10 + bgPulse * 0.22) + ')');
    rg.addColorStop(1, 'rgba(232,193,90,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W * 0.6, H);

    // 底部冷光
    var bg = ctx.createRadialGradient(PANEL_X, H + 40, 10, PANEL_X, H + 40, 340);
    bg.addColorStop(0, 'rgba(58,167,216,0.06)');
    bg.addColorStop(1, 'rgba(58,167,216,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(PANEL_X - 100, H - 340, W - PANEL_X + 100, 340);
  }

  function drawSeigaiha() {
    var R = 30;
    var cols = Math.ceil(W / R) + 2;
    var rows = Math.ceil(H / R) + 2;
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#3a4a78';
    ctx.lineWidth = 1.4;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var cx = c * R * 2 - R;
        var cy = r * R * 2 - R + (c % 2 ? R : 0);
        for (var k = 1; k <= 3; k++) {
          ctx.beginPath();
          ctx.arc(cx, cy, R * k * 0.5, Math.PI, 0);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  function drawPanelBg() {
    // 右侧控制面板
    fillRR(PANEL_X, 0, PANEL_W, H, 0, '#141b28');
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(PANEL_X, 0, 1, H);                 // 中线高光
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(PANEL_X + 1, 0, 1, H);
    // 面板顶栏底色
    fillRR(PANEL_X, 0, PANEL_W, HUD_H, 0, 'rgba(20,27,40,0.96)');
    ctx.fillStyle = 'rgba(232,193,90,0.18)';
    ctx.fillRect(PANEL_X, HUD_H - 1, PANEL_W, 1);  // 金色分隔线
  }

  function drawGrid() {
    // 棋盘底板
    fillRR(GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 18, 'rgba(10,14,22,0.85)');
    strokeRR(GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 18, '#2a3550', 1.5);

    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var i = idx(r, c);
        var cx = cellCenterX(c), cy = cellCenterY(r);
        var x = cx - CELL / 2, y = cy - CELL / 2;

        // 空槽位：rounded #141b28 瓦片 + 1px #2a3550 边框 + 内阴影
        var tx = x + 3, ty = y + 3, ts = CELL - 6;
        fillRR(tx, ty, ts, ts, 10, '#141b28');
        strokeRR(tx, ty, ts, ts, 10, '#2a3550', 1);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        fillRR(tx + 2, ty + ts - 5, ts - 4, 4, 6, 'rgba(0,0,0,0.35)');
        ctx.restore();

        var tier = state.cells[i];
        if (tier <= 0) continue;

        if (drag && drag.from === i) {
          fillRR(tx, ty, ts, ts, 10, 'rgba(255,255,255,0.12)');
          continue;
        }

        drawUnit(x, y, tier, i, 1);
      }
    }
  }

  function drawUnit(x, y, tier, i, extraAlpha) {
    var a = anim[i];
    var s = 1;
    var alpha = extraAlpha;
    if (a && a.kind) {
      var p = a.t / a.dur;
      if (p < 1) {
        if (p < 0) p = 0;
        if (a.kind === 'merge') s = 0.55 + 0.45 * easeOutBack(Math.min(1, p * 1.15));
        else if (a.kind === 'spawn') s = 0.5 + 0.5 * easeOutBack(p);
        else if (a.kind === 'clear') alpha = extraAlpha * (1 - p);
      }
    }
    if (!isFinite(s) || s < 0.2) s = 0.2;
    if (!isFinite(alpha)) alpha = 1;

    var color = TIER_COLORS[tier - 1];
    var size = (CELL - 8) * s;
    var px = x + (CELL - size) / 2;
    var py = y + (CELL - size) / 2;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

    var sprite = boardImg[tier];
    if (sprite) {
      var bob = Math.sin(clock * 2 + i) * 1.5;
      var ms = 1 + Math.sin(clock * 1.5 + i) * 0.02;
      var ss = (CELL - 8) * s * ms;
      var sx = x + (CELL - ss) / 2;
      var sy = y + (CELL - ss) / 2 + bob;
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      ctx.drawImage(sprite, sx, sy, ss, ss);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      strokeRR(sx, sy, ss, ss, 13, 'rgba(255,255,255,0.18)', 1);
      strokeRR(sx, sy, ss, ss, 13, shade(color, 0.3), 1);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.5;
      ctx.beginPath();
      ctx.ellipse(sx + ss / 2, sy + ss * 0.22, ss * 0.38, ss * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.restore();
      if (selected === i) {
        strokeRR(sx + 1, sy + 1, ss - 2, ss - 2, 13, '#ffffff', 3);
      }
      if (tier === MAX_TIER || tier >= 13) strokeRR(sx + 1.5, sy + 1.5, ss - 3, ss - 3, 13, '#ffe58a', 2);
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 3;
      var g = ctx.createLinearGradient(px, py, px, py + size);
      g.addColorStop(0, shade(color, 0.28));
      g.addColorStop(0.5, color);
      g.addColorStop(1, shade(color, -0.22));
      fillRR(px + 4, py + 4, size - 8, size - 8, 12, g);
      strokeRR(px + 4, py + 4, size - 8, size - 8, 12, 'rgba(255,255,255,0.18)', 1);
      strokeRR(px + 4, py + 4, size - 8, size - 8, 12, shade(color, 0.3), 1);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      if (size - 18 > 0) {
        ctx.globalAlpha *= 0.28;
        fillRR(px + 9, py + 8, size - 18, (size - 8) * 0.32, 8, '#ffffff');
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.5;
      ctx.beginPath();
      ctx.ellipse(px + 4 + (size - 8) / 2, py + 4 + (size - 8) * 0.22, (size - 8) * 0.38, (size - 8) * 0.16, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.restore();
      if (selected === i) {
        strokeRR(px + 1, py + 1, size - 2, size - 2, 13, '#ffffff', 3);
      }
      if (tier === MAX_TIER || tier >= 13) strokeRR(px + 1.5, py + 1.5, size - 3, size - 3, 13, '#ffe58a', 2);
    }

    var fg = contrastText(color);
    var fs = Math.max(11, Math.floor(size * 0.40));
    text(String(tier), px + size / 2, py + size / 2, fs, fg, 'center', '800');
    ctx.restore();

    var small = Math.max(9, Math.floor(size * 0.19));
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.85;
    text('+' + COIN_RATE[tier - 1], px + size - 10, py + size - 12, small, fg, 'right', '700');
    ctx.globalAlpha = 1;
  }

  function drawPressRing() {
    if (press.i < 0 || state.cells[press.i] !== MAX_TIER) return;
    var p = Math.max(0, Math.min(1, press.t / LONG_PRESS_MS));
    var r = Math.floor(press.i / GRID_COLS), c = press.i % GRID_COLS;
    var cx = cellCenterX(c), cy = cellCenterY(r);
    var rad = CELL / 2 - 4;
    ctx.save();
    var grd = ctx.createLinearGradient(cx - rad, cy - rad, cx + rad, cy + rad);
    grd.addColorStop(0, 'rgba(255,255,255,0.28)');
    grd.addColorStop(1, 'rgba(255,229,138,0.18)');
    ctx.lineWidth = 1;
    ctx.strokeStyle = grd;
    ctx.beginPath(); ctx.arc(cx, cy, rad + 3, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    if (p > 0) {
      ctx.strokeStyle = '#ffe58a';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCover(img, dx, dy, dw, dh) {
    var ir = img.width / img.height, dr = dw / dh;
    var sw, sh, sx, sy;
    if (ir > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
    else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  }

  function drawCollection() {
    ctx.fillStyle = 'rgba(6,6,12,1)';
    ctx.fillRect(0, 0, W, H);
    text('角色图鉴', W / 2, 30, 24, '#e8c15a', 'center', '800', SERIF);
    text('合出对应档位即可解锁 · 点卡片查看详情 · 变现=长按满级单位换金币', W / 2, 54, 12, '#9a9ab0', 'center', '500');
    strokeRR(W / 2 - 140, 62, 280, 1, 1, 'rgba(232,193,90,0.35)', 1);

    codexRects = [];
    var cardW = (W - 32 - 12) / 2;
    var cardH = 96;
    var gap = 12;
    var startY = 70;
    collectionMaxScroll = Math.max(0, (MAX_TIER / 2) * (cardH + gap) - (H - 130));

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, startY, W, H - 130);
    ctx.clip();

    for (var i = 0; i < MAX_TIER; i++) {
      var r = Math.floor(i / 2), c = i % 2;
      var x = 16 + c * (cardW + 12);
      var y = startY + r * (cardH + gap) - collectionScrollY;
      var tierN = i + 1;
      var unlocked = codexCardUnlocked(tierN);
      var isGateTier = GATE_TIERS[tierN];

      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      if (unlocked && codexImg[tierN]) {
        fillRR(x, y, cardW, cardH, 16, '#1c1c2a');
        drawCover(codexImg[tierN], x, y, cardW, cardH);
      } else {
        fillRR(x, y, cardW, cardH, 16, 'rgba(255,255,255,0.06)');
      }
      ctx.restore();
      strokeRR(x, y, cardW, cardH, 16, TIER_COLORS[i], 2.5);

      if (unlocked && codexImg[tierN]) {
        var bg2 = ctx.createLinearGradient(0, y + cardH - 30, 0, y + cardH);
        bg2.addColorStop(0, 'rgba(0,0,0,0)');
        bg2.addColorStop(1, 'rgba(0,0,0,0.62)');
        ctx.fillStyle = bg2;
        ctx.fillRect(x, y + cardH - 30, cardW, 30);
      }

      fillRR(x + 10, y + 10, 32, 32, 10, unlocked ? TIER_COLORS[i] : 'rgba(255,255,255,0.12)');
      strokeRR(x + 10, y + 10, 32, 32, 10, 'rgba(255,255,255,0.18)', 1);
      text(String(i + 1), x + 26, y + 26, 15, unlocked ? contrastText(TIER_COLORS[i]) : '#6d6d83', 'center', '800');

      var name = unlocked ? CHARACTER_NAMES[i] : (isGateTier ? gateGoalText(tierN) : '未解锁');
      text(name, x + 12, y + cardH - 14, unlocked ? 14 : 10,
           unlocked ? '#ffffff' : '#d8d8e6', 'left', unlocked ? '800' : '700');
      if (unlocked) {
        text('▶ 原声', x + cardW - 12, y + cardH - 14, 11, '#9fe0ff', 'right', '700');
        text('+' + COIN_RATE[i] + '/秒', x + 12, y + cardH - 32, 11, '#8fd8a8', 'left', '600');
        text('碎片 ' + fragments[tierN] + '/10', x + 12, y + cardH - 48, 10, codexDone[tierN] ? '#e8c15a' : '#cfcfe0', 'left', '600');
      } else if (!isGateTier) {
        text('需要 ' + tierN + ' 档', x + 12, y + cardH - 32, 11, '#5c5c72', 'left', '600');
      }

      codexRects.push({ rect: { x: x, y: y, w: cardW, h: cardH }, tier: tierN });
    }

    ctx.restore();

    drawButton(CODEX_CLOSE_BTN, '关闭', '#e8c15a');
    if (collectionMaxScroll > 0) {
      text('上下滑动查看更多', W / 2, H - 30, 11, '#8a93ad', 'center', '500');
    } else {
      text('（点击任意空白处也可关闭）', W / 2, H - 30, 11, '#8a93ad', 'center', '500');
    }
  }

  function drawDetail() {
    ctx.fillStyle = 'rgba(6,6,12,1)';
    ctx.fillRect(0, 0, W, H);
    var cx = 28, cy = 64, cw = W - 56, ch = 230;
    fillRR(cx, cy, cw, ch, 18, 'rgba(20,20,34,0.96)');
    strokeRR(cx, cy, cw, ch, 18, '#e8c15a', 3);
    var img = codexImg[detailTier];
    if (img) {
      ctx.save();
      ctx.beginPath(); ctx.rect(cx, cy, cw, ch); ctx.clip();
      var ir = img.width / img.height, dr = cw / ch;
      var dw, dh;
      if (ir > dr) { dh = ch; dw = ch * ir; } else { dw = cw; dh = cw / ir; }
      var dx = cx + (cw - dw) / 2, dy = cy + (ch - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    }
    text(CHARACTER_NAMES[detailTier - 1], cx + cw / 2, cy + 30, 22, '#e8c15a', 'center', '800', SERIF);
    text('第 ' + detailTier + ' 档 · ' + CHARACTER_NAMES[detailTier - 1], cx + cw / 2, cy + 60, 13, '#9a9ab0', 'center', '500');
    text('+' + COIN_RATE[detailTier - 1] + ' 金币/秒', cx + cw / 2, cy + 84, 16, '#8fd8a8', 'center', '700');
    drawButton(DETAIL_VOICE_BTN, '▶ 原声', '#3aa7d8');
    drawButton(DETAIL_CLOSE_BTN, '关闭', '#e8c15a');
  }

  function drawModal() {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    var bw = W - 72, bh = 200, bx = 36, by = H / 2 - bh / 2;
    fillRR(bx, by, bw, bh, 18, '#1c1c2a');
    strokeRR(bx, by, bw, bh, 18, '#e8c15a', 2);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 2);

    text('离线收益已到账', W / 2, by + 40, 19, '#e8c15a', 'center', '800', SERIF);
    text('+' + fmt(modal.amount), W / 2, by + 84, 34, '#5fe08f', 'center', '800');
    text('离线 ' + fmtTime(modal.seconds) + '（8 小时封顶 · 50% 效率）',
         W / 2, by + 120, 12, '#9a9ab0', 'center', '500');
    text('当前每秒产出 +' + fmt(modal.rate), W / 2, by + 142, 12, '#8a93ad', 'center', '500');

    var btn = { x: bx + 24, y: by + bh - 60, w: bw - 48, h: 44 };
    var bg = ctx.createLinearGradient(0, btn.y, 0, btn.y + btn.h);
    bg.addColorStop(0, 'rgba(255,255,255,0.18)');
    bg.addColorStop(1, '#2ecc71');
    fillRR(btn.x, btn.y, btn.w, btn.h, 18, shade('#2ecc71', -0.12));
    if (rr(btn.x, btn.y, btn.w, btn.h - 3, 18)) { ctx.fillStyle = bg; ctx.fill(); }
    strokeRR(btn.x, btn.y, btn.w, btn.h, 18, 'rgba(11,14,20,0.85)', 2);
    text('开始游戏', btn.x + btn.w / 2, btn.y + btn.h / 2 - 1, 17, '#ffffff', 'center', '700');
  }

  function drawToast() {
    if (!toast) return;
    ctx.globalAlpha = Math.min(1, toast.t * 2);
    // 居中于棋盘区，避开左上「返回首页」与右侧 HUD
    var x = 110, w = BOARD_X1 - 110, h = 34, y = 6;
    if (w > 360) { w = 360; x = 110 + (BOARD_X1 - 110 - 360) / 2; }
    fillRR(x, y, w, h, 17, 'rgba(20,20,32,0.92)');
    strokeRR(x, y, w, h, 17, 'rgba(232,193,90,0.4)', 1);
    text(toast.text, x + w / 2, y + h / 2, 13, '#ffe58a', 'center', '600');
    ctx.globalAlpha = 1;
  }

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawPanelBg();
    drawHomeButton();
    drawHud();

    ctx.save();
    if (screenShake > 0) {
      var sh = screenShake * 4;
      ctx.translate((Math.random() * 2 - 1) * sh, (Math.random() * 2 - 1) * sh);
    }
    drawGrid();
    drawPressRing();
    drawDragGhost();
    ctx.restore();

    drawSpawnArea();
    drawUnlockButton();

    if (!collectionOpen && !legendOpen && !gomokuOpen && !brawlerOpen) {
      drawLegend();
      drawStats();
      drawFriendBtn();
      drawBottom();
    }

    drawParticles();
    drawFloats(dt);
    drawToast();

    if (celebration) drawCelebration();
    if (collectionOpen) drawCollection();
    if (legendOpen) drawLegendOverlay();
    if (detailOpen) drawDetail();
    if (modal) drawModal();
    if (gomokuOpen) {
      if (gomokuScreen === 'menu') drawGomokuMenu(); else drawGomoku();
    }
    if (brawlerOpen) drawBrawler();
  }

  function drawParticles() {
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      var a = 1 - p.life / p.dur;
      ctx.globalAlpha = Math.max(0, a);
      fillRR(p.x - 3, p.y - 3, 6, 6, 3, p.color);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- 9. 主循环 ----------
  function update(dt) {
    var cps = coinsPerSecond();
    if (cps > 0) state.coins += cps * dt;

    autoSpawnTimer += dt;
    if (autoSpawnTimer >= AUTO_SPAWN_INTERVAL) { autoSpawnTimer = 0; autoSpawn(); }

    updateBrawler(dt);

    for (var i = 0; i < anim.length; i++) {
      var a = anim[i];
      if (a.kind) {
        a.t += dt;
        if (a.t >= a.dur) { a.t = 1; a.kind = null; }
      }
    }
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    if (bgPulse > 0) bgPulse = Math.max(0, bgPulse - dt * 1.2);
    if (press.i >= 0) press.t += dt * 1000;

    clock += dt;
    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];
      pt.life += dt;
      if (pt.life >= pt.dur) { particles.splice(pi, 1); continue; }
      pt.vy += 140 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 2.2);

    if (celebration) { celebration.t += dt; if (celebration.t >= celebration.dur) celebration = null; }

    saveTimer += dt;
    if (saveTimer >= 2) { saveTimer = 0; save(); }
  }

  function loop(ts) {
    var now = ts / 1000;
    var dt = lastFrame ? Math.min(0.1, now - lastFrame) : 0;
    lastFrame = now;
    if (!modal) update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  // ---------- 10. 启动 ----------
  function boot() {
    resize();
    load();
    loadGomokuRecords();
    loadAssets();
    if (state.cells.every(function (v) { return v === 0; }) && state.merges === 0 && state.coins === 0) {
      for (var i = 0; i < INITIAL_UNITS; i++) spawnTier1();
      toast = { text: '拖动一个单位到另一个同档单位上即可合并升档（长按满级单位可变现金币）', t: 3.2 };
    }
    // URL 参数：mode=gomoku 自动打开五子棋菜单（home.html 跳转入口）
    try {
      if (location.search && location.search.indexOf('mode=gomoku') >= 0) {
        gomokuOpen = true;
        gomokuScreen = 'menu';
      }
    } catch (e) {}
    window.__gameReady = true;
    requestAnimationFrame(loop);
  }

  // 暴露给自动化验证使用
  window.__game = {
    state: state,
    coinsPerSecond: coinsPerSecond,
    spawnTier1: spawnTier1,
    doMerge: doMerge,
    hitCellAt: function (r, c) { return { x: cellCenterX(c), y: cellCenterY(r) }; },
    cellCenterX: cellCenterX,
    cellCenterY: cellCenterY,
    save: save,
    saveKey: SAVE_KEY,
    version: 'h5-fallback-2.4.0',
    isReady: function () { return window.__gameReady === true; },
    isCollectionOpen: function () { return collectionOpen; },
    isModalOpen: function () { return !!modal; },
    // T-007 三项修复的自测钩子
    settleValue: settleValue,
    doSettle: doSettle,
    settleSeconds: SETTLE_SECONDS,
    longPressMs: LONG_PRESS_MS,
    maxTier: MAX_TIER,
    isPressActive: function () { return press.i >= 0; },
    canSettleAt: canSettle,
    cardUnlocked: function (i) { return state.highestTier >= i + 1; },
    unlockedCardCount: unlockedCardCount,
    isLastCardUnlocked: isLastCardUnlocked,
    // 设计选项 D：7/8 档解锁门槛的自测钩子
    tier7Unlocked: tier7Unlocked,
    tier8Unlocked: tier8Unlocked,
    codexCardUnlocked: function (i) { return codexCardUnlocked(i + 1); },
    setSettles: function (n) { state.settles = n; return state.settles; },
    tierTextColor: function (tier) { return contrastText(TIER_COLORS[tier - 1]); },
    tierTextContrast: tierTextContrast,
    allTierContrasts: function () {
      var out = [];
      for (var t = 1; t <= MAX_TIER; t++) {
        out.push({ tier: t, color: TIER_COLORS[t - 1], text: contrastText(TIER_COLORS[t - 1]),
                   ratio: Math.round(tierTextContrast(t) * 100) / 100 });
      }
      return out;
    },
    layout: {
      W: W, H: H, GRID_X: GRID_X, GRID_Y: GRID_Y, CELL: CELL, GAP: GAP,
      COLS: GRID_COLS, ROWS: GRID_ROWS,
      SPAWN_BTN: SPAWN_BTN, COLL_BTN: COLL_BTN, RESET_BTN: RESET_BTN
    },
    toClient: function (x, y) {
      var r = cv.getBoundingClientRect();
      return { x: r.left + x * view.scale, y: r.top + y * view.scale };
    },
    coinRateMax: COIN_RATE[MAX_TIER - 1],
    assetsLoaded: function () { return { board: loadedBoard, codex: loadedCodex, audio: loadedAudio, total: 24 }; },
    isMuted: function () { return muted; },
    playVoice: playVoice,
    boardImgLoaded: function (t) { return !!boardImg[t]; },
    codexImgLoaded: function (t) { return !!codexImg[t]; },
    gomoku: {
      N: GOMOKU_N,
      isOpen: function () { return gomokuOpen; },
      isOver: function () { return gomokuOver; },
      result: function () { return gomokuResult; },
      turn: function () { return gomokuTurn; },
      board: function () { return gomokuBoard; },
      open: function () { gomokuOpen = true; gomokuScreen = 'play'; resetGomoku(); return gomokuBoard; },
      close: function () { gomokuOpen = false; },
      reset: function () { resetGomoku(); },
      place: function (r, c, who) {
        if (r < 0 || r >= GOMOKU_N || c < 0 || c >= GOMOKU_N) return false;
        if (gomokuBoard[r][c] !== 0) return false;
        gomokuBoard[r][c] = who;
        gomokuAfterMove(who);
        return true;
      },
      win: function (b, who) { return gomokuWin(b, who); },
      aiMove: function () { aiGomokuMove(); },
      setTurn: function (t) { gomokuTurn = t; },
      origin: function () { return { x: GOMOKU_ORIGIN_X, y: GOMOKU_ORIGIN_Y, gs: GS }; },
      buttons: { entry: null, back: GOMOKU_BACK_BTN, restart: GOMOKU_RESTART_BTN }
    },
    tick: function (dt) { update(dt); },
    brawler: {
      isOpen: function () { return brawlerOpen; },
      isOver: function () { return brawlerOver; },
      result: function () { return brawlerResult; },
      wave: function () { return brawlerWave; },
      score: function () { return brawlerScore; },
      enemies: function () { return enemies.length; },
      player: function () { return { x: bw.x, y: bw.y, hp: bw.hp, maxhp: bw.maxhp, atkT: bw.atkT }; },
      open: function () { brawlerOpen = true; resetBrawler(); return true; },
      close: function () { brawlerOpen = false; },
      reset: function () { resetBrawler(); },
      attack: function () { brawlerAttack(); },
      draw: function () { drawBrawler(); },
      buttons: { entry: null, back: BRAWLER_BACK_BTN, restart: BRAWLER_RESTART_BTN }
    }
  };

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  boot();
})();
</script>
<script src="assets/js/social.js" defer></script>
