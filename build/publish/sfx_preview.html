<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFX 试听 · 合并/兑换/图鉴解锁</title>
<style>
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#11151c;color:#e8edf2;margin:0;padding:32px;display:flex;flex-direction:column;align-items:center;gap:8px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{color:#8a97a6;margin:0 0 20px;font-size:13px}
  .row{display:flex;align-items:center;gap:16px;background:#1b212b;border:1px solid #2a323e;border-radius:12px;padding:16px 20px;width:320px;margin-bottom:12px}
  .row .ico{font-size:24px;width:32px;text-align:center}
  .row .meta{flex:1}
  .row .meta .name{font-weight:600;font-size:15px}
  .row .meta .desc{color:#8a97a6;font-size:12px;margin-top:2px}
  button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
  button:hover{background:#2563eb}
  button:active{transform:translateY(1px)}
  footer{color:#5d6878;font-size:11px;margin-top:16px}
</style>
</head>
<body>
  <h1>游戏音效试听</h1>
  <p class="sub">点击播放 · 三个核心 SFX（程序合成 · 44100/mono/96kbps MP3）</p>

  <div class="row">
    <div class="ico">🔗</div>
    <div class="meta"><div class="name">sfx_merge</div><div class="desc">合并成功 · 上升 blip (~0.25s)</div></div>
    <button onclick="play('merge')">▶ 试听</button>
  </div>

  <div class="row">
    <div class="ico">🪙</div>
    <div class="meta"><div class="name">sfx_settle</div><div class="desc">兑换/结算 · 硬币 ding (~0.4s)</div></div>
    <button onclick="play('settle')">▶ 试听</button>
  </div>

  <div class="row">
    <div class="ico">✨</div>
    <div class="meta"><div class="name">sfx_unlock</div><div class="desc">图鉴解锁 · 琶音+闪烁 (~0.8s)</div></div>
    <button onclick="play('unlock')">▶ 试听</button>
  </div>

  <footer>音频文件位于 assets/audio/ — 与主游戏同目录，引用路径一致</footer>

  <audio id="a"></audio>
  <script>
    const map = {
      merge: 'assets/audio/sfx_merge.mp3',
      settle: 'assets/audio/sfx_settle.mp3',
      unlock: 'assets/audio/sfx_unlock.mp3'
    };
    const el = document.getElementById('a');
    function play(k){
      el.src = map[k];
      el.currentTime = 0;
      el.play().catch(e=>alert('播放失败：'+e.message));
    }
  </script>
</body>
</html>
