<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e14">
<title>平A闯关 · 银魂武士</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
  #rot { display: none; position: fixed; inset: 0; z-index: 50; background: #05050a;
    color: #f7d774; align-items: center; justify-content: center; text-align: center;
    font-size: 18px; font-weight: 700; padding: 24px; box-sizing: border-box; }
  #rot.show { display: flex; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="rot">请将手机竖屏握持后继续 ↻</div>
<script>
(function () {
  "use strict";

  /* =========================================================================
   * 平A闯关 · 横版动作小游戏（独立单文件版，与「合并武士」共享存档金币）
   * 存档键 / JSON 形状 / coins 字段名 与 index.html 完全一致：
   *   SAVE_KEY = 'merge_samurai_save_v1'
   *   { v:1, cells:[20], coins:Number, highestTier, merges, spawns, settles, time }
   * 通关奖励会写入该存档的 coins 字段，从而带入主游戏。
   * ========================================================================= */

  // 逻辑舞台固定为横屏 812×375；缩放器按 min(vw/W, vh/H) 居中，黑边 letterbox。
  var W = 812, H = 375;
  var SAVE_KEY = 'merge_samurai_save_v1';
  var PROGRESS_KEY = 'merge_samurai_action_progress_v1';
  var LEVELS = 12;

  // ---------- 银魂 premium 调色板 / 字体 ----------
  var PAL = {
    bg: '#0b0e14', panel: '#141b28', line: '#2a3550',
    gold: '#e8c15a', gold2: '#ffd23a', red: '#d84a3b', blue: '#3aa7d8',
    paper: '#f2ead8', dim: '#8a93ad', wood: '#6b4a2b'
  };
  var SANS = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif';
  var SERIF = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif SC","STSong","SimSun",serif';
  var activeBtn = null;       // 当前按下的按钮（用于按下态）
  var seigaihaPat = null;     // 青海波底纹（懒加载）

  // ---------- 银魂角色立绘（assets/board/tier1..12.png；加载失败自动回落代码绘制） ----------
  var CHARACTER_NAMES = ['坂田银时', '志村新八', '神乐', '定春', '近藤勋', '土方十四郎',
                         '冲田总悟', '桂小太郎', '伊丽莎白', '高杉晋助', '神威', '虚（吉田松阳）'];
  var sprites = [];                 // sprites[t-1] = tierN.png 的 Image 对象
  (function preloadSprites() {
    for (var t = 1; t <= 12; t++) {
      var im = new Image();
      im.src = 'assets/board/tier' + t + '.png';
      sprites.push(im);
    }
  })();
  function spriteOK(t) {
    var im = sprites[t - 1];
    return !!(im && im.complete && im.naturalWidth > 0);
  }
  // 关卡 → 角色映射：小怪用 tier2..9 循环（随关卡+波次变化）；Boss 按阶段 高杉(10)→神威(11)→虚(12)
  function mobTier() { return ((curLevel - 1 + wave) % 8) + 2; }
  function bossTier(lv) {
    if (!lv) lv = curLevel;
    return lv <= 4 ? 10 : (lv <= 8 ? 11 : 12);
  }
  function charName(t) { return CHARACTER_NAMES[t - 1] || '武士'; }
  // 以 (cx, bottomY) 为锚点绘制正方形立绘（底边对齐地面），flip=水平翻转
  function drawSprite(t, cx, bottomY, side, flip) {
    if (!spriteOK(t)) return false;
    var im = sprites[t - 1];
    ctx.save();
    ctx.translate(cx, bottomY);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -side / 2, -side, side, side);
    ctx.restore();
    return true;
  }

  // ---------- 布局 ----------
  var HUD_H = 72;
  var GY = 300;                 // 地面线（角色脚底）
  var ATK_DMG = 26;             // 平A 单次伤害
  var ATK_CD = 0.30;            // 平A 冷却（秒）
  var ATK_SWING = 0.18;         // 挥击动画时长
  var ATK_REACH = 54;           // 平A 前方 hitbox 长度
  var PLAYER_SPD = 156;         // 玩家移动速度 px/s
  var JUMP_V = 392;             // 起跳速度
  var GRAV = 940;               // 重力

  // ---------- 屏幕状态 ----------
  var screen = 'menu';          // menu | select | playing | win | lose
  var curLevel = 1;
  var unlocked = 1;
  var player = { x: 60, y: GY - 70, w: 42, h: 70, vy: 0, onGround: true, facing: 1,
                 hp: 120, maxhp: 120, cd: 0, swing: 0 };
  var levelCfg = null;
  var enemies = [];
  var boss = null;
  var phase = 'waves';         // waves | boss
  var wave = 0;
  var spawnLeft = 0;
  var spawnTimer = 0;
  var waveDelay = 0;
  var score = 0;
  var floats = [];
  var toast = null;
  var shake = 0;
  var lastReward = 0;
  var lastBreak = { clear: 0, boss: 0 };

  // ---------- 输入 ----------
  var input = { left: false, right: false, jump: false };
  var pointers = {};            // pointerId -> action

  // 屏幕内控制（横屏底部，全部位于地面线 GY=300 之下，避免遮挡角色）
  var BTN_LEFT  = { x: 12,  y: 316, w: 54, h: 54 };
  var BTN_RIGHT = { x: 72,  y: 316, w: 54, h: 54 };
  var BTN_JUMP  = { x: 132, y: 316, w: 54, h: 54 };
  var BTN_ATK   = { x: W - 78, y: 308, w: 64, h: 64 };
  var PLAY_MENU = { x: 14,  y: 14,  w: 70, h: 40 };

  var MENU_PLAY = { x: W / 2 - 110, y: 232, w: 220, h: 58 };
  var MENU_BACK = { x: W / 2 - 110, y: 304, w: 220, h: 50 };
  var SEL_BACK  = { x: W / 2 - 110, y: H - 54, w: 220, h: 46 };
  var WIN_NEXT  = { x: W / 2 - 234, y: 324, w: 150, h: 46 };
  var WIN_REPLAY= { x: W / 2 - 72,  y: 324, w: 150, h: 46 };
  var WIN_BACK  = { x: W / 2 + 90,  y: 324, w: 150, h: 46 };
  var WIN_REPLAY2 = { x: W / 2 - 160, y: 324, w: 150, h: 46 };
  var WIN_BACK2   = { x: W / 2 + 10,  y: 324, w: 150, h: 46 };
  var LOSE_RETRY= { x: W / 2 - 160, y: 300, w: 150, h: 46 };
  var LOSE_BACK = { x: W / 2 + 10,  y: 300, w: 150, h: 46 };

  function levelBtnRect(i) {
    // 横屏 6 列 × 2 行，金边卡片
    var cols = 6, cw = 92, ch = 84, gx = 110, gy = 120, gap = 10;
    var c = i % cols, r = Math.floor(i / cols);
    return { x: gx + c * (cw + gap), y: gy + r * (ch + gap), w: cw, h: ch };
  }

  // ---------- 关卡配置 ----------
  function config(lv) {
    return {
      waves: 3,
      mobsPerWave: 3 + Math.floor(lv / 2),
      mobHP: 18 + lv * 6,
      mobSpd: 36 + lv * 2,
      mobDPS: 6 + lv * 0.8,
      bossHP: 260 + lv * 70,
      bossSpd: 26 + lv,
      bossDPS: 12 + lv,
      bossAtkDmg: 22 + lv * 2,
      spawnInterval: Math.max(0.5, 1.05 - lv * 0.03)
    };
  }

  // 奖励公式：基础 100×关卡 + Boss 奖励 150×关卡
  function levelReward(lv) {
    var clear = 100 * lv;
    var bossBonus = 150 * lv;
    return { total: clear + bossBonus, clear: clear, bossBonus: bossBonus };
  }

  // ---------- 存档（金币写入共享 SAVE_KEY） ----------
  function readCoins() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return 0;
      var d = JSON.parse(raw);
      if (d && typeof d.coins === 'number' && isFinite(d.coins)) return d.coins;
      return 0;
    } catch (e) { return 0; }
  }

  function addCoins(amount) {
    // 仅读取主存档并累加 coins，完整保留其它字段（cells/fragments/codexDone/unlockedRows 等），避免覆盖主游戏进度
    var d = {};
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) d = parsed;
      }
    } catch (e) {}
    d.coins = (typeof d.coins === 'number' && isFinite(d.coins)) ? d.coins + amount : amount;
    if (typeof d.v !== 'number') d.v = 1;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) {}
  }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(PROGRESS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d.unlocked === 'number') unlocked = Math.max(1, Math.min(LEVELS, d.unlocked));
      }
    } catch (e) {}
  }
  function saveProgress() {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ unlocked: unlocked })); } catch (e) {}
  }

  // ---------- 关卡流程 ----------
  function startLevel(lv) {
    curLevel = lv;
    levelCfg = config(lv);
    player.x = 60; player.y = GY - player.h; player.vy = 0; player.onGround = true;
    player.hp = player.maxhp; player.cd = 0; player.swing = 0; player.facing = 1;
    enemies = []; boss = null; phase = 'waves'; wave = 0; score = 0; floats = []; shake = 0;
    startWave(0);
    screen = 'playing';
  }

  function startWave(w) {
    wave = w;
    spawnLeft = levelCfg.mobsPerWave + w;   // 后续波次略增
    spawnTimer = 0; waveDelay = 0;
  }

  function spawnMob(fromRight) {
    var dir = fromRight ? -1 : 1;
    var e = {
      x: fromRight ? W + 24 : -24 - 40,
      y: GY - 56, w: 40, h: 56,
      hp: levelCfg.mobHP, maxhp: levelCfg.mobHP,
      spd: levelCfg.mobSpd, dps: levelCfg.mobDPS,
      dir: dir, flash: 0
    };
    enemies.push(e);
  }

  function spawnBoss() {
    boss = {
      x: W - 100, y: GY - 112, w: 84, h: 112,
      hp: levelCfg.bossHP, maxhp: levelCfg.bossHP,
      spd: levelCfg.bossSpd, dps: levelCfg.bossDPS,
      atkDmg: levelCfg.bossAtkDmg,
      atkTimer: 2.0, windup: 0, windupMax: 0.6,
      dir: -1, flash: 0
    };
  }

  function winLevel() {
    if (screen !== 'playing') return;
    screen = 'win';
    var r = levelReward(curLevel);
    lastReward = r.total; lastBreak = { clear: r.clear, boss: r.bossBonus };
    addCoins(lastReward);
    if (curLevel >= unlocked) { unlocked = Math.min(LEVELS, curLevel + 1); saveProgress(); }
    toast = { text: '金币 +' + lastReward, t: 2.4 };
  }

  function doJump() {
    if (player.onGround) { player.vy = -JUMP_V; player.onGround = false; }
  }

  function tryAttack() {
    if (screen !== 'playing') return;
    if (player.cd > 0) return;
    player.cd = ATK_CD;
    player.swing = ATK_SWING;
    var hbx = player.facing > 0 ? player.x + player.w : player.x - ATK_REACH;
    var hby = player.y - 10, hbh = player.h + 12;
    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      if (aabbRect(hbx, hby, ATK_REACH, hbh, e.x, e.y, e.w, e.h)) {
        e.hp -= ATK_DMG; e.flash = 0.12;
        if (e.hp <= 0) killMob(i);
      }
    }
    if (boss && aabbRect(hbx, hby, ATK_REACH, hbh, boss.x, boss.y, boss.w, boss.h)) {
      boss.hp -= ATK_DMG; boss.flash = 0.12; shake = Math.max(shake, 0.25);
    }
  }

  function killMob(i) {
    var e = enemies[i];
    enemies.splice(i, 1);
    score += 10;
    floats.push({ x: e.x + e.w / 2, y: e.y, t: 0, dur: 0.9, text: '+10' });
  }

  function aabbRect(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function aabb(a, b) { return aabbRect(a.x, a.y, a.w, a.h, b.x, b.y, b.w, b.h); }

  // ---------- 更新 ----------
  function update(dt) {
    if (screen !== 'playing') return;

    if (player.cd > 0) player.cd = Math.max(0, player.cd - dt);
    if (player.swing > 0) player.swing = Math.max(0, player.swing - dt);

    // 移动
    var mv = 0;
    if (input.left) mv -= 1;
    if (input.right) mv += 1;
    if (mv !== 0) { player.x += mv * PLAYER_SPD * dt; player.facing = mv; }
    if (player.x < 16) player.x = 16;
    if (player.x > W - player.w - 16) player.x = W - player.w - 16;

    // 跳
    if (!player.onGround) {
      player.vy += GRAV * dt;
      player.y += player.vy * dt;
      if (player.y >= GY - player.h) { player.y = GY - player.h; player.vy = 0; player.onGround = true; }
    }

    // 波次 / Boss 生成
    if (phase === 'waves') {
      if (waveDelay > 0) {
        waveDelay -= dt;
      } else if (spawnLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnTimer = levelCfg.spawnInterval;
          spawnMob(Math.random() < 0.72);
          spawnLeft--;
        }
      } else if (enemies.length === 0) {
        if (wave < levelCfg.waves - 1) {
          wave++;
          startWave(wave);
          player.hp = Math.min(player.maxhp, player.hp + 18);
          toast = { text: '第 ' + (wave + 1) + ' 波来袭！', t: 1.4 };
        } else {
          spawnBoss(); phase = 'boss';
          toast = { text: '⚔ ' + charName(bossTier()) + ' 出现！', t: 1.8 };
        }
      }
    }

    // 敌人更新
    for (var i = 0; i < enemies.length; i++) updateMob(enemies[i], dt);

    // Boss 更新
    if (phase === 'boss' && boss) {
      updateBoss(dt);
      if (boss.hp <= 0) { boss = null; winLevel(); }
    }

    // 玩家阵亡（仅在仍处于战斗中时判定，避免与同帧胜利冲突）
    if (screen === 'playing' && player.hp <= 0) { player.hp = 0; screen = 'lose'; }

    if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    for (var f = floats.length - 1; f >= 0; f--) {
      floats[f].t += dt;
      if (floats[f].t >= floats[f].dur) floats.splice(f, 1);
    }
  }

  function updateMob(e, dt) {
    var px = player.x + player.w / 2, ex = e.x + e.w / 2;
    var dir = px < ex ? -1 : 1;
    e.dir = dir;                    // 同步朝向（供立绘翻转使用）
    e.x += dir * e.spd * dt;
    if (aabb(e, player)) {
      if (dir < 0) e.x = player.x + player.w - 2; else e.x = player.x - e.w - 2;
      player.hp -= e.dps * dt;
      shake = Math.max(shake, 0.12);
    }
    if (e.flash > 0) e.flash -= dt;
  }

  function updateBoss(dt) {
    var b = boss;
    var px = player.x + player.w / 2, bx = b.x + b.w / 2;
    var dir = px < bx ? -1 : 1;
    b.dir = dir;
    if (Math.abs(px - bx) > b.w / 2 + player.w / 2 - 2) b.x += dir * b.spd * dt;
    if (aabb(b, player)) player.hp -= b.dps * dt;
    b.atkTimer -= dt;
    if (b.windup > 0) {
      b.windup -= dt;
      if (b.windup <= 0) {
        var range = b.w / 2 + player.w / 2 + 30;
        if (Math.abs(px - bx) <= range) { player.hp -= b.atkDmg; shake = 0.7;
          floats.push({ x: player.x + player.w / 2, y: player.y, t: 0, dur: 1.0, text: '-' + Math.round(b.atkDmg) }); }
        b.atkTimer = 2.2;
      }
    } else if (b.atkTimer <= 0) {
      if (Math.abs(px - bx) < b.w / 2 + player.w / 2 + 64) b.windup = b.windupMax;
      else b.atkTimer = 0.5;
    }
    if (b.flash > 0) b.flash -= dt;
  }

  // ---------- 绘制工具 ----------
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  var safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;' +
    'padding:env(safe-area-inset-top) env(safe-area-inset-right) ' +
    'env(safe-area-inset-bottom) env(safe-area-inset-left);';
  document.documentElement.appendChild(safeProbe);
  function readSafeArea() {
    try {
      var cs = getComputedStyle(safeProbe);
      return {
        top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0
      };
    } catch (e) { return { top: 0, right: 0, bottom: 0, left: 0 }; }
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vw = window.innerWidth, vh = window.innerHeight;
    cv.width = Math.round(vw * dpr);
    cv.height = Math.round(vh * dpr);
    cv.style.width = vw + 'px';
    cv.style.height = vh + 'px';
    var sa = readSafeArea();
    var availW = Math.max(1, vw - sa.left - sa.right);
    var availH = Math.max(1, vh - sa.top - sa.bottom);
    // 横屏稳健缩放：scale = min(availW/W, availH/H)，居中，黑边由 body(#000) 充当 letterbox
    var scale = Math.min(availW / W, availH / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    view.scale = scale;
    view.ox = sa.left + (availW - W * scale) / 2;
    view.oy = sa.top + (availH - H * scale) / 2;
    view.dpr = dpr;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * view.ox, dpr * view.oy);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  function toLogic(ev) {
    var r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left - view.ox) / view.scale, y: (ev.clientY - r.top - view.oy) / view.scale };
  }
  function hitRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
  function hitButton(p, b, minPx) {
    minPx = minPx || 0;
    var hw = Math.max(b.w, minPx / view.scale), hh = Math.max(b.h, minPx / view.scale);
    return Math.abs(p.x - (b.x + b.w / 2)) <= hw / 2 && Math.abs(p.y - (b.y + b.h / 2)) <= hh / 2;
  }

  function rr(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return false;
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    return true;
  }
  function fillRR(x, y, w, h, r, color) { if (!rr(x, y, w, h, r)) return; ctx.fillStyle = color; ctx.fill(); }
  function strokeRR(x, y, w, h, r, color, lw) { if (!rr(x, y, w, h, r)) return; ctx.strokeStyle = color; ctx.lineWidth = lw || 2; ctx.stroke(); }
  function text(str, x, y, size, color, align, weight, family) {
    ctx.font = (weight || '600') + ' ' + size + 'px ' + (family || SANS);
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function serifText(str, x, y, size, color, align, weight) {
    text(str, x, y, size, color, align, weight, SERIF);
  }
  // 等宽数字（tabular-nums 效果），用于分数 / 金币等数值
  function monoText(str, x, y, size, color, align, weight) {
    ctx.font = (weight || '700') + ' ' + size + 'px "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace';
    ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function shade(hex, k) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
    if (k >= 0) { r = Math.round(r + (255 - r) * k); g = Math.round(g + (255 - g) * k); b = Math.round(b + (255 - b) * k); }
    else { r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k)); }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function drawBar(x, y, w, h, ratio, color) {
    ratio = Math.max(0, Math.min(1, ratio));
    fillRR(x, y, w, h, h / 2, 'rgba(11,14,20,0.85)');           // 深色底背
    var fw = w * ratio;
    if (fw > 0) {
      var g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, shade(color, 0.28)); g.addColorStop(1, color);
      ctx.save();
      if (rr(x, y, fw, h, h / 2)) { ctx.clip(); ctx.fillStyle = g; ctx.fillRect(x, y, fw, h); }
      ctx.restore();
    }
    strokeRR(x, y, w, h, h / 2, 'rgba(232,193,90,0.5)', 1.5);   // 金色细描边
  }
  // 标题/菜单/结算按钮：金色渐变 + 2px 深色 cel 描边 + 按下态
  function drawButton(b, label, opts) {
    opts = opts || {};
    var ghost = !!opts.ghost;          // 次按钮：深色面板 + 金边
    var serif = !!opts.serif;
    var pressed = (b === activeBtn);
    var r = opts.r || 14;
    var x = b.x, y = b.y + (pressed ? 2 : 0), w = b.w, h = b.h;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = pressed ? 3 : 10;
    ctx.shadowOffsetY = pressed ? 1 : 5;
    if (ghost) {
      var gp = ctx.createLinearGradient(0, y, 0, y + h);
      gp.addColorStop(0, '#1b2435'); gp.addColorStop(1, '#10161f');
      if (rr(x, y, w, h, r)) { ctx.fillStyle = gp; ctx.fill(); }
    } else {
      var g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, '#ffe88a'); g.addColorStop(0.5, PAL.gold); g.addColorStop(1, '#c2912f');
      if (rr(x, y, w, h, r)) { ctx.fillStyle = g; ctx.fill(); }
    }
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    strokeRR(x, y, w, h, r, ghost ? PAL.gold : '#5a3d1e', 2);   // 深色 cel 描边
    if (!pressed) {                                               // 顶部高光
      ctx.save();
      if (rr(x + 2, y + 2, w - 4, h * 0.5, Math.max(1, r - 2))) { ctx.clip();
        var hl = ctx.createLinearGradient(0, y, 0, y + h * 0.55);
        hl.addColorStop(0, 'rgba(255,255,255,0.40)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl; ctx.fillRect(x, y, w, h);
      }
      ctx.restore();
    }
    var tc = ghost ? PAL.paper : '#3a2a0a';
    text(label, x + w / 2, y + h / 2 + (pressed ? 1 : -1), opts.size || 17, tc, 'center', '800', serif ? SERIF : SANS);
    ctx.restore();
  }
  // 屏内操作键：深色玻璃垫 + 金边 + 彩色图标 + 按下态
  function drawControl(b, label, accent) {
    var pressed = (b === activeBtn);
    var x = b.x, y = b.y + (pressed ? 2 : 0), w = b.w, h = b.h, r = 16;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = pressed ? 3 : 9; ctx.shadowOffsetY = pressed ? 1 : 4;
    var g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(34,46,66,0.92)'); g.addColorStop(1, 'rgba(11,14,20,0.96)');
    if (rr(x, y, w, h, r)) { ctx.fillStyle = g; ctx.fill(); }
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    strokeRR(x, y, w, h, r, pressed ? accent : 'rgba(232,193,90,0.7)', 2);
    if (!pressed) {
      ctx.save();
      if (rr(x + 2, y + 2, w - 4, h * 0.45, r - 2)) { ctx.clip();
        var hl = ctx.createLinearGradient(0, y, 0, y + h * 0.5);
        hl.addColorStop(0, 'rgba(255,255,255,0.16)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hl; ctx.fillRect(x, y, w, h);
      }
      ctx.restore();
    }
    text(label, x + w / 2, y + h / 2 + (pressed ? 1 : 0), 17, accent, 'center', '800', SANS);
    ctx.restore();
  }

  // ---------- 背景 ----------
  // 青海波底纹 tile（金线同心扇，约 7% 不透明度铺在动作画面之后，不干扰精灵可读性）
  function buildSeigaiha() {
    var r = 22;
    var tile = document.createElement('canvas');
    tile.width = r * 2; tile.height = r;
    var c = tile.getContext('2d');
    c.strokeStyle = 'rgba(232,193,90,0.9)'; c.lineWidth = 2;
    function fan(cx, cy) {
      for (var k = 1; k <= 4; k++) {
        c.beginPath(); c.arc(cx, cy, r * k / 4, Math.PI, 2 * Math.PI); c.stroke();  // 上半扇
      }
    }
    fan(0, r); fan(r, r); fan(r * 2, r);
    try { return ctx.createPattern(tile, 'repeat'); } catch (e) { return null; }
  }
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#11161f'); g.addColorStop(0.55, PAL.bg); g.addColorStop(1, '#070a10');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (!seigaihaPat) seigaihaPat = buildSeigaiha();
    if (seigaihaPat) {
      ctx.save();
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = seigaihaPat;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    var rg = ctx.createRadialGradient(W / 2, 30, 10, W / 2, 30, W * 0.6);
    rg.addColorStop(0, 'rgba(232,193,90,0.10)'); rg.addColorStop(1, 'rgba(232,193,90,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H * 0.6);
  }

  function drawGround() {
    fillRR(0, GY, W, H - GY, 0, 'rgba(20,27,40,0.55)');
    strokeRR(0, GY, W, H - GY, 0, 'rgba(232,193,90,0.28)', 2);     // 金色地平线
    ctx.strokeStyle = 'rgba(232,193,90,0.06)'; ctx.lineWidth = 1;   // 透视装饰线
    for (var i = 0; i < 10; i++) {
      var x = 20 + i * 80;
      ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x - 30, H); ctx.stroke();
    }
  }

  // ---------- 角色绘制（银魂立绘优先，资源缺失回落代码绘制） ----------
  function drawPlayer() {
    var p = player;
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, GY + 2, p.w / 2 + 6, 6, 0, 0, Math.PI * 2); ctx.fill();
    if (spriteOK(1)) {
      var side = p.h * 1.3;                       // 立绘稍大于碰撞盒，更有存在感
      drawSprite(1, p.x + p.w / 2, p.y + p.h, side, p.facing < 0);
      text('坂田银时', p.x + p.w / 2, p.y + p.h - side - 9, 10, '#f7d774', 'center', '700');
    } else {
      var g = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
      g.addColorStop(0, '#ffe9a8'); g.addColorStop(1, '#f1c40f');
      fillRR(p.x, p.y, p.w, p.h, 14, g);
      strokeRR(p.x, p.y, p.w, p.h, 14, '#caa472', 2);
      // 头
      ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y - 10, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#f7d774'; ctx.fill();
      strokeRR(p.x + p.w / 2 - 14, p.y - 24, 28, 28, 14, '#caa472', 2);
      // 木刀
      var dir = p.facing;
      ctx.strokeStyle = '#caa472'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x + p.w / 2, p.y + 12);
      ctx.lineTo(p.x + p.w / 2 + dir * 48, p.y - 18);
      ctx.stroke();
    }
    // 挥击高亮
    if (p.swing > 0) {
      ctx.fillStyle = 'rgba(247,215,116,0.22)';
      var hbx = p.facing > 0 ? p.x + p.w : p.x - ATK_REACH;
      ctx.fillRect(hbx, p.y - 10, ATK_REACH, p.h + 12);
    }
  }

  function drawMob(e) {
    var t = e.tier || mobTier();
    var side = e.h * 1.25;
    var sx = e.x + e.w / 2 - side / 2, sy = e.y + e.h - side;
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(e.x + e.w / 2, GY + 2, e.w / 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    if (spriteOK(t)) {
      drawSprite(t, e.x + e.w / 2, e.y + e.h, side, e.dir < 0);
      if (e.flash > 0) { ctx.globalAlpha = 0.6; fillRR(sx, sy, side, side, 12, '#ffffff'); ctx.globalAlpha = 1; }
      text(charName(t), e.x + e.w / 2, e.y - 34, 9, '#ffb3a7', 'center', '600');
    } else {
      var g = ctx.createLinearGradient(e.x, e.y, e.x, e.y + e.h);
      g.addColorStop(0, '#ff7a6b'); g.addColorStop(1, '#e74c3c');
      fillRR(e.x, e.y, e.w, e.h, 12, e.flash > 0 ? '#ffffff' : g);
      strokeRR(e.x, e.y, e.w, e.h, 12, '#a93226', 2);
      ctx.beginPath(); ctx.arc(e.x + e.w / 2, e.y - 8, 11, 0, Math.PI * 2);
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : '#e74c3c'; ctx.fill();
    }
    drawBar(e.x, e.y - 18, e.w, 5, e.hp / e.maxhp, '#e74c3c');
  }

  function drawBoss() {
    var b = boss;
    var t = bossTier();
    var side = b.h * 1.25;
    var sx = b.x + b.w / 2 - side / 2, sy = b.y + b.h - side;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, GY + 2, b.w / 2 + 6, 8, 0, 0, Math.PI * 2); ctx.fill();
    if (spriteOK(t)) {
      drawSprite(t, b.x + b.w / 2, b.y + b.h, side, b.dir < 0);
      if (b.flash > 0) { ctx.globalAlpha = 0.6; fillRR(sx, sy, side, side, 14, '#ffffff'); ctx.globalAlpha = 1; }
      // 名牌
      fillRR(b.x + b.w / 2 - 64, sy - 30, 128, 18, 9, 'rgba(20,20,32,0.85)');
      strokeRR(b.x + b.w / 2 - 64, sy - 30, 128, 18, 9, 'rgba(243,196,15,0.6)', 1);
      text('BOSS · ' + charName(t), b.x + b.w / 2, sy - 21, 11, '#f7d774', 'center', '800');
      drawBar(b.x, sy - 44, b.w, 7, b.hp / b.maxhp, '#f7d774');
    } else {
      var g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      g.addColorStop(0, '#b976c9'); g.addColorStop(1, '#8e44ad');
      fillRR(b.x, b.y, b.w, b.h, 16, b.flash > 0 ? '#ffffff' : g);
      strokeRR(b.x, b.y, b.w, b.h, 16, '#f7d774', 3);
      ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y - 14, 18, 0, Math.PI * 2);
      ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#8e44ad'; ctx.fill();
      strokeRR(b.x + b.w / 2 - 18, b.y - 32, 36, 36, 18, '#f7d774', 2);
      drawBar(b.x, b.y - 28, b.w, 7, b.hp / b.maxhp, '#f7d774');
    }
    // 蓄力预警
    if (b.windup > 0) {
      var range = b.w / 2 + player.w / 2 + 30;
      ctx.fillStyle = 'rgba(231,76,60,0.28)';
      var zx = b.dir > 0 ? b.x : b.x - range;
      ctx.fillRect(zx, b.y - 6, range, b.h + 12);
    }
  }

  // ---------- 屏幕 ----------
  function drawTopCoins() {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    fillRR(0, 0, W, HUD_H, 0, PAL.panel);
    ctx.restore();
    strokeRR(0, HUD_H - 1, W, 1, 0, PAL.line, 1);                  // 金色细分隔线
    // 金币（金质圆盘 + 暗芯）
    ctx.save(); ctx.shadowColor = PAL.gold; ctx.shadowBlur = 8;
    var cg = ctx.createLinearGradient(20, 16, 40, 38);
    cg.addColorStop(0, '#ffe88a'); cg.addColorStop(1, '#c2912f');
    ctx.beginPath(); ctx.arc(30, 27, 11, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(30, 27, 7, 0, Math.PI * 2); ctx.fillStyle = '#8a6a1f'; ctx.fill();
    text('金币', 48, 17, 12, PAL.dim, 'left', '600');
    monoText(String(readCoins()), 48, 40, 22, PAL.gold2, 'left', '800');

  function drawLevelBadge() {

  function drawFloats() {
    for (var i = 0; i < floats.length; i++) {
      var f = floats[i], pp = f.t / f.dur;
      ctx.globalAlpha = 1 - pp;
      text(f.text, f.x, f.y - 8 - pp * 30, 15, '#ffe58a', 'center', '800');

  function drawPlaying() {
    drawBackground();
    drawGround();
    for (var i = 0; i < enemies.length; i++) drawMob(enemies[i]);
    if (boss) drawBoss();
    drawPlayer();
    drawFloats();
    drawHUD();
    drawControls();
    if (toast) {
      ctx.globalAlpha = Math.min(1, toast.t * 2);
      var tw = 280, th = 36, tx = (W - tw) / 2, ty = HUD_H + 14;
      fillRR(tx, ty, tw, th, 18, 'rgba(20,20,32,0.92)');
      strokeRR(tx, ty, tw, th, 18, 'rgba(243,196,15,0.4)', 1);
      text(toast.text, W / 2, ty + th / 2, 13, '#ffe58a', 'center', '600');
      ctx.globalAlpha = 1;
    }

  // 红色印章（败）点缀
  function drawSeal(cx, cy, s) {
    var x = cx - s / 2, y = cy - s / 2;

    strokeRR(x, y, s, s, 6, PAL.gold2, 1.5);

  function drawLose() {

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) {
      var s = shake * 4;
      ctx.translate((Math.random() * 2 - 1) * s, (Math.random() * 2 - 1) * s);
    }
    if (screen === 'menu') drawMenu();
    else if (screen === 'select') drawSelect();
    else if (screen === 'playing') drawPlaying();
    else if (screen === 'win') { drawPlaying(); drawWin(); }
    else if (screen === 'lose') { drawPlaying(); drawLose(); }
    ctx.restore();
  }

  // ---------- 输入处理 ----------
  function handlePlayDown(p, id) {
    if (hitButton(p, PLAY_MENU, 40)) { activeBtn = PLAY_MENU; screen = 'menu'; return; }
    if (hitButton(p, BTN_LEFT, 44)) { input.left = true; pointers[id] = 'left'; activeBtn = BTN_LEFT; return; }
    if (hitButton(p, BTN_RIGHT, 44)) { input.right = true; pointers[id] = 'right'; activeBtn = BTN_RIGHT; return; }
    if (hitButton(p, BTN_JUMP, 44)) { input.jump = true; pointers[id] = 'jump'; activeBtn = BTN_JUMP; doJump(); return; }
    if (hitButton(p, BTN_ATK, 44)) { tryAttack(); pointers[id] = 'atk'; activeBtn = BTN_ATK; return; }
    tryAttack();   // 点击战场任意处 = 平A
  }

  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
    var p = toLogic(ev);
    if (screen === 'menu') {
      if (hitButton(p, MENU_PLAY, 44)) { activeBtn = MENU_PLAY; screen = 'select'; }
      else if (hitButton(p, MENU_BACK, 44)) { location.href = 'home.html'; }
      return;
    }
    if (screen === 'select') {
      if (hitButton(p, SEL_BACK, 44)) { location.href = 'home.html'; return; }
      for (var i = 0; i < LEVELS; i++) {
        if (lv_unlocked(i + 1) && hitButton(p, levelBtnRect(i), 40)) { activeBtn = levelBtnRect(i); startLevel(i + 1); return; }
      }
      return;
    }
    if (screen === 'win') {
      if (curLevel < LEVELS && hitButton(p, WIN_NEXT, 44)) { activeBtn = WIN_NEXT; startLevel(curLevel + 1); return; }
      if (curLevel < LEVELS && hitButton(p, WIN_REPLAY, 44)) { activeBtn = WIN_REPLAY; startLevel(curLevel); return; }
      if (curLevel >= LEVELS && hitButton(p, WIN_REPLAY2, 44)) { activeBtn = WIN_REPLAY2; startLevel(curLevel); return; }
      if (curLevel < LEVELS && hitButton(p, WIN_BACK, 44)) { location.href = 'home.html'; return; }
      if (curLevel >= LEVELS && hitButton(p, WIN_BACK2, 44)) { location.href = 'home.html'; return; }
      return;
    }
    if (screen === 'lose') {
      if (hitButton(p, LOSE_RETRY, 44)) { activeBtn = LOSE_RETRY; startLevel(curLevel); return; }
      if (hitButton(p, LOSE_BACK, 44)) { location.href = 'home.html'; return; }
      return;
    }
    if (screen === 'playing') handlePlayDown(p, ev.pointerId);
  });

  cv.addEventListener('pointermove', function (ev) { ev.preventDefault(); });

  function clearPointer(id) {
    var a = pointers[id];
    if (a === 'left') input.left = false;
    else if (a === 'right') input.right = false;
    else if (a === 'jump') input.jump = false;
    delete pointers[id];
  }
  cv.addEventListener('pointerup', function (ev) { ev.preventDefault(); activeBtn = null; clearPointer(ev.pointerId); });
  cv.addEventListener('pointercancel', function (ev) { activeBtn = null; clearPointer(ev.pointerId); });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { input.jump = true; doJump(); }
    else if (k === ' ' || k === 'Spacebar') { if (!e.repeat) tryAttack(); e.preventDefault(); }
    else if (k === 'j' || k === 'J') { if (!e.repeat) tryAttack(); }
    else if (k === 'Escape') { if (screen === 'playing') screen = 'menu'; }
  });
  window.addEventListener('keyup', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') input.jump = false;
  });

  function lv_unlocked(lv) { return lv <= unlocked; }

  // ---------- 主循环 ----------
  var last = 0;
  function loop(ts) {
    var now = ts / 1000;
    var dt = last ? Math.min(0.05, now - last) : 0;
    last = now;
    update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  function boot() {
    resize();
    loadProgress();
    window.__actionReady = true;
    requestAnimationFrame(loop);
  }

  // 自测钩子
  window.__action = {
    startLevel: startLevel, addCoins: addCoins, readCoins: readCoins,
    saveKey: SAVE_KEY, levels: LEVELS, reward: levelReward,
    getScreen: function () { return screen; },
    getUnlocked: function () { return unlocked; },
    player: function () { return player; },
    enemies: function () { return enemies.length; },
    boss: function () { return boss ? boss.hp : null; },
    tryAttack: tryAttack
  };

  boot();
})();
</script>
</body>
</html>
