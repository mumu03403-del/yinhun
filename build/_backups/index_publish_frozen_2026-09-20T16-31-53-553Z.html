<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b12">
<title>合并武士 · 放置图鉴（占位美术原型）</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05050a; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
(function () {
  "use strict";

  /* =========================================================================
   * 合并武士 · 放置图鉴 —— 浏览器直玩版（H5 兜底实现）
   * 与 Cocos 原型 assets/src/data/GameConfig.ts 的数值完全一致。
   * 美术 100% 为代码绘制的纯色块，不含任何图片素材 / 版权角色形象。
   * ========================================================================= */

  // ---------- 1. 配置（与 GameConfig.ts 一一对应） ----------
  var GRID_COLS = 5;
  var GRID_ROWS = 4;
  var MAX_TIER = 6;
  var TIER_COLORS = ['#7f8c8d', '#3498db', '#2ecc71', '#f1c40f', '#e67e22', '#e74c3c'];
  var COIN_RATE = [1, 3, 9, 27, 81, 243];
  var CHARACTER_NAMES = [
    '见习武士 #1', '街头浪人 #2', '天然卷剑客 #3',
    '甜党使者 #4', '攘夷志士 #5', '传说将军 #6'
  ];
  var INITIAL_UNITS = 6;

  // 离线收益：8 小时封顶，50% 效率
  var OFFLINE_CAP_SEC = 8 * 3600;
  var OFFLINE_EFFICIENCY = 0.5;
  var SAVE_KEY = 'merge_samurai_save_v1';

  // 满级结算：长按满级单位 ≥ LONG_PRESS_MS 毫秒 → 兑换为金币并释放该格
  // 兑换值 = 该档 SETTLE_SECONDS 秒的产出
  var LONG_PRESS_MS = 500;
  var SETTLE_SECONDS = 30;
  var TEXT_DARK = '#141414';
  var TEXT_LIGHT = '#ffffff';

  // ---------- 2. 逻辑分辨率与布局 ----------
  var W = 375;
  var H = 812;

  var HUD_H = 74;
  var GAP = 8;
  var CELL = 62;
  var GRID_W = GRID_COLS * CELL + (GRID_COLS - 1) * GAP;   // 342
  var GRID_H = GRID_ROWS * CELL + (GRID_ROWS - 1) * GAP;   // 272
  var GRID_X = (W - GRID_W) / 2;                            // 16.5
  var GRID_Y = 132;                                         // 网格顶部 y

  function cellCenterX(c) { return GRID_X + c * (CELL + GAP) + CELL / 2; }
  function cellCenterY(r) { return GRID_Y + r * (CELL + GAP) + CELL / 2; }

  var SPAWN_BTN = { x: W / 2 - 82, y: GRID_Y + GRID_H + 18, w: 164, h: 56 };
  var COLL_BTN = { x: W - 16 - 74, y: 14, w: 74, h: 46 };

  var LEGEND_TOP = SPAWN_BTN.y + SPAWN_BTN.h + 22;
  var RESET_BTN = { x: W / 2 - 62, y: H - 62, w: 124, h: 38 };

  // ---------- 3. 状态 ----------
  var state = {
    cells: new Array(GRID_COLS * GRID_ROWS).fill(0),
    coins: 0,
    highestTier: 1,
    merges: 0,
    spawns: 0,
    settles: 0
  };

  var selected = -1;              // 点选选中的格子索引
  var anim = [];                  // 每格动画 { t, dur, kind }
  for (var ai = 0; ai < GRID_COLS * GRID_ROWS; ai++) anim.push({ t: 1, dur: 1, kind: null });

  var drag = null;                // { from, x, y, active }
  var floats = [];                // 飘字
  var toast = null;               // 顶部提示 { text, t }
  var modal = null;               // { title, amount, t }
  var collectionOpen = false;
  var lastFrame = 0;
  var saveTimer = 0;
  var bgPulse = 0;
  var press = { i: -1, t: 0, timer: null };   // 满级单位长按状态

  // ---------- 4. 存档 ----------
  var suppressSave = false;   // 重置存档时置位，避免旧状态被自动存档回写

  function save() {
    if (suppressSave) return false;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1,
        cells: state.cells,
        coins: state.coins,
        highestTier: state.highestTier,
        merges: state.merges,
        spawns: state.spawns,
        settles: state.settles,
        time: Date.now()
      }));
      return true;
    } catch (e) { return false; }
  }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return; }
    if (!raw) return;
    var d = null;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !d.cells || d.cells.length !== state.cells.length) return;

    for (var i = 0; i < d.cells.length; i++) {
      var t = Number(d.cells[i]) || 0;
      state.cells[i] = Math.max(0, Math.min(MAX_TIER, Math.floor(t)));
    }
    state.coins = Number(d.coins) || 0;
    state.highestTier = Math.max(1, Number(d.highestTier) || 1);
    state.merges = Number(d.merges) || 0;
    state.spawns = Number(d.spawns) || 0;
    state.settles = Number(d.settles) || 0;

    // 离线收益
    var elapsed = Math.max(0, (Date.now() - (Number(d.time) || Date.now())) / 1000);
    if (elapsed > 60) {
      var rate = coinsPerSecond();
      var eff = Math.min(elapsed, OFFLINE_CAP_SEC);
      var gain = Math.floor(rate * eff * OFFLINE_EFFICIENCY);
      if (gain > 0) {
        state.coins += gain;
        modal = { title: '离线收益已到账', amount: gain, seconds: eff, rate: rate };
      }
    }
  }

  function resetAll() {
    suppressSave = true;      // 先关掉自动存档，再清档，防止被回写
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  }

  // ---------- 5. 玩法逻辑 ----------
  function idx(r, c) { return r * GRID_COLS + c; }
  function tierAt(i) { return state.cells[i]; }

  function coinsPerSecond() {
    var sum = 0;
    for (var i = 0; i < state.cells.length; i++) {
      var t = state.cells[i];
      if (t > 0) sum += COIN_RATE[t - 1];
    }
    return sum;
  }

  function spawnTier1() {
    var empties = [];
    for (var i = 0; i < state.cells.length; i++) if (state.cells[i] === 0) empties.push(i);
    if (empties.length === 0) {
      // 满盘时给出真正可行的解法：先长按结算满级单位腾位
      toast = {
        text: hasMaxTierUnit()
          ? '格子已满：长按满级单位结算可腾出空位'
          : '格子已满，先合并腾出空位',
        t: 2.0
      };
      return false;
    }
    var pick = empties[Math.floor(Math.random() * empties.length)];
    state.cells[pick] = 1;
    state.spawns++;
    anim[pick] = { t: 0, dur: 0.32, kind: 'spawn' };
    return true;
  }

  function doMerge(from, to) {
    if (from === to) return false;
    var tf = state.cells[from];
    var tt = state.cells[to];
    if (tf <= 0 || tt <= 0) return false;
    if (tf !== tt) return false;
    if (tt >= MAX_TIER) {
      toast = { text: '已是最高档（' + MAX_TIER + ' 档）：长按可结算金币', t: 2.0 };
      return false;
    }
    state.cells[to] = tt + 1;
    state.cells[from] = 0;
    state.merges++;
    anim[to] = { t: 0, dur: 0.42, kind: 'merge' };
    anim[from] = { t: 0, dur: 0.2, kind: 'clear' };
    if (state.cells[to] > state.highestTier) state.highestTier = state.cells[to];

    var cx = cellCenterX(to % GRID_COLS), cy = cellCenterY(Math.floor(to / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.0, text: '合体 → ' + state.cells[to] + '档' });
    bgPulse = 0.35;
    return true;
  }

  // 点选式交互（与 Cocos 原型一致的“选中两个同档单位合并”）
  function handleTap(i) {
    if (state.cells[i] === 0) { selected = -1; return; }
    if (selected < 0) { selected = i; return; }
    if (selected === i) { selected = -1; return; }
    if (doMerge(selected, i)) { selected = -1; return; }
    // 不同档 / 满级 → 切换选择
    selected = i;
  }

  /**
   * 满级结算：把满级单位兑换成金币并释放格子。
   * 解决「棋盘被满级单位填满后永久卡死」的问题。
   * 兑换值 = 该档 SETTLE_SECONDS 秒的产出。
   */
  function settleValue(tier) { return SETTLE_SECONDS * COIN_RATE[tier - 1]; }

  function doSettle(i) {
    var tier = state.cells[i];
    if (tier !== MAX_TIER) return false;
    var gain = settleValue(tier);

    state.cells[i] = 0;
    state.coins += gain;
    state.settles++;
    selected = -1;
    anim[i] = { t: 0, dur: 0.25, kind: 'clear' };

    var cx = cellCenterX(i % GRID_COLS), cy = cellCenterY(Math.floor(i / GRID_COLS));
    floats.push({ x: cx, y: cy, t: 0, dur: 1.2, text: '+' + fmt(gain) + ' 结算' });
    toast = { text: tier + ' 档结算 +' + fmt(gain) + ' 金币（' + SETTLE_SECONDS + ' 秒产出）', t: 2.2 };
    bgPulse = 0.3;
    return true;
  }

  function canSettle(i) { return i >= 0 && state.cells[i] === MAX_TIER; }

  function startPress(i) {
    cancelPress();
    if (!canSettle(i)) return;
    press.i = i;
    press.t = 0;
    press.timer = setTimeout(function () {
      press.timer = null;
      var idxPressed = press.i;
      press.i = -1;
      press.t = 0;
      if (doSettle(idxPressed)) {
        pointer.settled = true;   // 压住本次 pointerup，避免再被当成点选
      }
    }, LONG_PRESS_MS);
  }

  function cancelPress() {
    if (press.timer) { clearTimeout(press.timer); press.timer = null; }
    press.i = -1;
    press.t = 0;
  }

  // ---------- 6. 输入 ----------
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var view = { scale: 1, ox: 0, oy: 0, dpr: 1 };

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var vw = window.innerWidth, vh = window.innerHeight;
    cv.width = Math.round(vw * dpr);
    cv.height = Math.round(vh * dpr);
    cv.style.width = vw + 'px';
    cv.style.height = vh + 'px';
    var pad = 12;
    var scale = Math.min((vw - pad * 2) / W, (vh - pad * 2) / H);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    view.scale = scale;
    view.ox = (vw - W * scale) / 2;
    view.oy = (vh - H * scale) / 2;
    view.dpr = dpr;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * view.ox, dpr * view.oy);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  function toLogic(ev) {
    var r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left - view.ox) / view.scale,
      y: (ev.clientY - r.top - view.oy) / view.scale
    };
  }

  function hitCell(p) {
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var cx = cellCenterX(c), cy = cellCenterY(r);
        if (p.x >= cx - CELL / 2 && p.x <= cx + CELL / 2 &&
            p.y >= cy - CELL / 2 && p.y <= cy + CELL / 2) return idx(r, c);
      }
    }
    return -1;
  }

  function hitRect(p, b) {
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }

  var pointer = { down: false, startX: 0, startY: 0, moved: false, cell: -1, settled: false };

  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (cv.setPointerCapture) { try { cv.setPointerCapture(ev.pointerId); } catch (e) {} }
    var p = toLogic(ev);
    cancelPress();
    pointer.down = true;
    pointer.startX = p.x;
    pointer.startY = p.y;
    pointer.moved = false;
    pointer.settled = false;
    pointer.cell = -1;

    // 弹窗优先
    if (modal) { modal = null; return; }

    if (collectionOpen) {
      if (hitRect(p, COLL_BTN) || p.y > 620) { collectionOpen = false; }
      return;
    }

    if (hitRect(p, SPAWN_BTN)) { spawnTier1(); return; }
    if (hitRect(p, COLL_BTN)) { collectionOpen = true; return; }
    if (hitRect(p, RESET_BTN)) {
      if (window.confirm('确定要清空存档、重新开始吗？')) resetAll();
      return;
    }

    var i = hitCell(p);
    if (i >= 0 && state.cells[i] > 0) {
      pointer.cell = i;
      startPress(i);        // 仅满级单位会真正启动长按计时
    }
  });

  cv.addEventListener('pointermove', function (ev) {
    if (!pointer.down) return;
    ev.preventDefault();
    var p = toLogic(ev);
    var dx = p.x - pointer.startX, dy = p.y - pointer.startY;
    if (!pointer.moved && (dx * dx + dy * dy) > 100) {
      pointer.moved = true;   // 阈值 10px
      cancelPress();          // 一旦拖动就取消长按，避免误结算
    }
    if (pointer.moved && pointer.cell >= 0) {
      drag = { from: pointer.cell, x: p.x, y: p.y };
    }
  });

  cv.addEventListener('pointerup', function (ev) {
    if (!pointer.down) return;
    ev.preventDefault();
    pointer.down = false;
    var p = toLogic(ev);

    if (pointer.settled) {        // 本次手势已由长按结算消费掉
      pointer.settled = false;
      cancelPress();
      drag = null;
      return;
    }
    cancelPress();

    if (collectionOpen || modal) { drag = null; return; }

    if (pointer.moved && drag) {
      var target = hitCell(p);
      if (target >= 0 && target !== drag.from && doMerge(drag.from, target)) {
        selected = -1;
      } else if (target >= 0 && target === drag.from) {
        handleTap(target);
      }
      drag = null;
      return;
    }

    drag = null;
    if (pointer.cell >= 0) handleTap(pointer.cell);
  });

  cv.addEventListener('pointercancel', function () {
    pointer.down = false;
    pointer.settled = false;
    drag = null;
    cancelPress();
  });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) save();
  });
  window.addEventListener('pagehide', save);
  window.addEventListener('beforeunload', save);

  // ---------- 7. 绘制工具 ----------
  function rr(x, y, w, h, r) {
    if (w <= 0 || h <= 0) return false;          // 动画中尺寸可能瞬时为 0，直接跳过
    r = Math.max(0, Math.min(r, w / 2, h / 2));  // 半径必须非负，否则 arcTo 抛 IndexSizeError
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    return true;
  }

  function fillRR(x, y, w, h, r, color) {
    if (!rr(x, y, w, h, r)) return;
    ctx.fillStyle = color;
    ctx.fill();
  }
  function strokeRR(x, y, w, h, r, color, lw) {
    if (!rr(x, y, w, h, r)) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw || 2;
    ctx.stroke();
  }

  function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || '600') + ' ' + size + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = color;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }

  function shade(hex, k) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    if (k >= 0) {
      r = Math.round(r + (255 - r) * k);
      g = Math.round(g + (255 - g) * k);
      b = Math.round(b + (255 - b) * k);
    } else {
      r = Math.round(r * (1 + k)); g = Math.round(g * (1 + k)); b = Math.round(b * (1 + k));
    }
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  /** sRGB 相对亮度（WCAG 2.1 定义） */
  function srgbLum(hex) {
    var h = hex.replace('#', '');
    var ch = [];
    for (var k = 0; k < 3; k++) {
      var v = parseInt(h.substr(k * 2, 2), 16) / 255;
      ch.push(v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
    }
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  /** WCAG 对比度：(L亮 + 0.05) / (L暗 + 0.05) */
  function contrastRatio(l1, l2) {
    var hi = Math.max(l1, l2) + 0.05;
    var lo = Math.min(l1, l2) + 0.05;
    return hi / lo;
  }

  /**
   * 按底色亮度自动挑选可读性更好的文字色（白 / 近黑）。
   * 直接取两者中对比度更高的那个 —— 对任意底色都能拿到最大值，
   * 黄、白、金这类高亮底色会自动切成深色字，避免出现 1.6:1 这种读不清的组合。
   */
  function contrastText(hex) {
    var L = srgbLum(hex);
    return contrastRatio(1, L) >= contrastRatio(L, srgbLum(TEXT_DARK)) ? TEXT_LIGHT : TEXT_DARK;
  }

  /** 供自测断言使用：某档位单位文字与其底色的实际对比度 */
  function tierTextContrast(tier) {
    var bg = TIER_COLORS[tier - 1];
    return contrastRatio(srgbLum(contrastText(bg)), srgbLum(bg));
  }

  function easeOutBack(t) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function fmt(n) {
    n = Math.floor(n);
    if (n < 10000) return String(n);
    if (n < 100000000) return (n / 10000).toFixed(n < 100000 ? 2 : 1) + '万';
    return (n / 100000000).toFixed(2) + '亿';
  }

  function fmtTime(sec) {
    sec = Math.floor(sec);
    var hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
    if (hh > 0) return hh + ' 小时 ' + mm + ' 分';
    return mm + ' 分 ' + (sec % 60) + ' 秒';
  }

  // ---------- 8. 绘制 ----------
  function drawBackground() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#12121d');
    g.addColorStop(0.55, '#0b0b14');
    g.addColorStop(1, '#08080f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 顶部柔光
    var rg = ctx.createRadialGradient(W / 2, 40, 10, W / 2, 40, 300);
    rg.addColorStop(0, 'rgba(243,156,18,' + (0.10 + bgPulse * 0.25) + ')');
    rg.addColorStop(1, 'rgba(243,156,18,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H * 0.6);
  }

  function drawHud() {
    fillRR(0, 0, W, HUD_H, 0, 'rgba(23,23,36,0.92)');
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(0, HUD_H - 1, W, 1);

    // 金币图标
    ctx.beginPath();
    ctx.arc(30, 27, 11, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(30, 27, 7, 0, Math.PI * 2);
    ctx.fillStyle = shade('#f1c40f', -0.18);
    ctx.fill();

    text('金币', 48, 17, 12, '#8b8b9e');
    text(fmt(state.coins), 48, 39, 26, '#f7d774', 'left', '700');

    // 每秒产出
    var cps = coinsPerSecond();
    fillRR(COLL_BTN.x - 108, 34, 100, 24, 12, 'rgba(46,204,113,0.14)');
    text('+' + fmt(cps) + '/秒', COLL_BTN.x - 58, 46, 13, '#5fe08f', 'center', '700');

    // 图鉴按钮
    drawButton(COLL_BTN, '图鉴', '#3498db');
  }

  function drawButton(b, label, color) {
    fillRR(b.x, b.y, b.w, b.h, 12, shade(color, -0.12));
    fillRR(b.x, b.y, b.w, b.h - 3, 12, color);
    text(label, b.x + b.w / 2, b.y + b.h / 2 - 1, 17, '#ffffff', 'center', '700');
  }

  function drawGrid() {
    fillRR(GRID_X - 9, GRID_Y - 9, GRID_W + 18, GRID_H + 18, 16, 'rgba(255,255,255,0.035)');
    fillRR(GRID_X - 9, GRID_Y - 9, GRID_W + 18, GRID_H + 18, 16, 'rgba(30,30,40,0.85)');

    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var i = idx(r, c);
        var cx = cellCenterX(c), cy = cellCenterY(r);
        var x = cx - CELL / 2, y = cy - CELL / 2;

        // 空槽位
        fillRR(x + 3, y + 3, CELL - 6, CELL - 6, 10, 'rgba(255,255,255,0.045)');

        var tier = state.cells[i];
        if (tier <= 0) continue;

        // 拖拽中的源格：半透明留影
        if (drag && drag.from === i) {
          fillRR(x + 3, y + 3, CELL - 6, CELL - 6, 10, 'rgba(255,255,255,0.10)');
          continue;
        }

        drawUnit(x, y, tier, i, 1);
      }
    }
  }

  function drawUnit(x, y, tier, i, extraAlpha) {
    var a = anim[i];
    var s = 1;
    var alpha = extraAlpha;
    if (a && a.kind) {
      var p = a.t / a.dur;
      if (p < 1) {
        if (p < 0) p = 0;
        // 合成弹跳：从 0.55 倍放大并轻微过冲后回落到 1.0（不会出现 0 尺寸）
        if (a.kind === 'merge') s = 0.55 + 0.45 * easeOutBack(Math.min(1, p * 1.15));
        else if (a.kind === 'spawn') s = 0.5 + 0.5 * easeOutBack(p);
        else if (a.kind === 'clear') alpha = extraAlpha * (1 - p);
      }
    }
    if (!isFinite(s) || s < 0.2) s = 0.2;
    if (!isFinite(alpha)) alpha = 1;

    var color = TIER_COLORS[tier - 1];
    var size = (CELL - 8) * s;
    var px = x + (CELL - size) / 2;
    var py = y + (CELL - size) / 2;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;

    // 渐变色块
    var g = ctx.createLinearGradient(px, py, px, py + size);
    g.addColorStop(0, shade(color, 0.28));
    g.addColorStop(0.5, color);
    g.addColorStop(1, shade(color, -0.22));
    fillRR(px + 4, py + 4, size - 8, size - 8, 12, g);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // 内高光（尺寸不足时跳过，避免出现负宽高）
    if (size - 18 > 0) {
      ctx.globalAlpha *= 0.28;
      fillRR(px + 9, py + 8, size - 18, (size - 8) * 0.32, 8, '#ffffff');
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    }

    // 选中描边
    if (selected === i) {
      strokeRR(px + 1, py + 1, size - 2, size - 2, 13, '#ffffff', 3);
      ctx.globalAlpha *= 0.35;
      strokeRR(px - 3, py - 3, size + 6, size + 6, 15, '#ffffff', 2);
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    }
    // 最高档金边
    if (tier === MAX_TIER) {
      strokeRR(px + 1.5, py + 1.5, size - 3, size - 3, 13, '#ffe58a', 2);
    }

    // 文字色按底色亮度自动挑选，保证对比度达标（黄/白/金底自动用深色字）
    var fg = contrastText(color);

    var fs = Math.max(11, Math.floor(size * 0.40));
    text(String(tier), px + size / 2, py + size / 2, fs, fg, 'center', '800');
    ctx.restore();

    // 档位角标（每秒产出）
    var small = Math.max(9, Math.floor(size * 0.19));
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha)) * 0.85;
    text('+' + COIN_RATE[tier - 1], px + size - 10, py + size - 12, small, fg, 'right', '700');
    ctx.globalAlpha = 1;
  }

  /** 长按满级单位时的进度环（让玩家知道"再按一会儿就能结算"） */
  function drawPressRing() {
    if (press.i < 0 || state.cells[press.i] !== MAX_TIER) return;
    var p = Math.max(0, Math.min(1, press.t / LONG_PRESS_MS));
    var r = Math.floor(press.i / GRID_COLS), c = press.i % GRID_COLS;
    var cx = cellCenterX(c), cy = cellCenterY(r);
    var rad = CELL / 2 - 4;
    ctx.save();
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI * 2); ctx.stroke();
    if (p > 0) {
      ctx.strokeStyle = '#ffe58a';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, rad, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p);
      ctx.stroke();
    }
    ctx.restore();
  }

  function hasMaxTierUnit() {
    for (var i = 0; i < state.cells.length; i++) if (state.cells[i] === MAX_TIER) return true;
    return false;
  }

  function drawSpawnArea() {
    drawButton(SPAWN_BTN, '招募 +1', '#2ecc71');
    var hy = SPAWN_BTN.y + SPAWN_BTN.h + 12;
    // 提示行就地教学，不额外占版面：长按中 > 有满级单位 > 默认
    if (press.i >= 0) {
      text('长按中… 结算可得 +' + fmt(settleValue(MAX_TIER)) + ' 金币', W / 2, hy, 12, '#ffe58a', 'center', '700');
    } else if (hasMaxTierUnit()) {
      text('满级 ' + MAX_TIER + ' 档单位：长按 0.5 秒可结算金币', W / 2, hy, 12, '#f0e2a8', 'center', '700');
    } else {
      text('免费放置 1 个 1 档单位', W / 2, hy, 12, '#6d6d83', 'center', '500');
    }
  }

  function drawLegend() {
    var cps = coinsPerSecond();
    fillRR(16, LEGEND_TOP, W - 32, 26 + MAX_TIER * 26 + 12, 14, 'rgba(255,255,255,0.04)');
    text('档位产出表', 30, LEGEND_TOP + 18, 14, '#cfcfe0', 'left', '700');
    text('合计 +' + fmt(cps) + '/秒', W - 30, LEGEND_TOP + 18, 13, '#5fe08f', 'right', '700');

    for (var i = 0; i < MAX_TIER; i++) {
      var y = LEGEND_TOP + 40 + i * 26;
      fillRR(30, y - 8, 18, 18, 6, TIER_COLORS[i]);
      text((i + 1) + ' 档', 56, y + 1, 13, '#b9b9cc', 'left', '600');
      // 第 i 张卡对应第 (i+1) 阶形态：合出该阶即解锁。
      // 用 i+1 而不是 i+2，才能保证最高阶形态也有自己的卡（否则最后一张永远拿不到）。
      var unlocked = state.highestTier >= i + 1;
      text(unlocked ? CHARACTER_NAMES[i] : '??? （合出 ' + (i + 1) + ' 档解锁）',
           104, y + 1, 13, unlocked ? '#f0e2a8' : '#5c5c72', 'left', unlocked ? '700' : '500');
      text('+' + COIN_RATE[i] + '/秒', W - 30, y + 1, 13, '#8fd8a8', 'right', '600');
    }
  }

  function drawStats() {
    var y = LEGEND_TOP + 40 + MAX_TIER * 26 + 16;
    var line = '已合成 ' + state.merges + ' 次   ·   最高档位 ' + state.highestTier +
               '   ·   图鉴 ' + unlockedCardCount() + '/' + MAX_TIER;
    if (state.settles > 0) line += '   ·   已结算 ' + state.settles + ' 次';
    text(line, W / 2, y, 12, '#6d6d83', 'center', '500');
  }

  /** 当前已解锁的图鉴卡数量（第 i 张卡在 highestTier ≥ i+1 时解锁） */
  function unlockedCardCount() {
    var n = 0;
    for (var i = 0; i < MAX_TIER; i++) if (state.highestTier >= i + 1) n++;
    return n;
  }

  /** 最高档位是否已解锁最后一张卡（自测用） */
  function isLastCardUnlocked() {
    return state.highestTier >= MAX_TIER;
  }

  function drawBottom() {
    drawButton(RESET_BTN, '重置存档', '#c0392b');
    var ok = false;
    try { ok = !!localStorage.getItem(SAVE_KEY); } catch (e) {}
    text(ok ? '自动存档已开启' : '尚无存档（首次开局）', W / 2, H - 22, 11, '#4f4f63', 'center', '500');
  }

  function drawFloats(dt) {
    for (var i = floats.length - 1; i >= 0; i--) {
      var f = floats[i];
      f.t += dt;
      var p = f.t / f.dur;
      if (p >= 1) { floats.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - p;
      text(f.text, f.x, f.y - 8 - p * 30, 15, '#ffe58a', 'center', '800');
      ctx.globalAlpha = 1;
    }
  }

  function drawDragGhost() {
    if (!drag) return;
    var tier = state.cells[drag.from];
    if (tier <= 0) return;
    // 高亮可合并目标
    var hover = hitCell(drag);
    for (var r = 0; r < GRID_ROWS; r++) {
      for (var c = 0; c < GRID_COLS; c++) {
        var i = idx(r, c);
        if (state.cells[i] === tier && i !== drag.from && tier < MAX_TIER) {
          var cx = cellCenterX(c), cy = cellCenterY(r);
          if (i === hover) strokeRR(cx - CELL / 2 + 2, cy - CELL / 2 + 2, CELL - 4, CELL - 4, 12, '#5fe08f', 4);
          else strokeRR(cx - CELL / 2 + 2, cy - CELL / 2 + 2, CELL - 4, CELL - 4, 12, 'rgba(95,224,143,0.45)', 2);
        }
      }
    }
    ctx.save();
    ctx.globalAlpha = 0.92;
    drawUnit(drag.x - CELL / 2, drag.y - CELL / 2 - 10, tier, drag.from, 1);
    ctx.restore();
  }

  function drawCollection() {
    ctx.fillStyle = 'rgba(6,6,12,0.94)';   // 近乎不透明，避免底层按钮/文字透出叠字
    ctx.fillRect(0, 0, W, H);
    text('角色图鉴', W / 2, 66, 24, '#ffffff', 'center', '800');
    text('合出对应档位即可解锁', W / 2, 92, 12, '#9a9ab0', 'center', '500');

    var cardW = (W - 32 - 14) / 2;
    var cardH = 92;
    var startY = 122;
    for (var i = 0; i < MAX_TIER; i++) {
      var r = Math.floor(i / 2), c = i % 2;
      var x = 16 + c * (cardW + 14);
      var y = startY + r * (cardH + 12);
      var unlocked = state.highestTier >= i + 1;

      var bg = unlocked ? shade(TIER_COLORS[i], -0.45) : 'rgba(255,255,255,0.06)';
      fillRR(x, y, cardW, cardH, 14, bg);
      strokeRR(x, y, cardW, cardH, 14, unlocked ? TIER_COLORS[i] : 'rgba(255,255,255,0.10)', 2);

      fillRR(x + 12, y + 12, 34, 34, 10,
             unlocked ? TIER_COLORS[i] : 'rgba(255,255,255,0.10)');
      if (unlocked) {
        text(String(i + 1), x + 29, y + 30, 17, contrastText(TIER_COLORS[i]), 'center', '800');
      } else {
        text('?', x + 29, y + 30, 17, '#6d6d83', 'center', '800');
      }

      text(unlocked ? CHARACTER_NAMES[i] : '未解锁', x + 56, y + 27, 13,
           unlocked ? '#ffffff' : '#6d6d83', 'left', '700');
      text(unlocked ? '+' + COIN_RATE[i] + '/秒' : '需要 ' + (i + 1) + ' 档', x + 56, y + 50, 12,
           unlocked ? '#8fd8a8' : '#5c5c72', 'left', '600');
      text('卡 ' + (i + 1), x + cardW - 12, y + cardH - 14, 11, 'rgba(255,255,255,0.35)', 'right', '500');
    }

    var btn = { x: W / 2 - 80, y: H - 96, w: 160, h: 48 };
    drawButton(btn, '关闭', '#3498db');
    text('（点击任意空白处也可关闭）', W / 2, H - 30, 11, '#6d6d83', 'center', '500');
  }

  function drawModal() {
    ctx.fillStyle = 'rgba(0,0,0,0.78)';
    ctx.fillRect(0, 0, W, H);
    var bw = W - 72, bh = 200, bx = 36, by = H / 2 - bh / 2;
    fillRR(bx, by, bw, bh, 18, '#1c1c2a');
    strokeRR(bx, by, bw, bh, 18, 'rgba(243,196,15,0.5)', 2);

    text('离线收益已到账', W / 2, by + 40, 19, '#f7d774', 'center', '800');
    text('+' + fmt(modal.amount), W / 2, by + 84, 34, '#5fe08f', 'center', '800');
    text('离线 ' + fmtTime(modal.seconds) + '（8 小时封顶 · 50% 效率）',
         W / 2, by + 120, 12, '#9a9ab0', 'center', '500');
    text('当前每秒产出 +' + fmt(modal.rate), W / 2, by + 142, 12, '#6d6d83', 'center', '500');

    var btn = { x: bx + 24, y: by + bh - 60, w: bw - 48, h: 44 };
    drawButton(btn, '开始游戏', '#2ecc71');
  }

  function drawToast() {
    if (!toast) return;
    ctx.globalAlpha = Math.min(1, toast.t * 2);
    var w = 300, h = 36, x = (W - w) / 2, y = HUD_H + 14;
    fillRR(x, y, w, h, 18, 'rgba(0,0,0,0.82)');
    text(toast.text, W / 2, y + h / 2, 13, '#ffe58a', 'center', '600');
    ctx.globalAlpha = 1;
  }

  function render(dt) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawHud();
    drawGrid();
    drawPressRing();
    drawDragGhost();
    drawSpawnArea();
    drawLegend();
    drawStats();
    if (!collectionOpen) drawBottom();   // 图鉴打开时不画底部存档区，避免隔着面板透出叠字
    drawFloats(dt);
    drawToast();
    if (collectionOpen) drawCollection();
    if (modal) drawModal();
  }

  // ---------- 9. 主循环 ----------
  function update(dt) {
    // 放置收益（每帧按真实时间结算，与原型每秒结算等价）
    var cps = coinsPerSecond();
    if (cps > 0) state.coins += cps * dt;

    for (var i = 0; i < anim.length; i++) {
      var a = anim[i];
      if (a.kind) {
        a.t += dt;
        if (a.t >= a.dur) { a.t = 1; a.kind = null; }
      }
    }
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }
    if (bgPulse > 0) bgPulse = Math.max(0, bgPulse - dt * 1.2);
    if (press.i >= 0) press.t += dt * 1000;   // 长按进度环

    saveTimer += dt;
    if (saveTimer >= 2) { saveTimer = 0; save(); }
  }

  function loop(ts) {
    var now = ts / 1000;
    var dt = lastFrame ? Math.min(0.1, now - lastFrame) : 0;
    lastFrame = now;
    if (!modal) update(dt);
    render(dt);
    requestAnimationFrame(loop);
  }

  // ---------- 10. 启动 ----------
  function boot() {
    resize();
    load();
    if (state.cells.every(function (v) { return v === 0; }) && state.merges === 0 && state.coins === 0) {
      for (var i = 0; i < INITIAL_UNITS; i++) spawnTier1();
      toast = { text: '点击两个同档单位即可合并升档（也支持拖拽）', t: 3.2 };
    }
    window.__gameReady = true;
    requestAnimationFrame(loop);
  }

  // 暴露给自动化验证使用
  window.__game = {
    state: state,
    coinsPerSecond: coinsPerSecond,
    spawnTier1: spawnTier1,
    doMerge: doMerge,
    handleTap: handleTap,
    hitCellAt: function (r, c) { return { x: cellCenterX(c), y: cellCenterY(r) }; },
    cellCenterX: cellCenterX,
    cellCenterY: cellCenterY,
    save: save,
    saveKey: SAVE_KEY,
    version: 'h5-fallback-1.1.0',
    isReady: function () { return window.__gameReady === true; },
    isCollectionOpen: function () { return collectionOpen; },
    isModalOpen: function () { return !!modal; },
    // T-007 三项修复的自测钩子
    settleValue: settleValue,
    doSettle: doSettle,
    settleSeconds: SETTLE_SECONDS,
    longPressMs: LONG_PRESS_MS,
    maxTier: MAX_TIER,
    isPressActive: function () { return press.i >= 0; },
    canSettleAt: canSettle,
    cardUnlocked: function (i) { return state.highestTier >= i + 1; },
    unlockedCardCount: unlockedCardCount,
    isLastCardUnlocked: isLastCardUnlocked,
    tierTextColor: function (tier) { return contrastText(TIER_COLORS[tier - 1]); },
    tierTextContrast: tierTextContrast,
    allTierContrasts: function () {
      var out = [];
      for (var t = 1; t <= MAX_TIER; t++) {
        out.push({ tier: t, color: TIER_COLORS[t - 1], text: contrastText(TIER_COLORS[t - 1]),
                   ratio: Math.round(tierTextContrast(t) * 100) / 100 });
      }
      return out;
    },
    layout: {
      W: W, H: H, GRID_X: GRID_X, GRID_Y: GRID_Y, CELL: CELL, GAP: GAP,
      COLS: GRID_COLS, ROWS: GRID_ROWS,
      SPAWN_BTN: SPAWN_BTN, COLL_BTN: COLL_BTN, RESET_BTN: RESET_BTN
    },
    // 逻辑坐标 -> 页面 CSS 坐标（供自动化测试派发真实指针事件）
    toClient: function (x, y) {
      var r = cv.getBoundingClientRect();
      return { x: r.left + view.ox + x * view.scale, y: r.top + view.oy + y * view.scale };
    }
  };

  boot();
})();
</script>
</body>
</html>
